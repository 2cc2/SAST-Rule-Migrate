rules:
  - id: extract-user-data-function-names
    message: "检测到接受至少一个参数（被标记为 $USER_DATA）的函数名：$FUNC_NAME"
    languages:
      - java
    severity: INFO
    
    # 使用 pattern-inside 匹配您要求的函数声明结构
    pattern-inside: |
      $TYPE $FUNC_NAME($ARG1, $USER_DATA, $ARG2) {
        ...
      }
      
    # 核心逻辑：确保我们匹配了目标结构
    pattern-either:
      # 匹配带有至少一个参数的函数声明
      - pattern: |
          $TYPE $FUNC_NAME($USER_DATA) {
            ...
          }
      # 匹配带有多个参数，且其中一个是 $USER_DATA 的函数声明
      - pattern: |
          $TYPE $FUNC_NAME(..., $USER_DATA, ...) {
            ...
          }

    # 报告中，我们只关心捕获到的函数名 $FUNC_NAME
    # metavariable-comparison 确保我们只报告 $FUNC_NAME 的值
    # metavariable-comparison:
      # 这行确保 $FUNC_NAME 不为空，并且是您想要捕获的结果
      # $FUNC_NAME != ""
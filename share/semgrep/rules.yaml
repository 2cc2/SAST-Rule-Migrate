rules:
  - id: os-command-injection-custom-pattern
    message: "检测到潜在的OS命令注入漏洞。用户输入未经安全检查，被传递给了ProcessBuilder.command方法。"
    severity: ERROR
    languages:
      - java
    # mode: taint
    # 您的所有模式都需要被放在一个规则下的顶层模式键中
    pattern-either: 
      # 您的原始代码开始
      - patterns:
          - pattern-inside: |
               $TYPE $FUNCDECL(..., $USER_DATA, ...) { ... }
          - pattern-either:
              # 场景1：用户输入直接传入ProcessBuilder.command
              - pattern: |
                  $PB.command(..., $USER_DATA, ...)
              # 场景2：用户输入经赋值/trim处理后传入命令
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $X = $USER_DATA; ...
                      - pattern-inside: |
                          $X = trim($USER_DATA); ...
                  - pattern-inside: |
                      $PB.command(..., $X, ...);
      # 您的原始代码结束
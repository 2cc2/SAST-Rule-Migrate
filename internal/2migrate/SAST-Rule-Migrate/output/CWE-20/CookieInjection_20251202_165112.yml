rules:
- id: cookie-injection
  languages: [python]
  severity: WARNING
  message: Constructing cookies from user input may allow an attacker to perform a Cookie Poisoning attack
  metadata:
    references:
    - https://cwe.mitre.org/data/definitions/20.html
    category: security
    cwe: "CWE-20: Improper Input Validation"
    owasp:
    - A03:2021 - Injection
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: HIGH
    confidence: HIGH
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $COOKIE = flask.request.cookies.get(...)
      - pattern: $COOKIE = django.http.request.COOKIES.get(...)
      - pattern: $COOKIE = webob.request.cookies.get(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: flask.Response.set_cookie(..., $COOKIE, ...)
      - pattern: django.http.response.set_cookie(..., $COOKIE, ...)
      - pattern: webob.response.set_cookie(..., $COOKIE, ...)
rules:
  - id: cookie-injection
    message: Cookie is constructed from a user-supplied input
    languages: [python]
    severity: WARNING
    patterns:
      - pattern-inside: |
          $COOKIE = $VALUE
          ...
      - pattern-either:
          - pattern: response.set_cookie($COOKIE, $VALUE)
          - pattern: HttpResponse().set_cookie($COOKIE, $VALUE)
          - pattern: SimpleCookie().set_cookie($COOKIE, $VALUE)
    metadata:
      cwe: "CWE-020"
      category: security
      confidence: HIGH
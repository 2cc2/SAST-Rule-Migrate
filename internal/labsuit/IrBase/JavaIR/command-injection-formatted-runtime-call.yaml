```yaml
xcpgir_version: "1.0"
rule:
  id: command-injection-formatted-runtime-call
  kind: taint
  severity: ERROR
  message: |
    A formatted or concatenated string was detected as input to a java.lang.Runtime
    call.
    This is dangerous if a variable is controlled by user input and could result in
    a
    command injection. Ensure your variables are not controlled by users or sufficiently
    sanitized.
  metadata:
    language: java
    category: security
    cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
    owasp:
      - "A01:2017 - Injection"
      - "A03:2021 - Injection"

sources:
  - id: USER_CONTROLLED_INPUT
    match:
      node: PARAM | LOCAL
      where:
        - op: not_eq
          left: source
          right: "literal"

sinks:
  - id: RUNTIME_EXEC
    match:
      node: CALL
      api:
        type: java.lang.Runtime
        method: exec
      arg_index: [0, 1, 2]
  - id: RUNTIME_LOAD_LIBRARY
    match:
      node: CALL
      api:
        type: java.lang.Runtime
        method: loadLibrary
      arg_index: 0

sanitizers:
  - id: LITERAL_ARG
    match:
      node: LITERAL
    effect: neutralize
    scope:
      sinks: [RUNTIME_EXEC, RUNTIME_LOAD_LIBRARY]

propagations:
  - id: STRING_CONCAT
    edge: arg->param
    kind: taint
  - id: FORMAT_STRING
    edge: arg->param
    kind: taint
```
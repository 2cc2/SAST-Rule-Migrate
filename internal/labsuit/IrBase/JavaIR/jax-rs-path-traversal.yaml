```yaml
xcpgir_version: "1.0"
rule:
  id: "jax-rs-path-traversal"
  kind: taint
  severity: WARNING
  message: "Detected a potential path traversal. A malicious actor could control the location of this file, to include going backwards in the directory with '../'. To address this, ensure that user-controlled variables in file paths are sanitized. You may also consider using a utility method such as org.apache.commons.io.FilenameUtils.getName(...) to only retrieve the file name from the path."
  metadata:
    language: java
    category: security
    tags:
      - jax-rs
sources:
  - id: PATH_PARAM
    match:
      node: METHOD_PARAMETER_IN
      where:
        - op: regex
          left: typeFullName
          right: "@PathParam|@javax.ws.rs.PathParam"
sinks:
  - id: FILE_CREATION
    match:
      node: CALL
      api:
        type: java.io.File
        method: "<init>"
      where:
        - op: contains
          left: code
          right: $VAR
propagations:
  - id: PARAM_TO_ARG
    edge: arg->param
    kind: taint
sanitizers:
  - id: FILENAME_UTILS
    match:
      node: CALL
      api:
        type: org.apache.commons.io.FilenameUtils
        method: getName
    effect: neutralize
    scope:
      sinks: [FILE_CREATION]
```
```yaml
xcpgir_version: "1.0"
rule:
  id: "spring-sqli"
  kind: taint
  severity: WARNING
  message: "Detected a string argument from a public method contract in a raw SQL statement. This could lead to SQL injection if variables in the SQL statement are not properly sanitized. Use a prepared statements (java.sql.PreparedStatement) instead. You can obtain a PreparedStatement using 'connection.prepareStatement'."
  metadata:
    language: java
    category: security
    technology:
      - spring
    cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
    owasp:
      - "A01:2017 - Injection"
      - "A03:2021 - Injection"
sources:
  - id: USER_INPUT
    match:
      node: METHOD_PARAMETER_IN
      type:
        name: String
        match: exact
      where:
        - op: eq
          left: parentMethod.modifiers
          right: public
sinks:
  - id: SQL_EXEC
    match:
      node: CALL
      api:
        type: PreparedStatementCreatorFactory
        method: constructor
      arg_index: 0
  - id: SQL_EXEC_JDBC
    match:
      node: CALL
      api:
        type: JdbcTemplate
        method: any
      arg_index: 0
  - id: SQL_BATCH_UPDATE
    match:
      node: CALL
      api:
        type: JdbcTemplate
        method: batchUpdate
      arg_index: any
  - id: SQL_NAMED_BATCH
    match:
      node: CALL
      api:
        type: NamedParameterBatchUpdateUtils
        method: any
      arg_index: 0
  - id: SQL_BATCH_UTILS
    match:
      node: CALL
      api:
        type: BatchUpdateUtils
        method: any
      arg_index: 0
sanitizers:
  - id: SAFE_CONSTRUCTOR
    match:
      node: CALL
      api:
        type: any
        method: constructor
    effect: neutralize
propagations:
  - id: ARG_TO_ARG
    edge: arg->param
    kind: taint
```
```yaml
xcpgir_version: "1.0"
rule:
  id: "el-injection"
  kind: taint
  severity: WARNING
  message: "An expression is built with a dynamic value. The source of the value(s) should be verified to avoid that unfiltered values fall into this risky code evaluation."
  metadata:
    language: java
    category: security
    cwe: "CWE-94: Improper Control of Generation of Code ('Code Injection')"
    owasp: "A03:2021 - Injection"
sources:
  - id: DYNAMIC_INPUT
    match:
      node: METHOD_PARAMETER_IN
      where:
        - op: neq
          left: value
          right: "\"...\""
sinks:
  - id: EL_EXPRESSION
    match:
      node: CALL
      api:
        type: javax.el.ExpressionFactory
        method: createValueExpression
      arg_index: 1
  - id: METHOD_EXPRESSION
    match:
      node: CALL
      api:
        type: javax.el.ExpressionFactory
        method: createMethodExpression
      arg_index: 1
  - id: CONSTRAINT_VIOLATION
    match:
      node: CALL
      api:
        method: buildConstraintViolationWithTemplate
      arg_index: 0
sanitizers:
  - id: LITERAL_STRING
    match:
      node: LITERAL
      where:
        - op: eq
          left: value
          right: "\"...\""
    effect: neutralize
    scope:
      sinks: [EL_EXPRESSION, METHOD_EXPRESSION, CONSTRAINT_VIOLATION]
propagations:
  - id: PARAM_TO_CALL
    edge: arg->param
    kind: taint
```
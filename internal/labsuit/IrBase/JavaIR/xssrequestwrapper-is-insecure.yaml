```yaml
xcpgir_version: "1.0"
rule:
  id: "xssrequestwrapper-is-insecure"
  kind: pattern
  severity: WARNING
  message: "It looks like you're using an implementation of XSSRequestWrapper from dzone. (https://www.javacodegeeks.com/2012/07/anti-cross-site-scripting-xss-filter.html) The XSS filtering in this code is not secure and can be bypassed by malicious actors. It is recommended to use a stack that automatically escapes in your view or templates instead of filtering yourself."
  metadata:
    language: java
    category: security
    owasp:
      - "A07:2017 - Cross-Site Scripting (XSS)"
      - "A03:2021 - Injection"
    cwe:
      - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
    references:
      - "https://owasp.org/Top10/A03_2021-Injection"
      - "https://find-sec-bugs.github.io/bugs.htm#XSS_REQUEST_WRAPPER"
      - "https://www.javacodegeeks.com/2012/07/anti-cross-site-scripting-xss-filter.html"

sources:
  - id: XSS_REQUEST_WRAPPER
    match:
      node: TYPE_DECL
      where:
        - op: eq
          left: name
          right: "XSSRequestWrapper"

  - id: INSECURE_SCRIPT_FILTER
    match:
      node: CALL
      api:
        type: "Pattern"
        method: "compile"
      where:
        - op: eq
          left: arg[0].value
          right: "</script>"

sinks:
  - id: XSS_SINK
    match_patterns:
      - "class XSSRequestWrapper extends HttpServletRequestWrapper { ... }"
      - "$P = $X.compile(\"</script>\", $X.CASE_INSENSITIVE); $V = $P.matcher(...).replaceAll(\"\");"
```
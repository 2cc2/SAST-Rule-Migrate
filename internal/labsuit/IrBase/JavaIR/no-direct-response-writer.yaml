```yaml
xcpgir_version: "1.0"
rule:
  id: "no-direct-response-writer"
  kind: taint
  severity: WARNING
  message: "Detected a request with potential user-input going into a OutputStream or Writer object. This bypasses any view or template environments, including HTML escaping, which may expose this application to cross-site scripting (XSS) vulnerabilities. Consider using a view technology such as JavaServer Faces (JSFs) which automatically escapes HTML views."
  metadata:
    language: java
    category: security
    cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
    owasp: 
      - "A07:2017 - Cross-Site Scripting (XSS)"
      - "A03:2021 - Injection"

sources:
  - id: HTTP_REQUEST
    match:
      node: CALL
      api:
        type: "javax.servlet.http.HttpServletRequest"
        method: 
          - "getInputStream"
          - "getParameter"
          - "getParameterMap"
          - "getParameterValues"
          - "getReader"
          - "getCookies"
          - "getHeader"
          - "getHeaderNames"
          - "getHeaders"
          - "getPart"
          - "getParts"
          - "getQueryString"

sinks:
  - id: RESPONSE_WRITER
    match:
      node: CALL
      api:
        type: 
          - "javax.servlet.http.HttpServletResponse"
          - "java.io.PrintWriter"
          - "javax.servlet.ServletOutputStream"
          - "java.io.OutputStream"
        method: "write"

sanitizers:
  - id: HTML_ESCAPE
    match:
      node: CALL
      api:
        type:
          - "org.apache.commons.lang.StringEscapeUtils"
          - "org.springframework.web.util.HtmlUtils"
          - "org.owasp.esapi.ESAPI"
        method:
          - "escapeHtml"
          - "htmlEscape"
          - "encodeForHTML"
    effect: neutralize
    scope: 
      sinks: ["RESPONSE_WRITER"]
```
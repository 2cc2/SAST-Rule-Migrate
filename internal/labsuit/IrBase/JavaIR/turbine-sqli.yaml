```yaml
xcpgir_version: "1.0"
rule:
  id: turbine-sqli
  kind: taint
  severity: WARNING
  message: "Detected a formatted string in a SQL statement. This could lead to SQL injection if variables in the SQL statement are not properly sanitized. Use a prepared statements (java.sql.PreparedStatement) instead. You can obtain a PreparedStatement using 'connection.prepareStatement'."
  metadata:
    language: java
    category: security
    cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
    owasp:
      - A01:2017 - Injection
      - A03:2021 - Injection
    technology:
      - turbine

sources:
  - id: SQL_CONCAT
    match:
      node: CALL
      where:
        - op: or
          conditions:
            - left: methodFullName
              op: regex
              right: "String.format"
            - left: code
              op: contains
              right: "+"
  - id: SQL_PARAM
    match:
      node: PARAM
      where:
        - left: name
          op: eq
          right: "$SQL"

sinks:
  - id: SQL_EXEC
    match:
      node: CALL
      api:
        type: "BasePeer|GroupPeer"
        method: executeQuery
      arg_index: 0

sanitizers:
  - id: LITERAL_SQL
    match:
      node: LITERAL
      where:
        - left: code
          op: regex
          right: '^".+"$'

propagations:
  - id: SQL_TO_EXEC
    edge: arg->param
    kind: taint
```
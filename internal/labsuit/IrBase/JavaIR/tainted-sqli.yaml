```yaml
xcpgir_version: "1.0"
rule:
  id: "tainted-sqli"
  kind: taint
  severity: WARNING
  message: "Detected SQL statement that is tainted by `$EVENT` object. This could lead to SQL injection if variables in the SQL statement are not properly sanitized. Use parameterized SQL queries or properly sanitize user input instead."
  metadata:
    language: java
    category: security
    technology:
      - sql
      - java
      - aws-lambda
    cwe:
      - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
    owasp:
      - A01:2017 - Injection
      - A03:2021 - Injection
    references:
      - https://owasp.org/Top10/A03_2021-Injection
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM

sources:
  - id: EVENT_OBJECT
    match:
      node: METHOD_PARAMETER_IN
      where:
        - op: or
          conditions:
            - op: and
              conditions:
                - op: regex
                  left: methodSignature
                  right: "\\(\\$TYPE.*,com\\.amazonaws\\.services\\.lambda\\.runtime\\.Context\\)"
                - op: eq
                  left: name
                  right: "$EVENT"
            - op: and
              conditions:
                - op: regex
                  left: methodSignature
                  right: "\\(InputStream.*,OutputStream.*,com\\.amazonaws\\.services\\.lambda\\.runtime\\.Context\\)"
                - op: eq
                  left: name
                  right: "$EVENT"

sinks:
  - id: SQL_EXECUTION
    match:
      node: CALL
      api:
        type: 
          - "java.sql.Statement"
          - "java.sql.PreparedStatement"
          - "java.sql.CallableStatement"
          - "org.springframework.jdbc.core.JdbcTemplate"
          - "java.sql.Connection"
          - "org.springframework.jdbc.support.rowset.SqlRowSet"
        method: 
          - "execute"
          - "executeQuery"
          - "executeUpdate"
          - "batchUpdate"
          - "queryForObject"
          - "queryForMap"
          - "prepareStatement"
      arg_index: 0
      where:
        - op: regex
          left: arg[0].value
          right: "(?i)(^SELECT.* | ^INSERT.* | ^UPDATE.*)"

propagations:
  - id: PARAM_TO_SQL
    edge: arg->param
    kind: taint
    interfile: true
```
```yaml
xcpgir_version: "1.0"
rule:
  id: "mysql-sqli"
  kind: taint
  severity: WARNING
  message: "Detected SQL statement that is tainted by `event` object. This could lead to SQL injection if the variable is user-controlled and not properly sanitized."
  tags:
    - python
    - aws-lambda
    - mysql
  metadata:
    language: python
    category: security
    references:
      - https://dev.mysql.com/doc/connector-python/en/connector-python-api-mysqlcursor-execute.html
      - https://dev.mysql.com/doc/connector-python/en/connector-python-api-mysqlcursor-executemany.html
    owasp:
      - A01:2017 - Injection
      - A03:2021 - Injection
    cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"

sources:
  - id: AWS_LAMBDA_EVENT
    match:
      node: PARAM
      where:
        - op: eq
          left: name
          right: "event"
      pattern-inside: |
        def $HANDLER(event, context):
          ...

sinks:
  - id: MYSQL_EXECUTE
    match:
      node: CALL
      api:
        type: mysql.cursors
        method: execute
      arg_index: 0
      pattern-either:
        - pattern: $CURSOR.execute($QUERY,...)
        - pattern: $CURSOR.executemany($QUERY,...)
      pattern-inside: |
        import mysql
        ...
      pattern-inside: |
        import mysql.cursors
        ...

sanitizers: []
propagations: []
```
```yaml
xcpgir_version: "1.0"
rule:
  id: "direct-use-of-jinja2"
  kind: taint
  severity: WARNING
  message: "Detected direct use of jinja2. If not done properly, this may bypass HTML escaping which opens up the application to cross-site scripting (XSS) vulnerabilities. Prefer using the Flask method 'render_template()' and templates with a '.html' extension in order to prevent XSS."
  metadata:
    language: python
    category: security
    cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
    owasp: ["A07:2017 - Cross-Site Scripting (XSS)", "A03:2021 - Injection"]
    technology: ["flask"]

sources:
  - id: JINJA2_ENV
    match:
      node: CALL
      api:
        package: jinja2
        type: Environment
  - id: JINJA2_TEMPLATE_RENDER
    match:
      node: CALL
      api:
        package: jinja2
        type: Template
        method: render

sinks:
  - id: TEMPLATE_RENDER_FLOW
    match:
      node: CALL
      api:
        method: render
      where:
        - op: eq
          left: "receiver.name"
          right: "$TEMPLATE"

sanitizers:
  - id: FLASK_RENDER_TEMPLATE
    match:
      node: CALL
      api:
        method: render_template
    effect: neutralize
    scope:
      sinks: [TEMPLATE_RENDER_FLOW]

propagations:
  - id: TEMPLATE_ASSIGNMENT
    edge: arg->param
    kind: taint
```
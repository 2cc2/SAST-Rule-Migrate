```yaml
xcpgir_version: "1.0"
rule:
  id: "template-unquoted-attribute-var"
  kind: taint
  severity: WARNING
  message: "Detected a unquoted template variable as an attribute. If unquoted, a malicious actor could inject custom JavaScript handlers. To fix this, add quotes around the template expression, like this: \"{{ $...VAR }}\"."
  metadata:
    language: "generic"
    category: "security"
    cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
    owasp: ["A07:2017 - Cross-Site Scripting (XSS)", "A03:2021 - Injection"]
    technology: ["flask"]

sources:
  - id: USER_INPUT
    match:
      node: CALL
      where:
        - op: regex
          left: methodFullName
          right: "request\\.(\\w+)\\.(get|\\['\\w+'\\])"

sinks:
  - id: UNQUOTED_ATTRIBUTE
    match:
      node: LITERAL
      where:
        - op: regex
          left: value
          right: "=\\{\\{\\$(.*)\\}\\}"

sanitizers:
  - id: PROPER_QUOTING
    match:
      node: LITERAL
      where:
        - op: regex
          left: value
          right: "=\"\\{\\{\\$(.*)\\}\\}\""
    effect: neutralize

propagations:
  - id: VAR_TO_TEMPLATE
    edge: AST
    kind: taint
```
```yaml
xcpgir_version: "1.0"
rule:
  id: "explicit-unescape-with-markup"
  kind: taint
  severity: WARNING
  message: "Detected explicitly unescaped content using 'Markup()'. This permits the unescaped data to include unescaped HTML which could result in cross-site scripting. Ensure this data is not externally controlled, or consider rewriting to not use 'Markup()'."
  metadata:
    language: python
    category: security
    technology:
      - flask
    cwe:
      - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
    owasp:
      - A07:2017 - Cross-Site Scripting (XSS)
      - A03:2021 - Injection

sources:
  - id: UNESCAPED_INPUT
    match:
      node: CALL
      api:
        package: flask
        type: Markup
        method: unescape
        signature: ["(...)"]

sinks:
  - id: XSS_SINK
    match:
      node: CALL
      api:
        package: 
          - flask
          - markupsafe
        type: Markup
        method: "__init__"
        signature: ["(...)"]
      arg_index: 0
      where:
        - op: neq
          left: value
          right: '""""'

propagations:
  - id: METHOD_CALL
    edge: arg->param
    kind: taint
```
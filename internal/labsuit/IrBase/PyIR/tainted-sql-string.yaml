```yaml
xcpgir_version: "1.0"
rule:
  id: "tainted-sql-string"
  kind: taint
  severity: ERROR
  message: "Detected user input used to manually construct a SQL string. This is usually bad practice because manual construction could accidentally result in a SQL injection. An attacker could use a SQL injection to steal or modify contents of the database. Instead, use a parameterized query which is available by default in most database engines. Alternatively, consider using an object-relational mapper (ORM) such as SQLAlchemy which will protect your queries."
  tags:
    - python
    - sqlalchemy
    - flask
  metadata:
    language: python
    category: security
    cwe: ["CWE-704: Incorrect Type Conversion or Cast"]
    owasp: ["A01:2017 - Injection", "A03:2021 - Injection"]
    references:
      - "https://docs.sqlalchemy.org/en/14/core/tutorial.html#using-textual-sql"
      - "https://www.tutorialspoint.com/sqlalchemy/sqlalchemy_quick_guide.htm"

sources:
  - id: USER_INPUT
    match:
      node: CALL
      api:
        type: flask.request
        method: $ANYTHING
  - id: ROUTE_PARAM
    match:
      node: METHOD_PARAMETER_IN
      where:
        - op: regex
          left: name
          right: "^\\$ROUTEVAR$"

sinks:
  - id: SQL_CONCAT
    match:
      node: LITERAL
      where:
        - op: regex
          left: code
          right: "\"\\$SQLSTR\" \\+ .+|\"\\$SQLSTR\" % .+|\"\\$SQLSTR\"\\.format\\(.+\\)|f\"\\$SQLSTR\\{.+\\}.+\""
        - op: regex
          left: code
          right: "\\s*(?i)(select|delete|insert|create|update|alter|drop)\\b.*"

sanitizers: []

propagations:
  - id: ARG_TO_ARG
    edge: arg->arg
    kind: taint
  - id: ASSIGN_TO_VAR
    edge: assign->var
    kind: taint
  - id: RETURN_TO_ARG
    edge: return->arg
    kind: taint
```
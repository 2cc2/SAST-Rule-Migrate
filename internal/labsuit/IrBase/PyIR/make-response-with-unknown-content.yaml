```yaml
xcpgir_version: "1.0"
rule:
  id: make-response-with-unknown-content
  kind: taint
  severity: WARNING
  message: "Be careful with `flask.make_response()`. If this response is rendered onto a webpage, this could create a cross-site scripting (XSS) vulnerability. `flask.make_response()` will not autoescape HTML. If you are rendering HTML, write your HTML in a template file and use `flask.render_template()` which will take care of escaping. If you are returning data from an API, consider using `flask.jsonify()`."
  metadata:
    language: python
    category: security
    cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
    owasp:
      - "A07:2017 - Cross-Site Scripting (XSS)"
      - "A03:2021 - Injection"
    technology:
      - flask

sources:
  - id: UNKNOWN_CONTENT
    match:
      node: CALL
      api:
        package: flask
        method: make_response
      where:
        - op: neq
          left: arg0
          right: flask.render_template(...)
        - op: neq
          left: arg0
          right: flask.jsonify(...)
        - op: neq
          left: arg0
          right: json.dumps(...)
        - op: neq
          left: arg0
          right: flask.redirect(...)

sinks:
  - id: XSS_SINK
    match:
      node: CALL
      api:
        package: flask
        method: make_response
      arg_index: 0

sanitizers:
  - id: TEMPLATE_RENDER
    match:
      node: CALL
      api:
        package: flask
        method: render_template
    effect: neutralize
    scope:
      sinks: [XSS_SINK]
  - id: JSONIFY
    match:
      node: CALL
      api:
        package: flask
        method: jsonify
    effect: neutralize
    scope:
      sinks: [XSS_SINK]
  - id: JSON_DUMPS
    match:
      node: CALL
      api:
        package: json
        method: dumps
    effect: neutralize
    scope:
      sinks: [XSS_SINK]
```
```yaml
xcpgir_version: "1.0"
rule:
  id: csv-writer-injection
  kind: taint
  severity: ERROR
  message: Detected user input into a generated CSV file using the built-in `csv` module. If user data is used to generate the data in this file, it is possible that an attacker could inject a formula when the CSV is imported into a spreadsheet application that runs an attacker script, which could steal data from the importing user or, at worst, install malware on the user's computer. `defusedcsv` is a drop-in replacement with the same API that will attempt to mitigate formula injection attempts. You can use `defusedcsv` instead of `csv` to safely generate CSVs.
  metadata:
    language: python
    category: security
    confidence: MEDIUM
    cwe: CWE-1236
    owasp:
      - A01:2017 - Injection
      - A03:2021 - Injection
    technology:
      - flask

sources:
  - id: FLASK_REQUEST
    match:
      node: CALL
      api:
        package: flask
        type: request
        method: form.get|form.__getitem__|args.get|args.__getitem__|values.get|values.__getitem__|cookies.get|cookies.__getitem__|stream|headers.get|headers.__getitem__|data|full_path|url|json|get_json|view_args.get|view_args.__getitem__
  - id: ROUTE_PARAMETER
    match:
      node: METHOD_PARAMETER_IN
      where:
        - op: inside
          left: METHOD
          right: FUNCTION_DECORATED_BY_ROUTE

sinks:
  - id: CSV_WRITER
    match:
      node: CALL
      api:
        package: csv
        method: writerow|writerows|writeheader
      receiver: $WRITER
      where:
        - op: eq
          left: TYPE
          right: csv.writer

sanitizers: []

propagations: []
```
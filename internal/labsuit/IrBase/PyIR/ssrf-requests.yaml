```yaml
xcpgir_version: "1.0"
rule:
  id: "ssrf-requests"
  kind: taint
  severity: ERROR
  message: "Data from request object is passed to a new server-side request. This could lead to a server-side request forgery (SSRF). To mitigate, ensure that schemes and hosts are validated against an allowlist, do not forward the response to the user, and ensure proper authentication and transport-layer security in the proxied request."
  metadata:
    language: python
    category: security
    technology:
      - flask
    cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
    owasp: "A10:2021 - Server-Side Request Forgery (SSRF)"

sources:
  - id: FLASK_REQUEST
    match:
      node: CALL
      api:
        package: flask
        type: request
        method: "$W"
      where:
        - op: regex
          left: method
          right: "^(get|.*\\[.*\\]|.*\\(.*\\))$"

  - id: ROUTE_PARAMETER
    match:
      node: METHOD_PARAMETER_IN
      where:
        - op: regex
          left: name
          right: "^ROUTEVAR$"

sinks:
  - id: REQUESTS_CALL
    match:
      node: CALL
      api:
        package: requests
        method: "$FUNC"
      arg_index: any

propagations:
  - id: ARG_TO_PARAM
    edge: arg->param
    kind: taint

  - id: ASSIGNMENT_PROPAGATION
    edge: alias
    kind: taint

sanitizers: []
```
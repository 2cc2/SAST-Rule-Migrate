```yaml
xcpgir_version: "1.0"
rule:
  id: template-unescaped-with-safe
  kind: taint
  severity: WARNING
  message: >-
    Detected a segment of a Flask template where autoescaping is explicitly
    disabled with '| safe' filter. This allows rendering of raw HTML
    in this segment. Ensure no user data is rendered here, otherwise this
    is a cross-site scripting (XSS) vulnerability.
  metadata:
    language: regex
    category: security
    tags:
      - flask
      - xss
      - html

sources:
  - id: UNSAFE_TEMPLATE
    match:
      node: LITERAL
      where:
        - op: regex
          left: value
          right: '{{.*?\|\s*safe(\s*}})?'

sinks:
  - id: TEMPLATE_RENDER
    match:
      node: CALL
      api:
        type: flask.templating
        method: render_template_string
      arg_index: 0

sanitizers:
  - id: ESCAPE_FILTER
    match:
      node: CALL
      where:
        - op: regex
          left: methodFullName
          right: 'escape'
    effect: neutralize
    scope:
      sinks: [TEMPLATE_RENDER]

propagations:
  - id: TEMPLATE_TO_RENDER
    edge: arg->param
    kind: taint
```
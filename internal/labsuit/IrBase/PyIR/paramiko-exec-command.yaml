xcpgir_version: "1.0"
rule:
  id: "paramiko-exec-command"
  kind: taint
  severity: ERROR
  message: "Unverified SSL context detected. This will permit insecure connections without verifying SSL certificates. Use 'ssl.create_default_context()' instead."
  metadata:
    language: python
    category: security
    tags:
      - paramiko
      - injection
      - security
    references:
      - "http://docs.paramiko.org/en/stable/api/client.html#paramiko.client.SSHClient.exec_command"
      - "https://github.com/PyCQA/bandit/blob/d5f8fa0d89d7b11442fc6ec80ca42953974354c8/bandit/plugins/injection_paramiko.py"
    owasp:
      - "A01:2017 - Injection"
      - "A03:2021 - Injection"
    cwe:
      - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
sources:
  - id: "SSH_CLIENT"
    match:
      node: CALL
      api:
        package: paramiko.client
        type: SSHClient
        method: exec_command
        signature: ["(...)"]
      where:
        - op: regex
          left: arg[0].value
          right: "^\".*\"$"
          negate: true
sinks:
  - id: "UNSAFE_EXEC_COMMAND"
    match:
      node: CALL
      api:
        package: paramiko.client
        type: SSHClient
        method: exec_command
        signature: ["(...)"]
      where:
        - op: regex
          left: arg[0].value
          right: "^\".*\"$"
          negate: true
sanitizers:
  - id: "SAFE_EXEC_COMMAND"
    match:
      node: CALL
      api:
        package: paramiko.client
        type: SSHClient
        method: exec_command
        signature: ["(...)"]
      where:
        - op: regex
          left: arg[0].value
          right: "^\".*\"$"
    effect: neutralize
    scope:
      sinks: ["UNSAFE_EXEC_COMMAND"]
propagations:
  - id: "SSH_CLIENT_TO_EXEC"
    edge: receiver
    kind: taint

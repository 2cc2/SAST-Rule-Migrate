rules:
  - id: py/cookie-injection
    message: Cookie is constructed from a user-supplied input
    languages:
      - python
    severity: WARNING
    metadata:
      security-severity: "5.0"
      cwe: "CWE-020"
      precision: high
    patterns:
      - pattern-inside: |
          $COOKIE = $USER_INPUT
      - pattern-either:
          - pattern: set_cookie($USER_INPUT)
          - pattern: Cookie($USER_INPUT)
          - pattern: Response.set_cookie($USER_INPUT)
          - pattern: HttpResponse.set_cookie($USER_INPUT)
    focus-metavariable: $USER_INPUT
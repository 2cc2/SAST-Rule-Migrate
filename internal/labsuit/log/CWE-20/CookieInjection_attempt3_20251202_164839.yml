# 转换后的 Semgrep 规则
rules:
- id: python_cookie_injection
  languages: [python]
  severity: WARNING
  message: Constructing cookies from user input may allow an attacker to perform a Cookie Poisoning attack. Cookie is constructed from user-supplied input $SOURCE.
  metadata:
    category: security
    cwe: "CWE-20: Improper Input Validation"
    security-severity: 5.0
    references:
    - https://cwe.mitre.org/data/definitions/20.html
    owasp: "A03:2021 - Injection"
    likelihood: MEDIUM
    impact: HIGH
    confidence: HIGH
  mode: taint
  pattern-sources:
  - pattern: $SOURCE.getNode()
  pattern-sinks:
  - pattern: $SINK.getNode()
rules:
- id: py/cookie-injection
  languages: [python]
  severity: WARNING
  message: "Cookie is constructed from a user-supplied input. This may allow an attacker to perform a Cookie Poisoning attack."
  metadata:
    references:
    - "CWE-20: Improper Input Validation"
    cwe: "CWE-20: Improper Input Validation"
    category: security
    precision: high
    security-severity: 5.0
    tags:
    - security
    - external/cwe/cwe-020
  mode: taint
  pattern-sources:
  - pattern-es:
    - pattern: |
        $SOURCE.getNode()
    - metavariable-regex:
        metavariable: $SOURCE
        regex: .*user.*input.*|.*request.*
  pattern-sinks:
  - patterns:
    - pattern: |
        $SINK.getNode()
    - metavariable-regex:
        metavariable: $SINK
        regex: .*cookie.*
rules:
- id: cookie-injection
  languages: [python]
  severity: warning
  message: Constructing cookies from user input may allow an attacker to perform a Cookie Poisoning attack.
  metadata:
    cwe: "CWE-020: Improper Input Validation"
    category: security
    owasp:
      - "A03:2021 - Injection"
    technology:
      - web
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: request.$HEADER
      - pattern: request.$PARAM
    - metavariable-regex:
        metavariable: $HEADER
        regex: (?i)cookie
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: Response.set_cookie(..., $VALUE, ...)
      - pattern: Response.add_cookie(..., $VALUE, ...)
      - pattern: HttpResponse.set_cookie(..., $VALUE, ...)
  pattern-sanitizers:
  - patterns:
    - pattern-not: $VALUE
rules:
- id: cookie-injection
  languages: [python]
  severity: WARNING
  message: Constructing cookies from user input may allow an attacker to perform a Cookie Poisoning attack.
  metadata:
    cwe: "CWE-020: Improper Input Validation"
    category: security
    precision: high
    security-severity: 5.0
  mode: taint
  pattern-sources:
    - pattern: |
        $USER_INPUT = ...
        # Add patterns to match user input sources
  pattern-sinks:
    - patterns:
      - pattern: |
          Cookie($COOKIE_PARAM)
        # Focus on cookie creation with potential tainted parameter
      - metavariable-regex:
          metavariable: $COOKIE_PARAM
          regex: $USER_INPUT
  pattern-sanitizers:
    - pattern: |
        sanitize($COOKIE_PARAM)
        # Add patterns for proper sanitization if any
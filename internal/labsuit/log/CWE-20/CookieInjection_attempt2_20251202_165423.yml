rules:
- id: py/cookie-injection
  languages: [python]
  severity: WARNING
  message: "Cookie is constructed from a user-supplied input. Constructing cookies from user input may allow an attacker to perform a Cookie Poisoning attack."
  metadata:
    cwe: "CWE-20: Improper Input Validation"
    security-severity: "5.0"
    category: security
    precision: high
    tags:
      - security
      - external/cwe/cwe-020
  mode: taint
  pattern-sources:
    - pattern: $USER_INPUT
  pattern-sinks:
    - patterns:
      - pattern: Cookie(...)
      - pattern: SimpleCookie(...)
      - pattern: BaseCookie(...)
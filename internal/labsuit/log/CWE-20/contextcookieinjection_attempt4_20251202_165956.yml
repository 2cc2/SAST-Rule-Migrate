rules:
- id: py/cookie-injection
  languages:
    - python
  message: Cookie is constructed from a user-supplied input
  severity: WARNING
  metadata:
    security-severity: "5.0"
    precision: high
    category: security
    cwe: "CWE-020"
    owasp:
      - A01:2017 - Injection
    references:
      - https://cwe.mitre.org/data/definitions/20.html
  mode: taint
  pattern-sources:
    - pattern: |
        request.$PARAM
    - pattern: |
        request.headers[...]
    - pattern: |
        request.$ATTR
    - pattern: |
        flask.request.$PARAM
  pattern-sinks:
    - pattern: |
        $COOKIE = $VALUE
      focus-metavariable: $VALUE
    - pattern: |
        response.set_cookie(..., $VALUE, ...)
      focus-metavariable: $VALUE
    - pattern: |
        flask.response.set_cookie(..., $VALUE, ...)
      focus-metavariable: $VALUE
  pattern-sanitizers:
    - pattern: |
        sanitize($VALUE)
      focus-metavariable: $VALUE
    - pattern: |
        html.escape($VALUE)
      focus-metavariable: $VALUE
rules:
- id: py/cookie-injection
  message: Constructing cookies from user input may allow an attacker to perform a Cookie Poisoning attack.
  severity: WARNING
  languages:
    - python
  patterns:
    - pattern-either:
      - pattern: set_cookie(..., $COOKIE=request.$PARAM,...)
      - pattern: set_cookie($COOKIE)
      - pattern: $RESPONSE.set_cookie($COOKIE)
  fix: |
    # SecureCookie should be used instead
    SecureCookie(...)
  metadata:
    cwe: "CWE-020: Improper Input Validation"
    category: security
    security-severity: 5.0
    precision: high
    owasp:
      - "A03:2021 - Injection"
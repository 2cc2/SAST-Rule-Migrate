rules:
- id: py/cookie-injection
  languages: [python]
  severity: WARNING
  message: Cookie is constructed from a user-supplied input. This may allow an attacker to perform a Cookie Poisoning attack.
  metadata:
    references:
    - https://cwe.mitre.org/data/definitions/20.html
    category: security
    cwe: "CWE-20: Improper Input Validation"
    security-severity: 5.0
    precision: high
    tags:
    - security
    - external/cwe/cwe-020
  mode: taint
  pattern-sources:
  - pattern: $USER_INPUT
  pattern-sinks:
  - patterns:
    - pattern-inside: |
        $COOKIE = ... $BAD_INPUT ...
    - metavariable-regex:
        metavariable: $COOKIE
        regex: (?i)(cookie|set-cookie)
    - metavariable-regex:
        metavariable: $BAD_INPUT
        regex: \$USER_INPUT
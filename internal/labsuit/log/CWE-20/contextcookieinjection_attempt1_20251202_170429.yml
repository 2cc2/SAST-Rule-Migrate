rules:
- id: py-cookie-injection
  languages: [python]
  severity: warning
  message: Constructing cookies from user input may allow an attacker to perform a Cookie Poisoning attack
  metadata:
    cwe: "CWE-020"
    category: security
    precision: high
    security-severity: 5.0
    tags: [security, external/cwe/cwe-020]
  mode: taint
  pattern-sources:
    - patterns:
      - pattern-inside: |
          def $HANDLER($EVENT, ...=$CONTEXT, ...):
            ...
      - metavariable-pattern:
          metavariable: $EVENT
          patterns:
            - pattern-either:
              - pattern: request.$PARAM
              - pattern: request.headers[...]
              - pattern: request.args[...]
              - pattern: request.values[...]
  pattern-sinks:
    - patterns:
      - pattern-inside: |
          def $HANDLER(...):
            ...
      - pattern-either:
        - pattern: |
            response.set_cookie(..., $COOKIE_VALUE, ...)
        - pattern: |
            $RESPONSE.set_cookie(..., $COOKIE_VALUE, ...)
  pattern-sanitizers:
    - patterns:
      - pattern-either:
        - pattern: json.dumps(...)
        - pattern: urllib.parse.quote(...)
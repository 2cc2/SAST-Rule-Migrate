rules:
- id: py/cookie-injection
  languages: [python]
  severity: WARNING
  message: Constructing cookies from user input may allow an attacker to perform a Cookie Poisoning attack.
  metadata:
    cwe: "CWE-020: Improper Input Validation"
    category: security
    precision: high
    security-severity: "5.0"
    references:
    - https://cwe.mitre.org/data/definitions/20.html
  mode: taint
  pattern-sources:
  - patterns:
    - pattern: input(...)
    - pattern: request.GET[...]
    - pattern: request.POST[...]
    - pattern: request.COOKIES[...]
  pattern-sinks:
  - patterns:
    - pattern: SimpleCookie(...)
    - pattern: cookies.set(...)
    - pattern: response.set_cookie(...)
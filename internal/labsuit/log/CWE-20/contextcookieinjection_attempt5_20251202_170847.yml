rules:
  - id: python-cookie-injection
    patterns:
      - pattern: |
          $COOKIE.setValue($SOURCE)
      - pattern-either:
        - pattern: request.getParameter(...)
        - pattern: request.getHeader(...)
        - pattern: request.getCookie(...)
    message: Cookie is constructed from a user-supplied input
    severity: WARNING
    languages: [python]
    metadata:
      security-severity: 5.0
      cwe: "CWE-020"
      references:
        - https://cwe.mitre.org/data/definitions/20.html
      category: security
      precision: high
      description: Constructing cookies from user input may allow an attacker to perform a Cookie Poisoning attack.
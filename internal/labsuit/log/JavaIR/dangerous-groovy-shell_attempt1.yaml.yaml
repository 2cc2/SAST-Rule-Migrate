```yaml
xcpgir_version: "1.0"
rule:
  id: dangerous-groovy-shell
  kind: taint
  severity: WARNING
  message: "A expression is built with a dynamic value. The source of the value(s) should be verified to avoid that unfiltered values fall into this risky code evaluation."
  metadata:
    language: java
    category: security
    cwe: "CWE-94: Improper Control of Generation of Code ('Code Injection')"
    owasp: "A03:2021 - Injection"
    technology: groovy

sources:
  - id: SHELL_OBJECT
    match:
      node: LOCAL
      type:
        name: groovy.lang.GroovyShell | groovy.lang.GroovyClassLoader
        match: exact

sinks:
  - id: UNSAFE_EVAL
    match:
      node: CALL
      api:
        type: groovy.lang.GroovyShell | groovy.lang.GroovyClassLoader
        method: parse | evaluate | parseClass
      arg_index: 0

sanitizers:
  - id: STRING_LITERAL
    match:
      node: LITERAL
      type:
        name: java.lang.String
        match: exact
    scope:
      sinks: [UNSAFE_EVAL]
```
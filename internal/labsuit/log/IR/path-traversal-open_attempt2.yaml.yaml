```yaml
xcpgir_version: "1.0"
rule:
  id: "path-traversal-open"
  kind: taint
  severity: ERROR
  message: "Found request data in a call to 'open'. Ensure the request data is validated or sanitized, otherwise it could result in path traversal attacks."
  metadata:
    language: python
    category: security
    cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
    owasp: ["A05:2017 - Broken Access Control", "A01:2021 - Broken Access Control"]
    technology: ["flask"]

sources:
  - id: FLASK_REQUEST
    match:
      node: CALL
      api:
        type: flask.request
        method: ~
      where:
        - op: in
          left: method
          right: ["get", "__getitem__", "__call__"]
  - id: ROUTE_PARAM
    match:
      node: PARAM
      where:
        - op: regex
          left: name
          right: "^\\$ROUTEVAR$"

sinks:
  - id: FILE_OPEN
    match:
      node: CALL
      api:
        type: builtins
        method: open
    where:
      - or:
        - op: regex
          left: arg[0].value
          right: ".*flask\\.request\\..*"
        - op: regex
          left: arg[0].value
          right: "^\\$ROUTEVAR$|^\\$INTERM$"

propagations:
  - id: REQUEST_TO_VAR
    edge: arg->param
    kind: taint
  - id: ROUTE_TO_OPEN
    edge: arg->param
    kind: taint
    where:
      - op: eq
        left: src.value
        right: "$ROUTEVAR"
      - op: eq
        left: dst.value
        right: "$INTERM"

sanitizers:
  - id: PATH_SANITIZATION
    match:
      node: CALL
      api:
        type: os.path
        method: ~
      where:
        - op: in
          left: method
          right: ["abspath", "realpath", "normpath"]
    effect: neutralize
```
```yaml
xcpgir_version: "1.0"
rule:
  id: "path-traversal-open"
  kind: taint
  severity: ERROR
  message: "Found request data in a call to 'open'. Ensure the request data is validated or sanitized, otherwise it could result in path traversal attacks."
  metadata:
    language: python
    category: security
    cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
    owasp: ["A05:2017 - Broken Access Control", "A01:2021 - Broken Access Control"]
    technology: ["flask"]

sources:
  - id: FLASK_REQUEST
    match:
      node: [CALL, FIELD_IDENTIFIER]
      api:
        type: flask.request
      where:
        - or:
          - op: in
            left: method
            right: ["get", "__getitem__", "__call__"]
          - op: regex
            left: code
            right: "^flask\\.request\\.[a-zA-Z_]+$"
  - id: ROUTE_PARAM
    match:
      node: PARAM
      where:
        - op: regex
          left: name
          right: "^[a-zA-Z_]+$"

sinks:
  - id: FILE_OPEN
    match:
      node: [CALL, CONTROL_STRUCTURE]
      api:
        type: builtins
        method: open
    where:
      - or:
        - op: regex
          left: arg[0].value
          right: ".*flask\\.request\\..*"
        - op: regex
          left: arg[0].value
          right: "^[a-zA-Z_]+$"

propagations:
  - id: REQUEST_TO_VAR
    edge: arg->param
    kind: taint
  - id: VAR_TO_VAR
    edge: [arg->param, assignment]
    kind: taint
  - id: ROUTE_TO_OPEN
    edge: arg->param
    kind: taint
    where:
      - op: regex
        left: src.value
        right: "[a-zA-Z_]+"
      - op: regex
        left: dst.value
        right: "[a-zA-Z_]+"

sanitizers:
  - id: PATH_SANITIZATION
    match:
      node: CALL
      api:
        type: [os.path, "os.path.custom"]
      where:
        - or:
          - op: in
            left: method
            right: ["abspath", "realpath", "normpath"]
          - op: regex
            left: method
            right: "^sanitize_.*path$"
    effect: neutralize
```
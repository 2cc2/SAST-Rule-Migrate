```yaml
xcpgir_version: "1.0"
rule:
  id: path-traversal-open
  kind: taint
  severity: ERROR
  message: "Found request data in a call to 'open'. Ensure the request data is validated or sanitized, otherwise it could result in path traversal attacks."
  metadata:
    language: python
    category: security
    technology: ["flask"]
    cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
    owasp:
      - "A05:2017 - Broken Access Control"
      - "A01:2021 - Broken Access Control"
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory: ["audit"]
    references:
      - "https://owasp.org/www-community/attacks/Path_Traversal"
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM

sources:
  - id: FLASK_REQUEST
    match:
      node: CALL
      api:
        package: flask
        type: request
        method: $W
        signature: ["(...)"]
      where:
        - op: in
          left: method
          right: ["get", "__getitem__", "__call__"]

  - id: ROUTE_PARAMETER
    match:
      node: METHOD_PARAMETER_IN
      where:
        - op: regex
          left: name
          right: "\$ROUTEVAR|\$INTERM"

  - id: INTERMEDIATE_VAR
    match:
      node: LOCAL
      where:
        - op: regex
          left: name
          right: "\$INTERM"

sinks:
  - id: FILE_OPEN
    match:
      node: CALL
      api:
        package: builtins
        method: open
        signature: ["(...)"]
      arg_index: 0

sanitizers:
  - id: PATH_VALIDATION
    match:
      node: CALL
      where:
        - op: regex
          left: methodFullName
          right: ".*validate.*|.*sanitize.*"
    effect: neutralize
    scope:
      sinks: ["FILE_OPEN"]

propagations:
  - id: ROUTE_TO_OPEN
    edge: arg->param
    kind: taint
  - id: REQUEST_PROPAGATION
    edge: arg->param
    kind: taint
  - id: VAR_PROPAGATION
    edge: alias
    kind: taint
```
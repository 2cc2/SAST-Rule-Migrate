```yaml
xcpgir_version: "1.0"
rule:
  id: path-traversal-open
  kind: taint
  severity: ERROR
  message: "Found request data in a call to 'open'. Ensure the request data is validated or sanitized, otherwise it could result in path traversal attacks."
  metadata:
    language: python
    category: security
    technology: ["flask"]
    cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
    owasp:
      - "A05:2017 - Broken Access Control"
      - "A01:2021 - Broken Access Control"
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory: ["audit"]
    references:
      - "https://owasp.org/www-community/attacks/Path_Traversal"
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM

sources:
  - id: FLASK_REQUEST
    match:
      node: [CALL, FIELD_IDENTIFIER, IDENTIFIER]
      api:
        package: flask
        type: request
        method: "[get|__getitem__|__call__]"
        signature: ["(...)"]
      where:
        - op: regex
          left: code
          right: "flask\\.request(\\.|\\[|\\().*"
        - op: regex
          left: code
          right: "flask\\.request\\..*\\[.*\\]"

  - id: ROUTE_PARAMETER
    match:
      node: METHOD_PARAMETER_IN
      pattern-inside: |
        @$APP.route($ROUTE, ...)
        def $FUNC(..., $PARAM, ...):
          ...
      where:
        - op: eq
          left: name
          right: "$ROUTEVAR"
        - op: regex
          left: code
          right: "@.*\\.route\\(.*\\).*def.*\\(.*\\b$PARAM\\b.*\\):"

sinks:
  - id: FILE_OPEN
    match:
      node: CALL
      api:
        package: builtins
        method: open
        signature: ["(...)"]
      arg_index: 0
      must_reach: [FLASK_REQUEST, ROUTE_PARAMETER]
      pattern-inside: |
        @$APP.route(...)
        def $FUNC(...):
          ...
          open(..., <... flask.request ...>, ...)

  - id: FILE_OPEN_WITH_CONTEXT
    match:
      node: CALL
      api:
        package: builtins
        method: open
        signature: ["(...)"]
      arg_index: 0
      must_reach: [FLASK_REQUEST, ROUTE_PARAMETER]
      pattern-inside: |
        @$APP.route(...)
        def $FUNC(...):
          ...
          with open(..., <... flask.request ...>, ...) as $FD:
            ...

sanitizers:
  - id: PATH_NORMALIZATION
    match:
      node: CALL
      api:
        package: os.path
        method: [normpath, abspath, realpath]
    effect: neutralize
    scope:
      sinks: [FILE_OPEN, FILE_OPEN_WITH_CONTEXT]

propagations:
  - id: DIRECT_FLASK_TO_OPEN
    edge: DFG
    kind: taint
    pattern-inside: |
      @$APP.route(...)
      def $FUNC(...):
        ...
        $INTERM = <... flask.request...>
        ...
        open(<... $INTERM ...>, ...)

  - id: FLASK_DIRECT_TO_OPEN
    edge: DFG
    kind: taint
    pattern-inside: |
      @$APP.route(...)
      def $FUNC(...):
        ...
        open(..., <... flask.request ...>, ...)

  - id: ROUTE_TO_OPEN
    edge: DFG
    kind: taint
    pattern-inside: |
      @$APP.route(...)
      def $FUNC(..., $PARAM, ...):
        ...
        $INTERM = <... $PARAM ...>
        ...
        open(<... $INTERM ...>, ...)

  - id: CONTEXT_MANAGER_FLOW
    edge: DFG
    kind: taint
    pattern-inside: |
      @$APP.route(...)
      def $FUNC(...):
        ...
        with ... as $VAR:
          ...

  - id: METHOD_INTERNAL_FLOW
    edge: DFG
    kind: taint
    pattern-inside: |
      @$APP.route(...)
      def $FUNC(...):
        ...

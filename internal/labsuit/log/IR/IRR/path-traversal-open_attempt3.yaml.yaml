```yaml
xcpgir_version: "1.0"
rule:
  id: path-traversal-open
  kind: taint
  severity: ERROR
  message: "Found request data in a call to 'open'. Ensure the request data is validated or sanitized, otherwise it could result in path traversal attacks."
  metadata:
    language: python
    category: security
    technology: ["flask"]
    cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
    owasp:
      - "A05:2017 - Broken Access Control"
      - "A01:2021 - Broken Access Control"
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory: ["audit"]
    references:
      - "https://owasp.org/www-community/attacks/Path_Traversal"
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM

sources:
  - id: FLASK_REQUEST_ALL_METHODS
    match:
      node: CALL
      api:
        package: flask
        type: request
        method: "*"

  - id: FLASK_REQUEST_DIRECT
    match:
      node: IDENTIFIER
      api:
        package: flask
        type: request
        method: "*"

  - id: ROUTE_PARAMETER
    match:
      node: METHOD_PARAMETER_IN
      where:
        - op: kimino

  - id: INTERMEDIATE_VAR
    match:
      node: LOCAL

sinks:
  - id: FILE_OPEN
    match:
      node: CALL
      api:
        package: builtins
        method: open
        signature: ["(...)"]
      arg_index: 0

  - id: FILE_OPEN_WITH_CONTEXT
    match:
      node: CALL
      api:
        package: builtins
        method: open
        signature: ["(...)"]
      pattern-inside: |
        with open(...) as $FD:
          ...

propagations:
  - id: ARG_TO_PARAM
    edge: arg->param
    kind: taint
  - id: VAR_ALIAS
    edge: alias
    kind: taint
  - id: WITH_CONTEXT_PROPAGATION
    edge: RECEIVER
    kind: taint
```
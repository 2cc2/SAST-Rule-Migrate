```yaml
xcpgir_version: "1.0"
rule:
  id: path-traversal-open
  kind: taint
  severity: ERROR
  message: "Found request data in a call to 'open'. Ensure the request data is validated or sanitized, otherwise it could result in path traversal attacks."
  metadata:
    language: python
    category: security
    technology: ["flask"]
    cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
    owasp:
      - "A05:2017 - Broken Access Control"
      - "A01:2021 - Broken Access Control"
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory: ["audit"]
    references:
      - "https://owasp.org/www-community/attacks/Path_Traversal"
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM

sources:
  - id: FLASK_REQUEST_METHODS
    match:
      node: CALL
      api:
        package: flask
        type: request
        method: "[get|__getitem__|__call__]"
        signature: ["(...)"]
      where:
        - op: regex
          left: methodFullName
          right: "flask\.request\.(get|__getitem__|__call__)"

  - id: FLASK_REQUEST_DIRECT
    match:
      node: IDENTIFIER
      type:
        name: "flask.request"
        match: exact

  - id: FLASK_REQUEST_PROPERTY
    match:
      node: IDENTIFIER
      where:
        - op: regex
          left: code
          right: 'flask\.request\.[^\s]+'

  - id: ROUTE_PARAMETER
    match:
      node: METHOD_PARAMETER_IN
      where:
        - op: regex
          left: name
          right: ".*ROUTEVAR.*"
        - pattern-inside: |
            @$APP.route($ROUTE, ...)
            def $FUNC(..., $PARAM, ...):
              ...
              $INTERM = <... $PARAM ...>
              ...

sinks:
  - id: FILE_OPEN
    match:
      node: CALL
      api:
        package: builtins
        method: open
        signature: ["(...)"]
      arg_index: 0
      pattern-inside: |
        @$APP.route(...)
        def $FUNC(...):
          ...

  - id: FILE_OPEN_WITH_CONTEXT
    match:
      node: CALL
      api:
        package: builtins
        method: open
        signature: ["(...)"]
      arg_index: 0
      pattern-inside: |
        @$APP.route(...)
        def $FUNC(...):
          ...
          with open(...) as $FD:
            ...

sanitizers:
  - id: PATH_VALIDATION
    match:
      node: CALL
      api:
        method: "os.path.(abspath|realpath)"
      effect: neutralize
      scope: { sinks: [FILE_OPEN, FILE_OPEN_WITH_CONTEXT] }

  - id: INTERMEDIATE_VALIDATION
    match:
      node: CALL
      api:
        method: "(sanitize|validate)_.*"
      effect: neutralize
      scope: { sources: [FLASK_REQUEST_METHODS, FLASK_REQUEST_DIRECT, ROUTE_PARAMETER] }

propagations:
  - id: ARG_TO_PARAM
    edge: arg->param
    kind: taint
  - id: VAR_ALIAS
    edge: alias
    kind: taint
  - id: CONTEXT_MANAGER_FLOW
    edge: DFG
    kind: taint
    pattern-inside: |
      with ... as $VAR:
        ...
  - id: REQUEST_PROPERTY
    edge: field
    kind: taint
    match:
      node: FIELD_IDENTIFIER
      type:
        name: "flask.request"
        match: exact
  - id: STRING_CONCAT
    edge: DFG
    kind: taint
    pattern-inside: |
      $VAR = ... + ...
```
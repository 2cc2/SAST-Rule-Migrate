"\u003cb\u003eclass\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/controlflow/plot/nodeGraph.ql\u003cbr\u003e\u003cpre\u003e@id test-plot-cfg\n @kind graph\u003c/pre\u003e"}, {"color": "#90CAF9", "id": "N51", "label": "class: ControlFlowNode", "shape": "dot", "size": 10, "title": "\u003cb\u003eclass\u003c/b\u003e\u003cbr\u003eNone\u003cbr\u003e\u003cpre\u003e\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N52", "label": "module: test-kotlin2/library-tests/controlflow/dominance/dominanceWrong.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/controlflow/dominance/dominanceWrong.ql\u003cbr\u003e\u003cpre\u003eRepresents a path from `entry` to `node` that doesn\u0027t go through `dom`. If\n `entry` is the entry node for the CFG then this shows that `dom` does not\n dominate `node`.\u003c/pre\u003e"}, {"color": "#A5D6A7", "id": "N53", "label": "predicate: dominanceCounterExample", "shape": "dot", "size": 10, "title": "\u003cb\u003epredicate\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/controlflow/dominance/dominanceWrong.ql\u003cbr\u003e\u003cpre\u003eRepresents a path from `entry` to `node` that doesn\u0027t go through `dom`. If\n `entry` is the entry node for the CFG then this shows that `dom` does not\n dominate `node`.\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N54", "label": "module: test-kotlin2/library-tests/controlflow/dominance/dominanceBad.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/controlflow/dominance/dominanceBad.ql\u003cbr\u003e\u003cpre\u003eimport java\nimport semmle.code.java.controlflow.Dominance\n\nfrom IfStmt i, BlockStmt b\nwhere\n  b = i.getThen() and\n  dominates(i.getThen().getControlFlowNode(), b.getControlFlowNode()) and\n  dominates(i.getElse().getControlFlowNode(), b.getControlFlowNode())\nselect i, b\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N55", "label": "module: test-kotlin2/library-tests/controlflow/dominance/dominatedByStart.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/controlflow/dominance/dominatedByStart.ql\u003cbr\u003e\u003cpre\u003e// All nodes should be dominated by their associated start node\nimport default\nimport semmle.code.java.controlflow.Dominance\n\nControlFlowNode reachableIn(Method func) {\n  result = func.getBody().getControlFlowNode() or\n  result = reachableIn(func).getASuccessor()\n}\n\nfrom Method func, ControlFlowNode entry, ControlFlowNode node\nwhere\n  func.getBody().getControlFlowNode() = entry and\n  reachableIn(func) = node and\n  entry != node and\n  not strictlyDominates(func.getBody().getControlFlowNode(), nod\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N56", "label": "module: test-kotlin2/library-tests/controlflow/dominance/dominator.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/controlflow/dominance/dominator.ql\u003cbr\u003e\u003cpre\u003eimport default\nimport semmle.code.java.controlflow.Dominance\n\nfrom Method func, ControlFlowNode dominator, ControlFlowNode node\nwhere\n  iDominates(dominator, node) and\n  dominator.getEnclosingStmt().getEnclosingCallable() = func and\n  func.getDeclaringType().hasName(\"Test\")\nselect dominator, node\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N57", "label": "module: test-kotlin2/library-tests/controlflow/dominance/dominatorUnique.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/controlflow/dominance/dominatorUnique.ql\u003cbr\u003e\u003cpre\u003e// Every reachable node has a dominator\nimport default\nimport semmle.code.java.controlflow.Dominance\n\nfrom Method func, ControlFlowNode dom1, ControlFlowNode dom2, ControlFlowNode node\nwhere\n  iDominates(dom1, node) and\n  iDominates(dom2, node) and\n  dom1 != dom2 and\n  func = node.getEnclosingStmt().getEnclosingCallable()\nselect func, node, dom1, dom2\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N58", "label": "module: test-kotlin2/library-tests/controlflow/dominance/dominatorExists.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/controlflow/dominance/dominatorExists.ql\u003cbr\u003e\u003cpre\u003etransitive dominance\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N59", "label": "module: test-kotlin2/library-tests/controlflow/paths/paths.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/controlflow/paths/paths.ql\u003cbr\u003e\u003cpre\u003eimport java\nimport semmle.code.java.controlflow.Paths\n\nclass PathTestConf extends ActionConfiguration {\n  PathTestConf() { this = \"PathTestConf\" }\n\n  override predicate isAction(ControlFlowNode node) {\n    node.asExpr().(MethodCall).getMethod().hasName(\"action\")\n  }\n}\n\nfrom Callable c, PathTestConf conf\nwhere conf.callableAlwaysPerformsAction(c)\nselect c\u003c/pre\u003e"}, {"color": "#FFE082", "id": "N60", "label": "import: semmle.code.java.controlflow.Paths", "shape": "dot", "size": 10, "title": "\u003cb\u003eimport\u003c/b\u003e\u003cbr\u003eNone\u003cbr\u003e\u003cpre\u003e\u003c/pre\u003e"}, {"color": "#90CAF9", "id": "N61", "label": "class: PathTestConf", "shape": "dot", "size": 10, "title": "\u003cb\u003eclass\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/controlflow/paths/paths.ql\u003cbr\u003e\u003cpre\u003eimport java\nimport semmle.code.java.controlflow.Paths\n\nclass PathTestConf extends ActionConfiguration {\n  PathTestConf() { this = \"PathTestConf\" }\n\n  override predicate isAction(ControlFlowNode node) {\n    node.asExpr().(MethodCall).getMethod().hasName(\"action\")\n  }\n}\n\nfrom Callable c, PathTestConf conf\nwhere conf.callableAlwaysPerformsAction(c)\nselect c\u003c/pre\u003e"}, {"color": "#90CAF9", "id": "N62", "label": "class: ActionConfiguration", "shape": "dot", "size": 10, "title": "\u003cb\u003eclass\u003c/b\u003e\u003cbr\u003eNone\u003cbr\u003e\u003cpre\u003e\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N63", "label": "module: test-kotlin2/library-tests/enum/test.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/enum/test.ql\u003cbr\u003e\u003cpre\u003eimport java\n\nfrom Method m\nwhere m.getDeclaringType().getName().matches(\"Enum%\")\nselect m.getName()\n\nquery predicate enumConstants(EnumConstant ec) { ec.fromSource() }\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N64", "label": "module: test-kotlin2/library-tests/trivial/elements.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/trivial/elements.ql\u003cbr\u003e\u003cpre\u003eimport java\n\nfrom Element e\nwhere e.fromSource()\nselect e, e.getPrimaryQlClasses()\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N65", "label": "module: test-kotlin2/library-tests/modifiers/modifiers.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/modifiers/modifiers.ql\u003cbr\u003e\u003cpre\u003eimport java\n\nfrom Modifiable m, string mod\nwhere m.fromSource() and m.hasModifier(mod)\nselect m, m.getAPrimaryQlClass(), mod\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N66", "label": "module: test-kotlin2/library-tests/annotation_classes/classes.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/annotation_classes/classes.ql\u003cbr\u003e\u003cpre\u003eimport java\n\nfrom ClassOrInterface x\nwhere x.fromSource()\nselect x, x.getPrimaryQlClasses()\n\nquery predicate annotationDeclarations(AnnotationType at, AnnotationElement ae) {\n  at.fromSource() and\n  at.getAnAnnotationElement() = ae\n}\n\nquery predicate annotations(Annotation a, Element e, AnnotationType at) {\n  at.fromSource() and\n  a.getAnnotatedElement() = e and\n  at = a.getType()\n}\n\nquery predicate annotationValues(Annotation a, Expr v) {\n  a.getValue(_) = v and v.getFile().isSourceFile()\n}\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N67", "label": "module: test-kotlin2/library-tests/special-method-getters/test.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/special-method-getters/test.ql\u003cbr\u003e\u003cpre\u003eimport java\nimport semmle.code.java.Diagnostics\n\nfrom MethodCall ma\nselect ma, ma.getCallee().getDeclaringType().getQualifiedName(), ma.getCallee().getName()\n\nquery predicate diag(Diagnostic d) { any() }\u003c/pre\u003e"}, {"color": "#FFE082", "id": "N68", "label": "import: semmle.code.java.Diagnostics", "shape": "dot", "size": 10, "title": "\u003cb\u003eimport\u003c/b\u003e\u003cbr\u003eNone\u003cbr\u003e\u003cpre\u003e\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N69", "label": "module: test-kotlin2/library-tests/operator-overloads/test.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/operator-overloads/test.ql\u003cbr\u003e\u003cpre\u003eimport java\nimport java\nimport semmle.code.java.Diagnostics\n\nfrom Diagnostic d\nselect d\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N70", "label": "module: test-kotlin2/library-tests/internal-constructor-called-from-java/test.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/internal-constructor-called-from-java/test.ql\u003cbr\u003e\u003cpre\u003eimport java\n\nfrom ClassInstanceExpr ce\nselect ce, ce.getConstructor().getBody()\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N71", "label": "module: test-kotlin2/library-tests/generic-methods/test.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/generic-methods/test.ql\u003cbr\u003e\u003cpre\u003eimport java\n\nfrom MethodCall ma\nselect ma.getQualifier(), ma.getCallee(), ma.getCallee().getSignature(),\n  ma.getCallee().getAParamType().toString(), ma.getCallee().getDeclaringType()\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N72", "label": "module: test-kotlin2/library-tests/extensions/methodaccesses.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/extensions/methodaccesses.ql\u003cbr\u003e\u003cpre\u003eimport java\n\n// For extension methods we use JVM bytecode representation:\n// * the qualifier is the dispatch receiver expression, and\n// * the extension receiver expression is the 0th argument.\nfrom MethodCall ma\nselect ma, ma.getQualifier(), ma.getAnArgument()\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N73", "label": "module: test-kotlin2/library-tests/extensions/parameters.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/extensions/parameters.ql\u003cbr\u003e\u003cpre\u003eimport java\n\nfrom Method m, int n\nwhere m.fromSource()\nselect m, m.getParameter(n), n\n\nquery predicate parametersWithArgs(Parameter p, int idx, Expr arg) {\n  p.fromSource() and p.getPosition() = idx and p.getAnArgument() = arg\n}\n\nquery predicate extensionParameter(Parameter p) { p.isExtensionParameter() }\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N74", "label": "module: test-kotlin2/library-tests/extensions/methods.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/extensions/methods.ql\u003cbr\u003e\u003cpre\u003eimport java\n\n// Stop external filepaths from appearing in the results\nclass ClassOrInterfaceLocation extends ClassOrInterface {\n  override predicate hasLocationInfo(string path, int sl, int sc, int el, int ec) {\n    exists(string fullPath | super.hasLocationInfo(fullPath, sl, sc, el, ec) |\n      if exists(this.getFile().getRelativePath())\n      then path = fullPath\n      else path = fullPath.regexpReplaceAll(\".*/\", \"\u003cexternal\u003e/\")\n    )\n  }\n}\n\nfrom Method m\nwhere m.fromSource()\nselect m, m.getRet\u003c/pre\u003e"}, {"color": "#90CAF9", "id": "N75", "label": "class: ClassOrInterfaceLocation", "shape": "dot", "size": 10, "title": "\u003cb\u003eclass\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/extensions/methods.ql\u003cbr\u003e\u003cpre\u003eimport java\n\n// Stop external filepaths from appearing in the results\nclass ClassOrInterfaceLocation extends ClassOrInterface {\n  override predicate hasLocationInfo(string path, int sl, int sc, int el, int ec) {\n    exists(string fullPath | super.hasLocationInfo(fullPath, sl, sc, el, ec) |\n      if exists(this.getFile().getRelativePath())\n      then path = fullPath\n      else path = fullPath.regexpReplaceAll(\".*/\", \"\u003cexternal\u003e/\")\n    )\n  }\n}\n\nfrom Method m\nwhere m.fromSource()\nselect m, m.getRet\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N76", "label": "module: test-kotlin2/library-tests/extensions_recursion/element.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/extensions_recursion/element.ql\u003cbr\u003e\u003cpre\u003eimport java\n\nfrom Element e\nwhere e.fromSource()\nselect e, concat(e.getAPrimaryQlClass(), \", \")\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N77", "label": "module: test-kotlin2/library-tests/fake_overrides/all_kotlin/call.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/fake_overrides/all_kotlin/call.ql\u003cbr\u003e\u003cpre\u003eimport java\n\nfrom MethodCall c\nselect c, c.getCallee(), c.getCallee().getDeclaringType(),\n  c.getCallee().getDeclaringType().(NestedType).getEnclosingType()\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N78", "label": "module: test-kotlin2/library-tests/fake_overrides/kotlin_calling_java/call.ql", "shape": "dot", "size": , {"color": "#FFAB91", "id": "N82", "label": "module: test-kotlin2/library-tests/interface-delegate/test.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/interface-delegate/test.ql\u003cbr\u003e\u003cpre\u003eimport java\n\nquery predicate fields(Field f, Expr init) { f.getInitializer() = init }\n\nfrom Callable c\nwhere c.fromSource()\nselect c, c.getDeclaringType()\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N83", "label": "module: test-kotlin2/library-tests/properties/properties.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/properties/properties.ql\u003cbr\u003e\u003cpre\u003eimport java\n\nnewtype TMaybeElement =\n  TElement(Element e) or\n  TNoElement()\n\nclass MaybeElement extends TMaybeElement {\n  abstract string toString();\n\n  abstract Location getLocation();\n}\n\nclass YesMaybeElement extends MaybeElement {\n  Element e;\n\n  YesMaybeElement() { this = TElement(e) }\n\n  override string toString() { result = e.toString() }\n\n  override Location getLocation() { result = e.getLocation() }\n}\n\nclass NoMaybeElement extends MaybeElement {\n  NoMaybeElement() { this = TNoElement() \u003c/pre\u003e"}, {"color": "#90CAF9", "id": "N84", "label": "class: MaybeElement", "shape": "dot", "size": 10, "title": "\u003cb\u003eclass\u003c/b\u003e\u003cbr\u003etest-kotlin2/library-tests/properties/properties.ql\u003cbr\u003e\u003cpre\u003eimport java\n\nnewtype TMaybeElement =\n  TElement(Element e) or\n  TNoElement()\n\nclass MaybeElement extends TMaybeElement {\n  abstract string toString();\n\n  abstract Location getLocation();\n}\n\nclass YesMaybeElement extends MaybeElement {\n  Element e;\n\n  YesMaybeElement() { this = TElement(e) }\n\n  override string toString() { result = e.toString() }\n\n  override Location getLocation() { result = e.getLocation() }\n}\n\nclass NoMaybeElement extends MaybeElement {\n  NoMaybeElement( ink\nwhere Flow::flow(source, sink)\n\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N328", "label": "module: test/library-tests/controlflow/basic/bbStrictDominance.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest/library-tests/controlflow/basic/bbStrictDominance.ql\u003cbr\u003e\u003cpre\u003eimport java\nimport semmle.code.java.controlflow.Dominance\n\nfrom BasicBlock b, BasicBlock b2\nwhere b.strictlyDominates(b2)\nselect b, b2\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N329", "label": "module: test/library-tests/controlflow/basic/strictDominance.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest/library-tests/controlflow/basic/strictDominance.ql\u003cbr\u003e\u003cpre\u003eimport default\nimport semmle.code.java.controlflow.Dominance\n\nfrom Stmt pre, Stmt post\nwhere strictlyDominates(pre.getControlFlowNode(), post.getControlFlowNode())\nselect pre, post\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N330", "label": "module: test/library-tests/controlflow/basic/bbStmts.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest/library-tests/controlflow/basic/bbStmts.ql\u003cbr\u003e\u003cpre\u003eimport default\n\nfrom BasicBlock b, ControlFlowNode n, int i\nwhere\n  b.getNode(i) = n and\n  b.getEnclosingCallable().getFile().(CompilationUnit).fromSource()\nselect b, i, n\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N331", "label": "module: test/library-tests/controlflow/basic/bbSuccessor.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest/library-tests/controlflow/basic/bbSuccessor.ql\u003cbr\u003e\u003cpre\u003eimport java\n\nfrom BasicBlock b, BasicBlock b2\nwhere b.getASuccessor() = b2\nselect b, b2\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N332", "label": "module: test/library-tests/controlflow/basic/strictPostDominance.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest/library-tests/controlflow/basic/strictPostDominance.ql\u003cbr\u003e\u003cpre\u003eimport default\nimport semmle.code.java.controlflow.Dominance\n\nfrom Stmt pre, Stmt post\nwhere strictlyPostDominates(post.getControlFlowNode(), pre.getControlFlowNode())\nselect post, pre\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N333", "label": "module: test/library-tests/controlflow/dominance/dominanceWrong.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest/library-tests/controlflow/dominance/dominanceWrong.ql\u003cbr\u003e\u003cpre\u003eRepresents a path from `entry` to `node` that doesn\u0027t go through `dom`. If\n `entry` is the entry node for the CFG then this shows that `dom` does not\n dominate `node`.\u003c/pre\u003e"}, {"color": "#A5D6A7", "id": "N334", "label": "predicate: dominanceCounterExample", "shape": "dot", "size": 10, "title": "\u003cb\u003epredicate\u003c/b\u003e\u003cbr\u003etest/library-tests/controlflow/dominance/dominanceWrong.ql\u003cbr\u003e\u003cpre\u003eRepresents a path from `entry` to `node` that doesn\u0027t go through `dom`. If\n `entry` is the entry node for the CFG then this shows that `dom` does not\n dominate `node`.\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N335", "label": "module: test/library-tests/controlflow/dominance/dominanceBad.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest/library-tests/controlflow/dominance/dominanceBad.ql\u003cbr\u003e\u003cpre\u003eimport java\nimport semmle.code.java.controlflow.Dominance\n\nfrom IfStmt i, BlockStmt b\nwhere\n  b = i.getThen() and\n  dominates(i.getThen().getControlFlowNode(), b.getControlFlowNode()) and\n  dominates(i.getElse().getControlFlowNode(), b.getControlFlowNode())\nselect i, b\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N336", "label": "module: test/library-tests/controlflow/dominance/dominatedByStart.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest/library-tests/controlflow/dominance/dominatedByStart.ql\u003cbr\u003e\u003cpre\u003e// All nodes should be dominated by their associated start node\nimport default\nimport semmle.code.java.controlflow.Dominance\n\nControlFlowNode reachableIn(Method func) {\n  result = func.getBody().getControlFlowNode() or\n  result = reachableIn(func).getASuccessor()\n}\n\nfrom Method func, ControlFlowNode entry, ControlFlowNode node\nwhere\n  func.getBody().getControlFlowNode() = entry and\n  reachableIn(func) = node and\n  entry != node and\n  not strictlyDominates(func.getBody().getControlFlowNode(), nod\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N337", "label": "module: test/library-tests/controlflow/dominance/dominator.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest/library-tests/controlflow/dominance/dominator.ql\u003cbr\u003e\u003cpre\u003eimport default\nimport semmle.code.java.controlflow.Dominance\n\nfrom Method func, ControlFlowNode dominator, ControlFlowNode node\nwhere\n  iDominates(dominator, node) and\n  dominator.getEnclosingStmt().getEnclosingCallable() = func and\n  func.getDeclaringType().hasName(\"Test\")\nselect dominator, node\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N338", "label": "module: test/library-tests/controlflow/dominance/dominatorUnique.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest/library-tests/controlflow/dominance/dominatorUnique.ql\u003cbr\u003e\u003cpre\u003e// Every reachable node has a dominator\nimport default\nimport semmle.code.java.controlflow.Dominance\n\nfrom Method func, ControlFlowNode dom1, ControlFlowNode dom2, ControlFlowNode node\nwhere\n  iDominates(dom1, node) and\n  iDominates(dom2, node) and\n  dom1 != dom2 and\n  func = node.getEnclosingStmt().getEnclosingCallable()\nselect func, node, dom1, dom2\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N339", "label": "module: test/library-tests/controlflow/dominance/dominatorExists.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest/library-tests/controlflow/dominance/dominatorExists.ql\u003cbr\u003e\u003cpre\u003etransitive dominance\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N340", "label": "module: test/library-tests/controlflow/paths/paths.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest/library-tests/controlflow/paths/paths.ql\u003cbr\u003e\u003cpre\u003eimport java\nimport semmle.code.java.controlflow.Paths\n\nclass PathTestConf extends ActionConfiguration {\n  PathTestConf() { this = \"PathTestConf\" }\n\n  override predicate isAction(ControlFlowNode node) {\n    node.asExpr().(MethodCall).getMethod().hasName(\"action\")\n  }\n}\n\nfrom Callable c, PathTestConf conf\nwhere conf.callableAlwaysPerformsAction(c)\nselect c\u003c/pre\u003e"}, {"color": "#90CAF9", "id": "N341", "label": "class: PathTestConf", "shape": "dot", "size": 10, "title": "\u003cb\u003eclass\u003c/b\u003e\u003cbr\u003etest/library-tests/controlflow/paths/paths.ql\u003cbr\u003e\u003cpre\u003eimport java\nimport semmle.code.java.controlflow.Paths\n\nclass PathTestConf extends ActionConfiguration {\n  PathTestConf() { this = \"PathTestConf\" }\n\n  override predicate isAction(ControlFlowNode node) {\n    node.asExpr().(MethodCall).getMethod().hasName(\"action\")\n  }\n}\n\nfrom Callable c, PathTestConf conf\nwhere conf.callableAlwaysPerformsAction(c)\nselect c\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N342", "label": "module: test/library-tests/JDK/StringMatch.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest/library-tests/JDK/StringMatch.ql\u003cbr\u003e\u003cpre\u003eimport java\n\nfrom MethodCall ma, StringPartialMatchMethod m\nwhere ma.getMethod() = m\nselect ma, ma.getArgument(m.getMatchParameterIndex())\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N343", "label": "module: test/library-tests/JDK/Main.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest/library-tests/JDK/Main.ql\u003cbr\u003e\u003cpre\u003e@name Main\n @description Test the definition of class MainMethod\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N344", "label": "module: test/library-tests/JDK/SystemGetPropertyCall.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest/library-tests/JDK/SystemGetPropertyCall.ql\u003cbr\u003e\u003cpre\u003eimport java\n\nfrom MethodCallSystemGetProperty ma\nwhere ma.hasCompileTimeConstantGetPropertyName(\"user.dir\")\nselect ma\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N345", "label": "module: test/library-tests/modifiers/EnumFinality.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest/library-tests/modifiers/EnumFinality.ql\u003cbr\u003e\u003cpre\u003eimport java\n\nfrom EnumType e, string isFinal\nwhere\n  e.fromSource() and\n  if e.isFinal() then isFinal = \"final\" else isFinal = \"not final\"\nselect e, isFinal\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N346", "label": "module: test/library-tests/callgraph/HashCodeCallees.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest/library-tests/callgraph/HashCodeCallees.ql\u003cbr\u003e\u003cpre\u003eimport default\n\nfrom HashCodeMethod hm, Callable callee\nwhere callee = hm.getACallee()\nselect hm.getDeclaringType() + \".\" + hm, callee.getDeclaringType() + \".\" + callee\u003c/pre\u003e"}, {"color": "#FFAB91", "id": "N347", "label": "module: test/library-tests/gwt/JSNI.ql", "shape": "dot", "size": 10, "title": "\u003cb\u003emodule\u003c/b\u003e\u003cbr\u003etest/library-tests/gwt/JSNI.ql\u003cbr\u003e\u003cpre\u003eimport java\nimport semmle.code.java.frameworks.gwt.GWT\n\nfrom JsniComment jsni\nselect jsni, jsni.getImplementedMethod()\u003c/pre\u003e"}, {"color": "#FFE082", "id": "N348", "label": "import: semmle.cod

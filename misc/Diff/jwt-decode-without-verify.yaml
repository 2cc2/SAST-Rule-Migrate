rules:
- id: java-jwt-decode-without-verify
  message: >-
    Detected the decoding of a JWT token without a verify step.
    JWT tokens must be verified before use, otherwise the token's
    integrity is unknown. This means a malicious actor could forge
    a JWT token with any claims. Call '.verify()' before using the token.
    检测到在未进行验证步骤的情况下解码了 JWT 令牌。
    JWT 令牌在使用前必须进行验证，否则令牌的完整性将无法保证。
    这意味着恶意行为者可能伪造带有任意声明的 JWT 令牌。
    请在使用令牌之前调用 .verify() 方法进行验证。
  metadata:
    cwe:
    - 'CWE-345: Insufficient Verification of Data Authenticity'
    owasp:
    - A08:2021 - Software and Data Integrity Failures
    source-rule-url: https://semgrep.dev/blog/2020/hardcoded-secrets-unverified-tokens-and-other-common-jwt-mistakes/
    category: security
    technology:
    - jwt
    confidence: MEDIUM
    references:
    - https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures
    subcategory:
    - vuln
    likelihood: LOW
    impact: HIGH
  languages: [java]
  severity: WARNING


  patterns:
  - pattern: |
      com.auth0.jwt.JWT.decode(...);
      这部分定义了要匹配的代码模式。
      它会查找所有调用 com.auth0.jwt.JWT.decode(...) 的代码。
      ... 表示可以匹配任意参数。
  - pattern-not-inside: |-
      class $CLASS {
        ...
        $RETURNTYPE $FUNC (...) {
          ...
          $VERIFIER.verify(...);
          ...
        }
      }
# V1 和 V2 都与 YAML 原规则的目标范围和实现贴合，但在实现方式上有所不同：
# V1 更显式和精确，使用了 hasQualifiedName，适合需要严格匹配的场景。
# V2 更简洁，使用了 hasName 和 getDeclaringType，代码更易读。
# 如果需要更精确的匹配，推荐使用 V1；如果追求简洁性，推荐使用 V2。


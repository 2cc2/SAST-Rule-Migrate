rules:
- id: anonymous-ldap-bind
  metadata:
    cwe:
    - 'CWE-287: Improper Authentication'
    owasp:
    - A02:2017 - Broken Authentication
    - A07:2021 - Identification and Authentication Failures
    source-rule-url: https://find-sec-bugs.github.io/bugs.htm#LDAP_ANONYMOUS
    category: security
    technology:
    - java
    references:
    - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: HIGH
    confidence: LOW
  message: >-
    Detected anonymous LDAP bind.
    This permits anonymous users to execute LDAP statements. Consider enforcing
    authentication for LDAP. See https://docs.oracle.com/javase/tutorial/jndi/ldap/auth_mechs.html
    for more information.
    检测到匿名 LDAP 绑定。
    这允许匿名用户执行 LDAP 语句。请考虑为 LDAP 强制启用身份验证。
    有关更多信息，请参阅：https://docs.oracle.com/javase/tutorial/jndi/ldap/auth_mechs.html
    LDAP（轻量级目录访问协议，Lightweight Directory Access Protocol）绑定是指客户端与 LDAP 服务器之间建立连接并进行身份验证的过程。绑定是 LDAP 协议中用于验证客户端身份的操作，通常在客户端尝试访问目录服务资源时执行。
  severity: WARNING

  
  pattern: |
    $ENV.put($CTX.SECURITY_AUTHENTICATION, "none");
    ...
    $DCTX = new InitialDirContext($ENV, ...);
  languages:
  - java
  # V1 更贴合 YAML 原规则的目标范围和实现，因为它使用了数据流分析，能够检测更复杂的代码路径，符合 YAML 规则中隐含的动态分析需求。
# V2 更适合简单的静态模式匹配场景，但在处理复杂代码路径时可能存在局限性。



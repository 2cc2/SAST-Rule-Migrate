rules:
  - id: subprocess-launched-with-variable
    message: Subprocess launched with variable or potential tainted input
    languages: [go]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: exec.Command($ARGS...)
          - pattern: exec.CommandContext($_, $ARGS...)
          - pattern: syscall.Exec($ARGS...)
          - pattern: syscall.ForkExec($ARGS...)
          - pattern: syscall.StartProcess($ARGS...)
          - pattern: execabs.Command($ARGS...)
          - pattern: execabs.CommandContext($_, $ARGS...)
      - metavariable-pattern:
          metavariable: $ARGS
          pattern-either:
            - pattern: $VAR
            - pattern: $_($PARAMS...)
            - pattern: $_[$INDEX]
      - pattern-not: exec.Command(..., $CONST, ...)
      - pattern-not: exec.CommandContext($_, ..., $CONST, ...)
      - pattern-not: syscall.Exec(..., $CONST, ...)
      - pattern-not: syscall.ForkExec(..., $CONST, ...)
      - pattern-not: syscall.StartProcess(..., $CONST, ...)
      - pattern-not: execabs.Command(..., $CONST, ...)
      - pattern-not: execabs.CommandContext($_, ..., $CONST, ...)
      - metavariable-pattern:
          metavariable: $CONST
          pattern: ^".*"
rules:
- id: integer-overflow-check
  message: Potential Integer overflow made by strconv.Atoi result conversion to int16/32
  languages: [go]
  severity: WARNING
  patterns:
    - pattern-either:
        - pattern: |
            $LVAL, _ := strconv.Atoi(...)
            ...
            int32($LVAL)
        - pattern: |
            $LVAL, _ := strconv.Atoi(...)
            ...
            int16($LVAL)
        - pattern: |
            $LVAL = strconv.Atoi(...)
            ...
            int32($LVAL)
        - pattern: |
            $LVAL = strconv.Atoi(...)
            ...
            int16($LVAL)
        - pattern: |
            var $LVAL = strconv.Atoi(...)
            ...
            int32($LVAL)
        - pattern: |
            var $LVAL = strconv.Atoi(...)
            ...
            int16($LVAL)
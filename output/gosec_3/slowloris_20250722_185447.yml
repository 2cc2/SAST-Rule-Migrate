# 转换后的 Semgrep 规则
rules:
- id: slowloris
  message: Potential Slowloris Attack because ReadHeaderTimeout is not configured in the http.Server
  languages:
    - go
  severity: WARNING
  patterns:
    - pattern: |
        $X := http.Server{
          ...
        }
    - pattern: |
        $X = http.Server{
          ...
        }
    - pattern: |
        var $X = http.Server{
          ...
        }
    - pattern-not: |
        $X := http.Server{
          ...,
          ReadHeaderTimeout: $_,
          ...
        }
    - pattern-not: |
        $X := http.Server{
          ...,
          ReadTimeout: $_,
          ...
        }
    - pattern-not: |
        $X = http.Server{
          ...,
          ReadHeaderTimeout: $_,
          ...
        }
    - pattern-not: |
        $X = http.Server{
          ...,
          ReadTimeout: $_,
          ...
        }
    - pattern-not: |
        var $X = http.Server{
          ...,
          ReadHeaderTimeout: $_,
          ...
        }
    - pattern-not: |
        var $X = http.Server{
          ...,
          ReadTimeout: $_,
          ...
        }
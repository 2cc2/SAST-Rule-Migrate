rules:
  - id: uses-weak-cryptography-hash
    message: Use of weak cryptographic primitive
    languages: [go]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: crypto/md5.New(...)
          - pattern: crypto/md5.Sum(...)
          - pattern: crypto/sha1.New(...)
          - pattern: crypto/sha1.Sum(...)
    metadata:
      category: security
      confidence: HIGH
      references:
        - https://github.com/securego/gosec/blob/master/rules/hashes.go
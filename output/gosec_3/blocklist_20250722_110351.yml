rules:
  - id: blocklisted-import-md5
    patterns:
      - pattern: import "crypto/md5"
    message: "Blocklisted import crypto/md5: weak cryptographic primitive"
    severity: WARNING
    languages: [go]
    metadata:
      confidence: HIGH
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"


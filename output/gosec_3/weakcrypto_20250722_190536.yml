rules:
  - id: use-of-weak-cryptography
    message: Use of weak cryptographic primitive
    severity: WARNING
    languages:
      - go
    patterns:
      - pattern: |
          $PKG.$FUNC(...)
      - metavariable-pattern:
          metavariable: $PKG
          patterns:
            - pattern: |
                "crypto/des"
            - pattern: |
                "crypto/rc4"
      - metavariable-pattern:
          metavariable: $FUNC
          patterns:
            - pattern: |
                "NewCipher"
            - pattern: |
                "NewTripleDESCipher"
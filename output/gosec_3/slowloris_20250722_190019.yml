rules:
  - id: slowloris
    message: Potential Slowloris Attack because ReadHeaderTimeout is not configured in the http.Server
    languages:
      - go
    severity: WARNING
    patterns:
      - pattern: |
          &http.Server{
              ...,
          }
      - pattern-not: |
          &http.Server{
              ...,
              ReadHeaderTimeout: $TIMEOUT,
              ...,
          }
    fix: |
      &http.Server{
          ReadHeaderTimeout: 60 * time.Second,
          ...,
      }
    paths:
      exclude:
        - "*_test.go"
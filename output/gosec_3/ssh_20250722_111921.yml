rules:
  - id: insecure-ssh-hostkey
    message: Use of ssh InsecureIgnoreHostKey should be audited
    languages:
      - go
    severity: WARNING
    patterns:
      - pattern: |
          $PKG.$CALL(...)
      - metavariable-comparison:
          metavariable: $PKG
          comparison: $PKG == "golang.org/x/crypto/ssh"
      - metavariable-comparison:
          metavariable: $CALL
          comparison: $CALL == "InsecureIgnoreHostKey"
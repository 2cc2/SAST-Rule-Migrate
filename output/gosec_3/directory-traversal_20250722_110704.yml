rules:
- id: potential-directory-traversal
  patterns:
    - pattern: |
        $FUNC($ARG)
    - metavariable-regex:
        metavariable: $FUNC
        regex: http\.Dir
    - metavariable-regex:
        metavariable: $ARG
        regex: "['\"]/['\"]"
  message: Potential directory traversal
  languages: [go]
  severity: WARNING
  confidence: MEDIUM
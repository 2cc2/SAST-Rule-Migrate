rules:
  - id: hardcoded-credentials
    message: Potential hardcoded credentials
    languages:
      - go
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: |
              $VAR := $VAL
              $VAR = $VAL
              var $VAR = $VAL
              const $VAR = $VAL
          - pattern: $X == $VAL
          - pattern: $X != $VAL
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)passwd|pass|password|pwd|secret|token|pw|apiKey|bearer|cred
      - metavariable-regex:
          metavariable: $VAL
          regex: >
            (-----BEGIN (RSA|DSA|EC) PRIVATE KEY-----)|
            (-----BEGIN PGP PRIVATE KEY BLOCK-----)|
            (xox[pborsa]-[0-9]{12}-[0-9]{12}-[0-9]{12}-[a-z0-9]{32})|
            (AKIA[0-9A-Z]{16})|
            (amzn\.mws\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})|
            (da2-[a-z0-9]{26})|
            (ghp_[a-zA-Z0-9]{36})|
            (github_pat_[a-zA-Z0-9]{22}_[a-zA-Z0-9]{59})|
            (ghs_[a-zA-Z0-9]{36})|
            (AIza[0-9A-Za-z\-_]{35})|
            ([0-9]+-[0-9A-Za-z_]{32}\.apps\.googleusercontent\.com)|
            ("type": "service_account")|
            (ya29\.[0-9A-Za-z\-_]+)|
            ([aA][pP][iI]_?[kK][eE][yY].*['"][0-9a-zA-Z]{32,45}['"])|
            ([sS][eE][cC][rR][eE][tT].*['"][0-9a-zA-Z]{32,45}['"])|
            ([hH][eE][rR][oO][kK][uU].*[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12})|
            ([0-9a-f]{32}-us[0-9]{1,2})|
            (key-[0-9a-zA-Z]{32})|
            ([a-zA-Z]{3,10}://[^/\\s:@]{3,20}:[^/\\s:@]{3,20}@.{1,100}["'\\s])|
            (https://hooks\.slack\.com/services/T[a-zA-Z0-9_]{8}/B[a-zA-Z0-9_]{8}/[a-zA-Z0-9_]{24})|
            (sk_live_[0-9a-zA-Z]{24})|
            (rk_live_[0-9a-zA-Z]{24})|
            (sq0atp-[0-9A-Za-z\-_]{22})|
            (sq0csp-[0-9A-Za-z\-_]{43})|
            ([0-9]+:AA[0-9A-Za-z\-_]{33})|
            (SK[0-9a-fA-F]{32})|
            ([tT][wW][iI][tT][tT][eE][rR].*[1-9][0-9]+-[0-9a-zA-Z]{40})|
            ([tT][wW][iI][tT][tT][eE][rR].*['"][0-9a-zA-Z]{35,44}['"])
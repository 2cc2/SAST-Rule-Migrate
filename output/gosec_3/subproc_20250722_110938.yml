rules:
  - id: subprocess-launched-with-variable
    message: Subprocess launched with variable or potential tainted input
    languages:
      - go
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: exec.Command($...ARGS)
          - pattern: exec.CommandContext($_, $...ARGS)
          - pattern: syscall.Exec($...ARGS)
          - pattern: syscall.ForkExec($...ARGS)
          - pattern: syscall.StartProcess($...ARGS)
          - pattern: execabs.Command($...ARGS)
          - pattern: execabs.CommandContext($_, $...ARGS)
      - focus-metavariable: $...ARGS
      - pattern-not: "..."
      - pattern-not: $CONST
      - pattern-not: $CONST + $CONST
      - pattern-either:
          - patterns:
              - pattern: |
                  $VAR := $VAL
              - metavariable-regex:
                  metavariable: $VAR
                  regex: "^[a-zA-Z_][a-zA-Z0-9_]*$"
              - pattern-not: $VAR := $CONST
          - patterns:
              - pattern: $VAR = $VAL
              - metavariable-regex:
                  metavariable: $VAR
                  regex: "^[a-zA-Z_][a-zA-Z0-9_]*$"
              - pattern-not: $VAR = $CONST
          - patterns:
              - pattern: var $VAR = $VAL
              - metavariable-regex:
                  metavariable: $VAR
                  regex: "^[a-zA-Z_][a-zA-Z0-9_]*$"
              - pattern-not: var $VAR = $CONST
    metadata:
      references:
        - https://github.com/securego/gosec/blob/master/rules/subprocess.go
      category: security
      confidence: MEDIUM
      technology:
        - go
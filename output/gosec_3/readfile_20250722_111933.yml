rules:
- id: potential-file-inclusion-via-variable
  patterns:
    - pattern-either:
      - pattern: os.Open($X)
      - pattern: os.ReadFile($X)
      - pattern: os.OpenFile($X, ...)
      - pattern: os.Create($X)
      - pattern: ioutil.ReadFile($X)
    - pattern-not: path/filepath.Clean($X)
    - pattern-not: path/filepath.Rel(..., $X)
    - pattern-not: path/filepath.EvalSymlinks($X)
    - pattern-not: path/filepath.Join(...)
    - pattern-not: path.Join(...)
    - metavariable-pattern:
        metavariable: $X
        patterns:
          - pattern-either:
            - pattern: $X + $Y
            - pattern: $Y + $X
            - pattern: filepath.Join($PATHVAR)
            - pattern: path.Join($PATHVAR)
  message: Potential file inclusion via variable
  severity: WARNING
  languages:
    - go
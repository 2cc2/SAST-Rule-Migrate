rules:
  - id: potential-directory-traversal
    message: Potential directory traversal
    severity: WARNING
    languages:
      - go
    patterns:
      - pattern: |
          $X.$FUNC($LIT)
      - metavariable-regex:
          metavariable: $X
          regex: http
      - metavariable-regex:
          metavariable: $FUNC
          regex: Dir
      - metavariable-regex:
          metavariable: $LIT
          regex: \"/\"|'/'
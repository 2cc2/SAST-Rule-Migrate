rules:
  - id: insecure-template-usage
    message: The used method does not auto-escape HTML. This can potentially lead to 'Cross-site Scripting' vulnerabilities, in case the attacker controls the input.
    severity: WARNING
    languages:
      - go
    patterns:
      - pattern-either:
          - pattern: |
              template.CSS($ARG)
          - pattern: |
              template.HTML($ARG)
          - pattern: |
              template.HTMLAttr($ARG)
          - pattern: |
              template.JS($ARG)
          - pattern: |
              template.JSStr($ARG)
          - pattern: |
              template.Srcset($ARG)
          - pattern: |
              template.URL($ARG)
      - patterns:
          - pattern: import "html/template"
          - metavariable-pattern:
              metavariable: $ARG
              patterns:
                - pattern-not: $LIT
                - pattern-not: |
                    "..."
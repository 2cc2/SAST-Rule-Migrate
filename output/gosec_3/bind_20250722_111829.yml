rules:
  - id: binds-to-all-network-interfaces
    message: Binds to all network interfaces
    severity: WARNING
    languages:
      - go
    patterns:
      - pattern: |
          (net.Listen($ADDR) | crypto/tls.Listen($ADDR))
      - metavariable-regex:
          metavariable: $ADDR
          regex: ^(0.0.0.0|:).*$
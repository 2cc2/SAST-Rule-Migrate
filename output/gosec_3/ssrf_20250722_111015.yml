rules:
  - id: ssrf
    message: Potential HTTP request made with variable url
    languages:
      - go
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: net/http.Do($VAR)
          - pattern: net/http.Get($VAR)
          - pattern: net/http.Head($VAR)
          - pattern: net/http.Post($VAR)
          - pattern: net/http.PostForm($VAR)
          - pattern: net/http.RoundTrip($VAR)
      - pattern-not: net/http.$FUNC("...")
      - metavariable-pattern:
          metavariable: $VAR
          pattern: $X
          pattern-not: "..."
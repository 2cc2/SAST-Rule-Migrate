rules:
  - id: sql-string-concat
    languages:
      - go
    message: SQL string concatenation
    severity: WARNING
    patterns:
      - pattern: |
          fmt.Sprintf($FORMAT, $ARGS...)
          sql.$FUNC($SQL)
      - patterns:
          - pattern-either:
              - pattern: |
                  $X := $Y
              - pattern: |
                  $X = $Y
              - pattern: |
                  var $X = $Y
          - pattern: |
              $Y = fmt.Sprintf($FORMAT, $ARGS...)
              sql.$FUNC($SQL)
      - metavariable-regex:
          metavariable: $SQL
          regex: '(?i)(SELECT|DELETE|INSERT|UPDATE|INTO|FROM|WHERE)( |\n|\r|\t)'
    fix: Use parameterized queries instead of string concatenation

  - id: sql-string-format
    languages:
      - go
    message: SQL string formatting
    severity: WARNING
    patterns:
      - pattern: |
          fmt.Sprintf($FORMAT, $ARGS...)
          sql.$FUNC($SQL)
      - patterns:
          - pattern-either:
              - pattern: |
                  $X := $Y
              - pattern: |
                  $X = $Y
              - pattern: |
                  var $X = $Y
          - pattern: |
              $Y = fmt.Sprintf($FORMAT, $ARGS...)
              sql.$FUNC($SQL)
      - metavariable-regex:
          metavariable: $FORMAT
          regex: '(?i)(SELECT|DELETE|INSERT|UPDATE|INTO|FROM|WHERE)( |\n|\r|\t)|%[^bdoxXfFp]'
    fix: Use parameterized queries instead of string formatting
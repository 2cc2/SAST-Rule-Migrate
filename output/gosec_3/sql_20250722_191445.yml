rules:
  - id: sql-string-concatenation
    patterns:
      - pattern-either:
          - pattern: |
              $VAR := $DB.$METHOD($QUERY, ...)
          - pattern: |
              $VAR = $DB.$METHOD($QUERY, ...)
          - pattern: |
              $DB.$METHOD($QUERY, ...)
      - metavariable-pattern:
          metavariable: $DB
          patterns:
            - pattern: $DB
            - pattern-either:
                - pattern: database/sql.DB
                - pattern: database/sql.Tx
      - metavariable-pattern:
          metavariable: $METHOD
          patterns:
            - pattern-either:
                - pattern: Exec
                - pattern: ExecContext
                - pattern: Query
                - pattern: QueryContext
                - pattern: QueryRow
                - pattern: QueryRowContext
                - pattern: Prepare
                - pattern: PrepareContext
      - metavariable-pattern:
          metavariable: $QUERY
          patterns:
            - pattern-not: $STRING_CONSTANT
            - pattern-regex: (?i)(SELECT|DELETE|INSERT|UPDATE|INTO|FROM|WHERE)( |\n|\r|\t)
    message: SQL string concatenation
    severity: WARNING
    languages:
      - go

  - id: sql-string-formatting
    patterns:
      - pattern-either:
          - pattern: |
              $VAR := fmt.$FMTMETHOD($FORMAT, ...)
          - pattern: |
              $VAR = fmt.$FMTMETHOD($FORMAT, ...)
          - pattern: |
              $DB.$METHOD(fmt.$FMTMETHOD($FORMAT, ...), ...)
      - metavariable-pattern:
          metavariable: $FMTMETHOD
          patterns:
            - pattern-either:
                - pattern: Sprint
                - pattern: Sprintf
                - pattern: Sprintln
                - pattern: Fprintf
      - metavariable-pattern:
          metavariable: $FORMAT
          patterns:
            - pattern-regex: (?i)(SELECT|DELETE|INSERT|UPDATE|INTO|FROM|WHERE)( |\n|\r|\t)
            - pattern-regex: "%[^bdoxXfFp]"
      - metavariable-pattern:
          metavariable: $METHOD
          patterns:
            - pattern-either:
                - pattern: Exec
                - pattern: ExecContext
                - pattern: Query
                - pattern: QueryContext
                - pattern: QueryRow
                - pattern: QueryRowContext
                - pattern: Prepare
                - pattern: PrepareContext
    message: SQL string formatting
    severity: WARNING
    languages:
      - go
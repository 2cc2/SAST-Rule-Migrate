rules:
  - id: decompression-bomb-check
    message: Potential DoS vulnerability via decompression bomb
    languages:
      - go
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: |
              $R, $_ := $PKG.NewReader($ARG)
          - pattern: |
              $R := $PKG.NewReader($ARG)
          - pattern: |
              var $R = $PKG.NewReader($ARG)
      - pattern: io.Copy($_, $R)
    metavariable-regex:
      metavariable: $PKG
      regex: |
        compress/gzip|compress/zlib|compress/bzip2|compress/flate|
        compress/lzw|archive/tar|archive/zip|\*archive/zip\.File
rules:
  - id: blocklisted-import-md5
    pattern: |
      import "crypto/md5"
    message: "Blocklisted import crypto/md5: weak cryptographic primitive"
    languages: [go]
    severity: MEDIUM
    confidence: HIGH

  - id: blocklisted-import-des
    pattern: |
      import "crypto/des"
    message: "Blocklisted import crypto/des: weak cryptographic primitive"
    languages: [go]
    severity: MEDIUM
    confidence: HIGH

  - id: blocklisted-import-rc4
    pattern: |
      import "crypto/rc4"
    message: "Blocklisted import crypto/rc4: weak cryptographic primitive"
    languages: [go]
    severity: MEDIUM
    confidence: HIGH

  - id: blocklisted-import-cgi
    pattern: |
      import "net/http/cgi"
    message: "Blocklisted import net/http/cgi: Go versions < 1.6.3 are vulnerable to Httpoxy attack: (CVE-2016-5386)"
    languages: [go]
    severity: MEDIUM
    confidence: HIGH

  - id: blocklisted-import-sha1
    pattern: |
      import "crypto/sha1"
    message: "Blocklisted import crypto/sha1: weak cryptographic primitive"
    languages: [go]
    severity: MEDIUM
    confidence: HIGH

  - id: blocklisted-import-md4
    pattern: |
      import "golang.org/x/crypto/md4"
    message: "Blocklisted import golang.org/x/crypto/md4: deprecated and weak cryptographic primitive"
    languages: [go]
    severity: MEDIUM
    confidence: HIGH

  - id: blocklisted-import-ripemd160
    pattern: |
      import "golang.org/x/crypto/ripemd160"
    message: "Blocklisted import golang.org/x/crypto/ripemd160: deprecated and weak cryptographic primitive"
    languages: [go]
    severity: MEDIUM
    confidence: HIGH
  
  - id: blocklisted-import-generic
    patterns:
      - pattern: |
          import "$PKG"
      - metavariable-pattern:
          metavariable: $PKG
          patterns:
            - pattern-not: _ # This will be overridden by the deny-list
    message: "Blocklisted import $PKG: $REASON"
    languages: [go]
    severity: MEDIUM
    confidence: HIGH
    options:
      blocklisted-packages:
        "crypto/md5": "weak cryptographic primitive"
        "crypto/des": "weak cryptographic primitive"
        "crypto/rc4": "weak cryptographic primitive"
        "net/http/cgi": "Go versions < 1.6.3 are vulnerable to Httpoxy attack: (CVE-2016-5386)"
        "crypto/sha1": "weak cryptographic primitive"
        "golang.org/x/crypto/md4": "deprecated and weak cryptographic primitive"
        "golang.org/x/crypto/ripemd160": "deprecated and weak cryptographic primitive"
rules:
- id: integer-overflow
  message: Potential Integer overflow made by strconv.Atoi result conversion to int16/32
  severity: WARNING
  languages:
    - go
  patterns:
    - pattern: |
        $VAR, $ERR := strconv.Atoi(...)
        ...
        int32($VAR)
    - pattern: |
        $VAR, $ERR := strconv.Atoi(...)
        ...
        int16($VAR)
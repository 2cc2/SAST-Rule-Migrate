rules:
- id: http-serve-without-timeouts
  message: Use of net/http serve function that has no support for setting timeouts
  languages:
    - go
  severity: WARNING
  patterns:
    - pattern-either:
      - pattern: net/http.ListenAndServe(...)
      - pattern: net/http.ListenAndServeTLS(...)
      - pattern: net/http.Serve(...)
      - pattern: net/http.ServeTLS(...)
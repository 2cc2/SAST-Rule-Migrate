rules:
- id: weak-rsa-key-strength
  patterns:
    - pattern-either:
      - pattern: crypto/rsa.GenerateKey(..., $BITS, ...)
      - pattern: rsa.GenerateKey(..., $BITS, ...)
    - metavariable-comparison:
        metavariable: $BITS
        comparison: $BITS < 2048
  message: RSA keys should be at least 2048 bits
  languages: [go]
  severity: WARNING
  confidence: HIGH
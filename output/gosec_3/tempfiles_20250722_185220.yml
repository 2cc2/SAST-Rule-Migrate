rules:
- id: insecure-temp-file
  message: File creation in shared tmp directory without using ioutil.Tempfile
  languages: [go]
  severity: WARNING
  patterns:
    - pattern-either:
        - pattern: |
            os.Create($PATH)
        - pattern: |
            os.WriteFile($PATH, ...)
        - pattern: |
            ioutil.WriteFile($PATH, ...)
    - metavariable-regex:
        metavariable: $PATH
        regex: ^(/(usr|var))?/tmp(/.*)?$
  fix-regex:
    regex: '(os\.(Create|WriteFile)|ioutil\.WriteFile)\('
    replacement: 'ioutil.TempFile('
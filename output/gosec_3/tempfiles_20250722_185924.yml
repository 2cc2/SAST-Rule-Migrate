rules:
- id: bad-temp-file
  message: File creation in shared tmp directory without using ioutil.Tempfile
  languages: [go]
  severity: WARNING
  patterns:
    - pattern-either:
      - pattern: io/ioutil.WriteFile($PATH, ...)
      - pattern: os.Create($PATH)
      - pattern: os.WriteFile($PATH, ...)
    - pattern-either:
      - pattern: path.Join(os.TempDir(), ...)
      - pattern: path/filepath.Join(os.TempDir(), ...)
    - metavariable-regex:
        metavariable: $PATH
        regex: ^(/(usr|var))?/tmp(/.*)?$
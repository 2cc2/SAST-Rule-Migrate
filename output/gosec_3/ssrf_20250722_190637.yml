rules:
  - id: ssrf-check
    message: Potential HTTP request made with variable url
    languages:
      - go
    severity: WARNING
    patterns:
      - pattern: |
          $REQ := $URL
          $PKG.$METHOD($URL, ...)
      - pattern: |
          var $REQ = $URL
          $PKG.$METHOD($URL, ...)
      - pattern-not: |
          $PKG.$METHOD("http://constant-url.com", ...)
      - metavariable-pattern:
          metavariable: $PKG
          pattern: net/http
      - metavariable-pattern:
          metavariable: $METHOD
          pattern: Do|Get|Head|Post|PostForm|RoundTrip
rules:
  - id: pprof-profiling-endpoint-exposed
    languages:
      - go
    message: Profiling endpoint is automatically exposed on /debug/pprof
    severity: WARNING
    patterns:
      - pattern: |
          import (
            _ "net/http/pprof"
          )
      - pattern-not: |
          import (
            "net/http/pprof"
          )
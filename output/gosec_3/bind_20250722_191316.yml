rules:
  - id: binds-to-all-network-interfaces
    message: Binds to all network interfaces
    languages:
      - go
    severity: WARNING
    confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: |
              net.Listen($ADDR)
              crypto/tls.Listen($ADDR)
          - pattern: |
              $X.Listen($ADDR)
      - metavariable-regex:
          metavariable: $ADDR
          regex: ^(0\.0\.0\.0|:).*$
# 转换后的 Semgrep 规则
rules:
  - id: decompression-bomb-dos
    message: Potential DoS vulnerability via decompression bomb
    languages:
      - go
    severity: WARNING
    metadata:
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: |
              $READER, $_ := $PKG.$NEWREADER(...)
              io.Copy(..., $READER)
          - pattern: |
              $READER := $PKG.$NEWREADER(...)
              io.Copy(..., $READER)
          - pattern: |
              var $READER = $PKG.$NEWREADER(...)
              io.Copy(..., $READER)
          - pattern: |
              $FILE.Open(...)
              io.Copy(..., $READER)
      - metavariable-pattern:
          metavariable: $PKG.$NEWREADER
          patterns:
            - pattern-either:
                - pattern: compress/gzip.NewReader
                - pattern: compress/zlib.NewReader
                - pattern: compress/zlib.NewReaderDict
                - pattern: compress/bzip2.NewReader
                - pattern: compress/flate.NewReader
                - pattern: compress/flate.NewReaderDict
                - pattern: compress/lzw.NewReader
                - pattern: archive/tar.NewReader
                - pattern: archive/zip.NewReader
                - pattern: $FILE.Open
      - pattern-either:
          - pattern: io.Copy(...)
          - pattern: io.CopyBuffer(...)
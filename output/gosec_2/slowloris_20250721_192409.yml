# 转换后的 Semgrep 规则
rules:
  - id: slowloris
    message: Potential Slowloris Attack because ReadHeaderTimeout is not configured in the http.Server
    languages:
      - go
    severity: WARNING
    patterns:
      - pattern: |
          &http.Server{
            ...,
          }
      - pattern-not: |
          &http.Server{
            ...,
            ReadHeaderTimeout: $_,
            ...,
          }
      - pattern-not: |
          &http.Server{
            ...,
            ReadTimeout: $_,
            ...,
          }
rules:
  - id: weak-random-number-generator
    message: Use of weak random number generator (math/rand or math/rand/v2 instead of crypto/rand)
    severity: WARNING
    languages:
      - go
    patterns:
      - pattern-either:
          - pattern: math/rand.New(...)
          - pattern: math/rand.Read(...)
          - pattern: math/rand.Float32(...)
          - pattern: math/rand.Float64(...)
          - pattern: math/rand.Int(...)
          - pattern: math/rand.Int31(...)
          - pattern: math/rand.Int31n(...)
          - pattern: math/rand.Int63(...)
          - pattern: math/rand.Int63n(...)
          - pattern: math/rand.Intn(...)
          - pattern: math/rand.NormFloat64(...)
          - pattern: math/rand.Uint32(...)
          - pattern: math/rand.Uint64(...)
          - pattern: math/rand/v2.New(...)
          - pattern: math/rand/v2.Float32(...)
          - pattern: math/rand/v2.Float64(...)
          - pattern: math/rand/v2.Int(...)
          - pattern: math/rand/v2.Int32(...)
          - pattern: math/rand/v2.Int32N(...)
          - pattern: math/rand/v2.Int64(...)
          - pattern: math/rand/v2.Int64N(...)
          - pattern: math/rand/v2.IntN(...)
          - pattern: math/rand/v2.N(...)
          - pattern: math/rand/v2.NormFloat64(...)
          - pattern: math/rand/v2.Uint32(...)
          - pattern: math/rand/v2.Uint32N(...)
          - pattern: math/rand/v2.Uint64(...)
          - pattern: math/rand/v2.Uint64N(...)
          - pattern: math/rand/v2.UintN(...)
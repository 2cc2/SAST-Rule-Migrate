rules:
  - id: subprocess-launched-with-variable
    message: Subprocess launched with variable
    severity: WARNING
    languages:
      - go
    patterns:
      - pattern-either:
          - pattern: exec.Command($CMD, $ARGS...)
          - pattern: exec.CommandContext($CTX, $CMD, $ARGS...)
          - pattern: syscall.Exec($CMD, $ARGS, $ENV)
          - pattern: syscall.ForkExec($CMD, $ARGS, $ATTR)
          - pattern: syscall.StartProcess($CMD, $ARGS, $ATTR)
          - pattern: execabs.Command($CMD, $ARGS...)
          - pattern: execabs.CommandContext($CTX, $CMD, $ARGS...)
      - pattern-not: |
          $X = "..."
      - metavariable-pattern:
          metavariable: $ARGS
          patterns:
            - pattern-either:
                - pattern: $VAR
                - pattern: $FUNC(...)
            - pattern-not: |
                $CONST = "..."
    fix: |
      // TODO: Properly sanitize user input before using in subprocess
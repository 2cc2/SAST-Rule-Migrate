rules:
- id: directory-traversal
  message: Potential directory traversal
  languages:
    - go
  severity: WARNING
  patterns:
    - pattern: |
        $X.$FUNC($LIT)
    - metavariable-regex:
        metavariable: $LIT
        regex: \"\/\"|\'\/\'
    - metavariable-regex:
        metavariable: $X.$FUNC($LIT)
        regex: http\.Dir\("\/"\)|http\.Dir\('\/'\)
  metadata:
    confidence: MEDIUM
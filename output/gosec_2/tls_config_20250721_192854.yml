rules:
  - id: insecure-tls-modern
    message: Insecure TLS configuration detected. Use modern cipher suites only.
    languages: [go]
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: |
              &tls.Config{
                  MinVersion: $MINVER,
                  MaxVersion: $MAXVER,
                  CipherSuites: {$CIPHERS},
              }
          - pattern: |
              $_ := &tls.Config{
                  MinVersion: $MINVER,
                  MaxVersion: $MAXVER,
                  CipherSuites: {$CIPHERS},
              }
      - metavariable-regex:
          metavariable: $CIPHERS
          regex: (TLS_(RSA|ECDH|DHE)_)|(DES|RC4|MD5|SHA1|NULL|CBC|3DES|ECDHE)
      - metavariable-comparison:
          metavariable: $MINVER
          comparison: $MINVER != 0x0304
      - metavariable-comparison:
          metavariable: $MAXVER
          comparison: $MAXVER != 0x0304
      
  - id: insecure-tls-intermediate
    message: Insecure TLS configuration detected. Use intermediate cipher suites only.
    languages: [go]
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: |
              &tls.Config{
                  MinVersion: $MINVER,
                  MaxVersion: $MAXVER,
                  CipherSuites: {$CIPHERS},
              }
          - pattern: |
              $_ := &tls.Config{
                  MinVersion: $MINVER,
                  MaxVersion: $MAXVER,
                  CipherSuites: {$CIPHERS},
              }
      - metavariable-regex:
          metavariable: $CIPHERS
          regex: (TLS_RSA_)|(DES|RC4|MD5|SHA1|NULL|3DES)|(_CBC_SHA(256)?$)|(TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384)
      - metavariable-comparison:
          metavariable: $MINVER
          comparison: $MINVER < 0x0303
      - metavariable-comparison:
          metavariable: $MAXVER
          comparison: $MAXVER < 0x0304

  - id: insecure-tls-old
    message: Insecure TLS configuration detected. Avoid using old cipher suites.
    languages: [go]
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: |
              &tls.Config{
                  MinVersion: $MINVER,
                  MaxVersion: $MAXVER,
                  CipherSuites: {$CIPHERS},
              }
          - pattern: |
              $_ := &tls.Config{
                  MinVersion: $MINVER,
                  MaxVersion: $MAXVER,
                  CipherSuites: {$CIPHERS},
              }
      - metavariable-regex:
          metavariable: $CIPHERS
          regex: (TLS_(NULL|RSA_WITH_NULL|RSA_EXPORT)|_DES|_RC4|_MD5|_SHA1|_CBC)
      - metavariable-comparison:
          metavariable: $MINVER
          comparison: $MINVER < 0x0301
      - metavariable-comparison:
          metavariable: $MAXVER
          comparison: $MAXVER < 0x0304
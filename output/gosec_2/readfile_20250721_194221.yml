rules:
  - id: potential-file-inclusion-via-variable
    message: Potential file inclusion via variable
    severity: WARNING
    languages:
      - go
    patterns:
      - pattern-either:
          - pattern: os.Open($X)
          - pattern: os.ReadFile($X)
          - pattern: os.OpenFile($X)
          - pattern: os.Create($X)
          - pattern: ioutil.ReadFile($X)
      - pattern-not: filepath.Clean($X)
      - pattern-not: filepath.EvalSymlinks($X)
      - pattern-not: filepath.Rel($X)
      - metavariable-pattern:
          metavariable: $X
          patterns:
            - pattern-either:
                - pattern: path.Join(...)
                - pattern: path/filepath.Join(...)
                - pattern: $X + $Y
                - pattern: $Y + $X
            - pattern-not:
                pattern: $CONST
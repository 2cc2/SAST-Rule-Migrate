rules:
- id: integer-overflow-check
  message: Potential Integer overflow made by strconv.Atoi result conversion to int16/32
  severity: WARNING
  languages:
    - go
  patterns:
    - pattern-either:
        - pattern: |
            $V, _ := strconv.Atoi(...)
            int32($V)
        - pattern: |
            $V, _ := strconv.Atoi(...)
            int16($V)
        - pattern: |
            $V = strconv.Atoi(...)
            int32($V)
        - pattern: |
            $V = strconv.Atoi(...)
            int16($V)
  metadata:
    category: correctness
    confidence: MEDIUM
    references:
      - https://github.com/securego/gosec/blob/master/rules/integer_overflow.go
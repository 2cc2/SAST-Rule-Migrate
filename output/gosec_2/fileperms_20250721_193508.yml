rules:
  - id: file-permissions-write
    message: Expect WriteFile permissions to be %#o or less
    languages:
      - go
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: os.WriteFile($_, $_, $PERM, ...)
          - pattern: ioutil.WriteFile($_, $_, $PERM, ...)
      - pattern-not: (os.ModePerm | $PERM)
      - metavariable-comparison:
          metavariable: $PERM
          comparison: (PERM & 0o600) != 0o600
    fix: "600"

  - id: file-permissions-open
    message: Expect file permissions to be %#o or less
    languages:
      - go
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: os.OpenFile($_, $_, $PERM, ...)
          - pattern: os.Chmod($_, $PERM)
      - pattern-not: (os.ModePerm | $PERM)
      - metavariable-comparison:
          metavariable: $PERM
          comparison: (PERM & 0o600) != 0o600
    fix: "600"

  - id: file-permissions-mkdir
    message: Expect directory permissions to be %#o or less
    languages:
      - go
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: os.Mkdir($_, $PERM)
          - pattern: os.MkdirAll($_, $PERM)
      - pattern-not: (os.ModePerm | $PERM)
      - metavariable-comparison:
          metavariable: $PERM
          comparison: (PERM & 0o750) != 0o750
    fix: "750"

  - id: file-permissions-create
    message: Expect file permissions to be %#o or less but os.Create used with default permissions %#o
    languages:
      - go
    severity: WARNING
    patterns:
      - pattern: os.Create($_)
    fix-regex:
      regex: os\.Create\((.*)\)$
      replacement: "os.OpenFile($1, os.O_RDWR|os.O_CREATE|os.O_TRUNC, 0600)"
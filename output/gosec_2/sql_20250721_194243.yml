rules:
  - id: sql-string-concatenation
    message: SQL string concatenation
    languages: [go]
    severity: WARNING
    patterns:
      - pattern: |
          $QUERY = $ARGS
      - metavariable-regex:
          metavariable: $QUERY
          regex: (?i)(SELECT|DELETE|INSERT|UPDATE|INTO|FROM|WHERE)( |\n|\r|\t)|%[^bdoxXfFp]
      - pattern-not: |
          $QUERY = $CONST
      - pattern-not: |
          $QUERY = $FMT($ARGS...)
          $FMT($ARGS...)
    fix: Use parameterized queries instead of string concatenation

  - id: sql-string-formatting
    message: SQL string formatting
    languages: [go]
    severity: WARNING
    patterns:
      - pattern: |
          $QUERY = $FMT($FMTSTR, $ARGS...)
      - pattern-not: |
          $QUERY = $FMT($FMTSTR, ...$CONST)
      - metavariable-regex:
          metavariable: $FMTSTR
          regex: (?i)(SELECT|DELETE|INSERT|UPDATE|INTO|FROM|WHERE)( |\n|\r|\t)|%[^bdoxXfFp]
      - pattern-not: |
          $QUERY = fmt.Sprintf($FMTSTR, os.Stdout, ...)
      - pattern-not: |
          $QUERY = fmt.Sprintf($FMTSTR, os.Stderr, ...)
      - pattern-not: |
          $QUERY = pq.QuoteIdentifier($ARG)
    fix: Use parameterized queries instead of string formatting
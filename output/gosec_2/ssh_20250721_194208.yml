rules:
  - id: insecure-ssh-hostkey-callback
    message: Use of ssh InsecureIgnoreHostKey should be audited
    languages: [go]
    severity: WARNING
    patterns:
      - pattern: |
          $PKG.$CALL(...)
      - metavariable-regex:
          metavariable: $PKG
          regex: golang\.org/x/crypto/ssh
      - metavariable-regex:
          metavariable: $CALL
          regex: InsecureIgnoreHostKey
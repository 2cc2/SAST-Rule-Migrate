rules:
- id: binds-to-all-network-interfaces
  message: Binds to all network interfaces
  languages: [go]
  severity: WARNING
  patterns:
    - pattern-either:
      - pattern: |
          net.Listen($HOST, ...)
          {
            ...
            $HOST = $VAL
            ...
          }
      - pattern: |
          crypto/tls.Listen($HOST, ...)
          {
            ...
            $HOST = $VAL
            ...
          }
    - metavariable-regex:
        metavariable: $VAL
        regex: ^(0\.0\.0\.0|:).*$
  metadata:
    category: security
    confidence: HIGH
    references:
      - https://github.com/securego/gosec/blob/master/rules/binds.go
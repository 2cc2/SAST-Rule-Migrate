rules:
  - id: uses-weak-cryptography-encryption
    languages:
      - go
    message: Use of weak cryptographic primitive
    severity: WARNING
    confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: |
              crypto/des.NewCipher(...)
          - pattern: |
              crypto/des.NewTripleDESCipher(...)
          - pattern: |
              crypto/rc4.NewCipher(...)
    metadata:
      category: security
      references:
        - https://github.com/securego/gosec/blob/master/rules/weak_crypto.go
      technology:
        - go
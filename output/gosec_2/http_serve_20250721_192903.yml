rules:
- id: http-serve-without-timeouts
  message: Use of net/http serve function that has no support for setting timeouts
  languages:
    - go
  severity: WARNING
  patterns:
    - pattern: |
        (ListenAndServe|ListenAndServeTLS|Serve|ServeTLS)(...)
    - metavariable-pattern:
        metavariable: $PKG
        pattern: |
          "net/http"
  fix-regex:
    regex: (ListenAndServe|ListenAndServeTLS|Serve|ServeTLS)
    replacement: $1WithTimeouts
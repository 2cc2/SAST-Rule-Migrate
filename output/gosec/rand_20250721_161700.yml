rules:
  - id: weak-random-number-generator
    message: Use of weak random number generator (math/rand or math/rand/v2 instead of crypto/rand)
    languages:
      - go
    severity: WARNING
    patterns:
      - pattern: |
          import (
            "math/rand"
            ...
          )
          $X(..., rand.$FUNC(...), ...)
      - pattern: |
          import (
            "math/rand/v2"
            ...
          )
          $X(..., rand.$FUNC(...), ...)
    fix-regex:
      regex: 'rand\.(New|Read|Float32|Float64|Int|Int31|Int31n|Int63|Int63n|Intn|NormFloat64|Uint32|Uint64|Int32|Int32N|Int64|Int64N|IntN|N|Uint32N|Uint64N|UintN)'
      replacement: 'crypto/rand.\1'
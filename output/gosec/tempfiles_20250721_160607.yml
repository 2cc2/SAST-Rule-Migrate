rules:
  - id: bad-temp-file
    message: File creation in shared tmp directory without using ioutil.Tempfile
    languages:
      - go
    severity: WARNING
    patterns:
      - pattern: |
          io/ioutil.WriteFile($PATH, ...)
      - pattern: |
          os.Create($PATH)
      - pattern: |
          os.WriteFile($PATH, ...)
    fix: Use ioutil.TempFile instead
    metadata:
      category: security
      confidence: HIGH
      references:
        - https://securego.io/docs/rules/g307.html
      cwe:
        - "CWE-377: Insecure Temporary File"
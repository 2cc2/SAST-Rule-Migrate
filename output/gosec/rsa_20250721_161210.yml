# 修改策略：
# 1. 原错误是由于Go import路径模式匹配语法不正确造成的
# 2. Semgrep中匹配包路径应该使用规范的模式匹配语法
# 3. 保持检测弱RSA密钥(<2048位)的核心功能
# 4. 使用正确的Semgrep模式语法重写规则
# 5. 保持原有的严重性和置信度级别

# 转换后的 Semgrep 规则
rules:
  - id: weak-rsa-key-strength
    message: RSA keys should be at least 2048 bits
    languages: [go]
    severity: WARNING
    confidence: HIGH
    pattern: |
      import "crypto/rsa"
      ...
      rsa.GenerateKey($_, $ARG, $_)
      where:
        $ARG < 2048
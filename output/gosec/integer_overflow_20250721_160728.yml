rules:
- id: integer-overflow
  patterns:
    - pattern: |
        $V, _ := strconv.Atoi(...)
    - pattern: |
        int32($V)
    - pattern: |
        int16($V)
  message: Potential Integer overflow made by strconv.Atoi result conversion to int16/32
  languages: [go]
  severity: WARNING
  metadata:
    confidence: MEDIUM
# 转换后的 Semgrep 规则
rules:
- id: subprocess-launched-with-variable
  message: Subprocess launched with variable or potential tainted input
  languages: [go]
  severity: WARNING
  patterns:
    - pattern-inside: |
        import (
          "os/exec"
          "syscall"
          "golang.org/x/sys/execabs"
        )
    - pattern-either:
        - pattern: exec.Command($ARG, ...)
        - pattern: exec.CommandContext($_, $ARG, ...)
        - pattern: syscall.Exec($ARG, ...)
        - pattern: syscall.ForkExec($ARG, ...)
        - pattern: syscall.StartProcess($ARG, ...)
        - pattern: execabs.Command($ARG, ...)
        - pattern: execabs.CommandContext($_, $ARG, ...)
    - metavariable-regex:
        metavariable: $ARG
        regex: "(?!^(?:`[^`]*`|\"[^\"]*\"|'[^']*'|[0-9]+)$).*"
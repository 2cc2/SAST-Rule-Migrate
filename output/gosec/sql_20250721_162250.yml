# 转换后的 Semgrep 规则
rules:
- id: sql-string-concatenation
  pattern: |
    $X = $Y + $Z
    ...
    database/sql.DB.$METHOD($SQL)
  message: SQL string concatenation may lead to SQL injection
  severity: WARNING
  languages: [go]
  fix: Use parameterized queries instead of string concatenation

- id: sql-string-formatting
  pattern: |
    fmt.Sprintf($FMT, $ARGS...)
    ...
    database/sql.DB.$METHOD($SQL)
  message: SQL string formatting may lead to SQL injection
  severity: WARNING
  languages: [go]
  fix: Use parameterized queries instead of string formatting

- id: sql-fprintf-formatting
  pattern: |
    fmt.Fprintf($W, $FMT, $ARGS...)
    ...
    database/sql.DB.$METHOD($SQL)
  message: SQL string formatting may lead to SQL injection
  severity: WARNING
  languages: [go]
  fix: Use parameterized queries instead of string formatting
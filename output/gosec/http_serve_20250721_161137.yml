# 转换后的 Semgrep 规则
rules:
- id: http-serve-without-timeouts
  message: Use of net/http serve function that has no support for setting timeouts
  languages: [go]
  severity: WARNING
  patterns:
    - pattern: |
        net/http.$FUNC(...)
    - metavariable-pattern:
        metavariable: $FUNC
        patterns:
          - pattern: ListenAndServe
          - pattern: ListenAndServeTLS
          - pattern: Serve
          - pattern: ServeTLS
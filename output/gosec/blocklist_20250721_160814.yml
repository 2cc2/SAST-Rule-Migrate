# 修改策略：
# 1. YAML解析错误"mapping values are not allowed here"通常是由于不正确的缩进或冒号使用导致的
# 2. 需要检查所有键值对的格式，确保冒号后有空格
# 3. 确保所有层级的缩进一致，使用2个空格
# 4. 特别检查包含嵌套结构的规则部分
# 5. 保持原有规则功能不变，只修复格式错误

rules:
  - id: blocklisted-import-md5
    pattern: import "crypto/md5"
    message: "Blocklisted import crypto/md5: weak cryptographic primitive"
    severity: WARNING
    languages: [go]
  
  - id: blocklisted-import-des
    pattern: import "crypto/des"
    message: "Blocklisted import crypto/des: weak cryptographic primitive"
    severity: WARNING
    languages: [go]

  - id: blocklisted-import-rc4
    pattern: import "crypto/rc4"
    message: "Blocklisted import crypto/rc4: weak cryptographic primitive"
    severity: WARNING
    languages: [go]

  - id: blocklisted-import-cgi
    pattern: import "net/http/cgi"
    message: "Blocklisted import net/http/cgi: Go versions < 1.6.3 are vulnerable to Httpoxy attack: (CVE-2016-5386)"
    severity: WARNING
    languages: [go]

  - id: blocklisted-import-sha1
    pattern: import "crypto/sha1"
    message: "Blocklisted import crypto/sha1: weak cryptographic primitive"
    severity: WARNING
    languages: [go]

  - id: blocklisted-import-md4
    pattern: import "golang.org/x/crypto/md4"
    message: "Blocklisted import golang.org/x/crypto/md4: deprecated and weak cryptographic primitive"
    severity: WARNING
    languages: [go]

  - id: blocklisted-import-ripemd160
    pattern: import "golang.org/x/crypto/ripemd160"
    message: "Blocklisted import golang.org/x/crypto/ripemd160: deprecated and weak cryptographic primitive"
    severity: WARNING
    languages: [go]
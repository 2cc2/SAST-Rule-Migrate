rules:
  - id: insecure-file-permissions-write
    patterns:
      - pattern: |
          (io/ioutil.WriteFile($_, $_, $MODE) | os.WriteFile($_, $_, $MODE))
          where:
            $MODE == os.ModePerm || ($MODE > 0o600 || $MODE == os.ModePerm)
    message: Expect WriteFile permissions to be 0600 or less
    languages: [go]
    severity: WARNING

  - id: insecure-create-permissions
    pattern: os.Create($_)
    message: Expect file permissions to be 0666 or less but os.Create used with default permissions 0666
    languages: [go]
    severity: WARNING

  - id: insecure-open-chmod-permissions
    patterns:
      - pattern: |
          (os.OpenFile($_, $_, $MODE) | os.Chmod($_, $MODE))
          where:
            $MODE == os.ModePerm || ($MODE > 0o600 || $MODE == os.ModePerm)
    message: Expect file permissions to be 0600 or less
    languages: [go]
    severity: WARNING

  - id: insecure-mkdir-permissions
    patterns:
      - pattern: |
          (os.Mkdir($_, $MODE) | os.MkdirAll($_, $MODE))
          where:
            $MODE == os.ModePerm || ($MODE > 0o750 || $MODE == os.ModePerm)
    message: Expect directory permissions to be 0750 or less
    languages: [go]
    severity: WARNING
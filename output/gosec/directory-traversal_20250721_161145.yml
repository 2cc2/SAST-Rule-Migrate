rules:
- id: potential-directory-traversal
  patterns:
    - pattern: |
        $X.Dir($LIT)
    - metavariable-regex:
        metavariable: $X
        regex: http
    - metavariable-regex:
        metavariable: $LIT
        regex: "^[\"']/[\"']$"
  message: Potential directory traversal
  languages: [go]
  severity: WARNING
  confidence: MEDIUM
rules:
  - id: uses-weak-deprecated-cryptography-hash
    message: Use of deprecated weak cryptographic primitive
    languages: [go]
    severity: WARNING
    patterns:
      - pattern: |
          $PKG.New(...)
      - metavariable-regex:
          metavariable: $PKG
          regex: (golang\.org\/x\/crypto\/md4|golang\.org\/x\/crypto\/ripemd160)
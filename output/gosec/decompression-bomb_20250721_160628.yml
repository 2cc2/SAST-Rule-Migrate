rules:
  - id: decompression-bomb-check
    message: Potential DoS vulnerability via decompression bomb
    languages:
      - go
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: |
              $VAR, $_ := $PKG.$METHOD(...)
              io.Copy(..., $VAR)
          - pattern: |
              $VAR, $_ := $PKG.$METHOD(...)
              io.CopyBuffer(..., $VAR)
    metadata:
      category: security
      confidence: MEDIUM
      references:
        - https://github.com/securego/gosec/blob/master/rules/decompression_bomb.go
    paths:
      include:
        - "compress/gzip"
        - "compress/zlib"
        - "compress/bzip2"
        - "compress/flate"
        - "compress/lzw"
        - "archive/tar"
        - "archive/zip"
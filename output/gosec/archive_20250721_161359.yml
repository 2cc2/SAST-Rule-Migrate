# 转换后的 Semgrep 规则
rules:
  - id: file-traversal-when-extracting-archive
    message: File traversal when extracting zip/tar archive
    languages:
      - go
    severity: WARNING
    patterns:
      - pattern: |
          path/filepath.Join($X)
          OR
          path.Join($X)
      - pattern-either:
          - pattern: $X.Name
          - pattern: $X.FileInfo.Name()
          - pattern: $X.FileHeader.Name
    fix-regex:
      regex: (path/filepath.Join|path.Join)\((.*)\)
      replacement: \1(sanitize.\2)
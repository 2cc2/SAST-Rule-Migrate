rules:
- id: using-unsafe
  message: Use of unsafe calls should be audited
  languages:
  - go
  severity: WARNING
  patterns:
  - pattern: |
      import "unsafe"
      ...
      unsafe.$FUNC(...)
  - metavariable-regex:
      metavariable: $FUNC
      regex: (Pointer|String|StringData|Slice|SliceData)
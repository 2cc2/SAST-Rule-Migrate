# 转换后的 Semgrep 规则
rules:
- id: no-error-check
  patterns:
    -
      pattern: |
        $LHS := $FUNC(...)
        _
        _ = $LHS.$METHOD(...)
  message: Errors unhandled
  severity: WARNING
  languages: [go]
  metadata:
    confidence: HIGH
    category: correctness
    references:
      - https://securego.io/docs/rules/g104.html
rules:
  - id: uses-weak-cryptography-encryption
    message: Use of weak cryptographic primitive
    languages: [go]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: crypto/des.NewCipher(...)
          - pattern: crypto/des.NewTripleDESCipher(...)
          - pattern: crypto/rc4.NewCipher(...)
    fix: Use strong cryptographic primitives instead
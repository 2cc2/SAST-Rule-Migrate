rules:
- id: unused-local-variable
  message: Unused local variable detected
  patterns:
    - pattern: |
        $TYPE $VAR;
    - pattern-not: $VAR = ...;
    - pattern-not: ...($VAR)...;
    - metavariable-regex:
        metavariable: $VAR
        regex: ^(?![_$]unused).*$
  languages:
    - java
  severity: WARNING
  metadata:
    category: best-practices
    subcategory:
      - unused-code
    cwe:
      - 'CWE-563: Assignment to Variable without Use'
    confidence: MEDIUM
    likelihood: HIGH
    impact: LOW
    owasp:
      - A9:2021 Security Logging and Monitoring Failures
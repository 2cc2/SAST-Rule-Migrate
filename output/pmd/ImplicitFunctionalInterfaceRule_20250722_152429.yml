rules:
- id: implicit-functional-interface
  message: Interface with exactly one abstract method should be explicitly annotated with @FunctionalInterface
  pattern: |
    interface $CLASS {
      $RET $METHOD(...);
    }
  pattern-not: |
    @FunctionalInterface
    interface $CLASS {
      $RET $METHOD(...);
    }
  pattern-not-inside: |
    sealed interface $CLASS { ... }
  languages:
    - java
  severity: WARNING
  metadata:
    category: best-practices
    subcategory:
      - java
    cwe:
      - "CWE-1006: Bad Coding Practices"
    confidence: MEDIUM
    references:
      - https://www.baeldung.com/java-functional-interfaces
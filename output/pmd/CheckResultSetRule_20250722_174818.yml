rules:
- id: check-result-set
  patterns:
  - pattern: |
      $OBJ.$METHOD(...)
  - metavariable-regex:
      metavariable: $METHOD
      regex: (next|previous|last|first)
  - pattern-inside: |
      import java.sql.ResultSet;
      ...
  message: ResultSet method '$METHOD' return value must be verified
  languages:
  - java
  severity: WARNING
  metadata:
    category: best-practices
    subcategory:
    - error-handling
    cwe:
    - 'CWE-252: Unchecked Return Value'
    confidence: HIGH
    likelihood: MEDIUM
    impact: MEDIUM
    references:
    - https://cwe.mitre.org/data/definitions/252.html
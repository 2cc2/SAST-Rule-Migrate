# 转换后的 Semgrep 规则
rules:
- id: assignment-in-operand
  patterns:
    - pattern-either:
      - pattern: |
          if ($EXP = $VAL) { ... }
      - pattern: |
          while ($EXP = $VAL) { ... }
      - pattern: |
          for (...; $EXP = $VAL; ...) { ... }
      - pattern: |
          if ($EXP++ || $EXP--) { ... }
      - pattern: |
          while ($EXP++ || $EXP--) { ... }
      - pattern: |
          for (...; $EXP++ || $EXP--; ...) { ... }
  message: Avoid assignment or increment/decrement operators inside operand expressions (if/while/for conditions).
  languages:
    - java
  severity: WARNING
  metadata:
    category: error-prone
    subcategory:
      - correctness
    cwe:
      - "CWE-481: Assigning instead of Comparing"
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    technology:
      - java
    references:
      - https://cwe.mitre.org/data/definitions/481.html
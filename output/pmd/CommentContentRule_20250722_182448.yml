rules:
- id: forbidden-comment-content
  message: Line matches forbidden content regex (%s)
  patterns:
  - pattern-inside: |
      $COMMENT
  - pattern-regex: "(idiot|jerk)"
  fix: |
    // [REMOVED COMMENT CONTAINING FORBIDDEN TERM]
  languages:
  - java
  severity: WARNING
  metadata:
    category: documentation
    subcategory:
    - style
    cwe:
    - 'CWE-1005: Sensitive Comments in Production Code'
    confidence: HIGH
    likelihood: LOW
    impact: LOW
    technology:
    - Java
    references:
    - https://cwe.mitre.org/data/definitions/1005.html
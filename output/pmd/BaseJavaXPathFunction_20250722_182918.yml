rules:
- id: base-java-xpath-function
  patterns:
  - pattern: |
      class $CLASS extends XPathFunctionDefinition {
        protected $CLASS(String $VAR) {
          super($VAR, JavaLanguageModule.getInstance());
        }
      }
  message: BaseJavaXPathFunction implementation detected
  languages:
  - java
  severity: INFO
  metadata:
    category: code-style
    technology:
    - Java
rules:
- id: password-in-comment
  patterns:
    - pattern: |
        $TYPE $NAME;
    - pattern-inside: |
        $TYPE $NAME = ...;
    - pattern-regex: |
        //.*password.*
    - metavariable-regex:
        metavariable: $NAME
        regex: '(?i).*password.*'
  message: Found potential password in variable comment
  languages:
    - java
  severity: WARNING
  metadata:
    category: security
    subcategory:
      - vuln
    cwe:
      - 'CWE-200: Exposure of Sensitive Information to an Unauthorized Actor'
    confidence: MEDIUM
    likelihood: LOW
    impact: MEDIUM
    owasp:
      - A3:2021-Sensitive Data Exposure
    technology:
      - Java
    references:
      - https://cwe.mitre.org/data/definitions/200.html
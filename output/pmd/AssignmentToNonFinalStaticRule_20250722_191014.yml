rules:
- id: assignment_to_non_final_static
  patterns:
  - pattern-inside: |
      class $CLASS {
        static $TYPE $FIELD;
        ...
        $CONSTRUCTOR(...) { ... }
      }
  - pattern: $CLASS.$FIELD = ...;
  - pattern-inside: $CONSTRUCTOR(...) { ... }
  message: Assignment to non-final static field detected in constructor. This can lead to unsafe mutable static state.
  languages:
  - java
  severity: WARNING
  metadata:
    category: security
    subcategory:
    - error-prone
    cwe:
    - 'CWE-500: Public Static Field Not Marked Final'
    confidence: MEDIUM
    owasp:
    - A6:2017 - Security Misconfiguration
    technology:
    - Java
    references:
    - https://cwe.mitre.org/data/definitions/500.html
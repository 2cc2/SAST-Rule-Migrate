rules:
- id: junit-use-expected
  patterns:
  - pattern-inside: |
      @Test
      public void $METHOD(...) {
        ...
      }
  - pattern: |
      try {
        ...
        $FAIL_STMT;
      } catch ($EXCEPTION $VAR) { }
  - metavariable-regex:
      metavariable: $FAIL_STMT
      regex: (fail\(.*\)|throw\s+.*;)
  - pattern-not: |
      @Test(expected = $TYPE.class)
      public void $M(...) { ... }
  message: |
    In JUnit 4, use @Test(expected=Exception.class) instead of try-catch-fail pattern
    to test expected exceptions. This makes the test more readable and concise.
  languages:
  - java
  severity: WARNING
  metadata:
    category: best-practices
    subcategory: testing
    cwe:
    - 'CWE-398: Indicator of Poor Code Quality'
    references:
    - https://github.com/pmd/pmd/blob/master/pmd-java/src/main/java/net/sourceforge/pmd/lang/java/rule/bestpractices/JUnitUseExpectedRule.java
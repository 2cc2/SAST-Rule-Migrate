# 转换后的 Semgrep 规则
rules:
- id: clone-method-must-implement-cloneable
  patterns:
  - pattern-inside: |
      class $CLASS {
        ...
      }
  - pattern: |
      @Override public Object clone() { ... }
  - pattern-not-inside: |
      class $CLASS implements Cloneable {
        ...
        Object clone() { ... }
        ...
      }
  - pattern-not: |
      final Object clone() { throw new CloneNotSupportedException(); }
  message: |
      The clone() method should only be implemented if the class implements the
      Cloneable interface, with the exception of a final method that only throws
      CloneNotSupportedException.
  languages:
  - java
  severity: WARNING
  metadata:
    category: security
    subcategory:
    - error-prone
    cwe:
    - 'CWE-580: clone() Method Without super.clone()'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    technology:
    - Java
    references:
    - https://cwe.mitre.org/data/definitions/580.html
rules:
- id: single-method-singleton
  patterns:
  - pattern: |
      class $CLASS {
        ...
        public static $CLASS getInstance(...) { ... }
        public static $CLASS getInstance(...) { ... }
        ...
      }
  message: Multiple getInstance() methods found in singleton class. A singleton should only have one getInstance() method.
  languages:
  - java
  severity: WARNING
  metadata:
    category: error-prone
    subcategory:
    - design
    cwe:
    - 'CWE-582: Array Declared Public, Final, and Static'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    technology:
    - Java
    references:
    - https://pmd.github.io/latest/pmd_rules_java_errorprone.html#singlemethodsingleton
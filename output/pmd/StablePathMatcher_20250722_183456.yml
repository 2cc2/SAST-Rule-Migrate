rules:
- id: stable-path-matcher
  patterns:
  - pattern-either:
    - pattern: |
        $E instanceof ASTFieldAccess
        && !((ASTFieldAccess)$E).getName().equals($NAME)
    - pattern: |
        $E instanceof ASTMethodCall
        && (!((ASTMethodCall)$E).getMethodName().equals($NAME) || ((ASTMethodCall)$E).getArguments().size() != 0)
  - metavariable-regex:
      metavariable: $NAME
      regex: "[a-zA-Z_][a-zA-Z0-9_]*"
  message: Detected unstable path reference that may cause side effects
  languages:
  - java
  severity: WARNING
  metadata:
    category: correctness
    subcategory:
    - reliability
    cwe:
    - CWE-483: Incorrect Block Delimitation
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
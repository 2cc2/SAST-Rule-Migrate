rules:
- id: node-is-function
  patterns:
  - pattern: |
      Class.forName("net.sourceforge.pmd.lang.java.ast.AST$VAR")
  message: Found potentially unsafe Class.forName usage with dynamic AST node detection
  languages:
  - java
  severity: WARNING
  metadata:
    category: security
    subcategory:
    - vuln
    cwe:
    - 'CWE-470: Use of Externally-Controlled Input to Select Classes or Code'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    technology:
    - Java
    references:
    - https://cwe.mitre.org/data/definitions/470.html
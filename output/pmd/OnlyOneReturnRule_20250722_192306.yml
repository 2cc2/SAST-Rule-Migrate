rules:
- id: only-one-return
  patterns:
  - pattern-inside: |
      $RETTYPE $METHOD(...) {
        ...
      }
  - pattern-either:
    - pattern: |
        $RETURN1: return $X;
        ...
        $RETURN2: return $Y;
    - pattern: |
        $RETURN1: return;
        ...
        $RETURN2: return;
    - pattern: |
        $RETURN1: return $X;
        ...
        $RETURN2: return;
    - pattern: |
        $RETURN1: return;
        ...
        $RETURN2: return $Y;
  message: Method contains more than one return statement
  languages:
  - java
  severity: WARNING
  metadata:
    category: codestyle
    cwe:
    - 'CWE-670: Always-Incorrect Control Flow Implementation'
    technology:
    - Java
  tests:
  - code: |
      class Test {
        int badMethod(int x) {
          if (x > 0) {
            return 1;
          }
          return 0;
        }
      }
    expect:
    - message: Method contains more than one return statement
  - code: |
      class Test {
        void goodMethod() {
          if (condition) {
            return;
          }
        }
      }
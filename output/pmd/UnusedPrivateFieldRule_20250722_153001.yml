# 转换后的 Semgrep 规则
rules:
- id: unused-private-field
  patterns:
    - pattern: |
        class $CLASS {
            ...
            private $TYPE $FIELD;
            ...
        }
    - pattern-not: |
        class $CLASS {
            ...
            private $TYPE $FIELD = $EXPR;
            ...
        }
    - pattern-not: |
        class $CLASS {
            ...
            private $TYPE $FIELD;
            static { $STATIC_BODY }
            ...
        }
    - pattern-not: |
        class $CLASS {
            ...
            private $TYPE $FIELD;
            { $INSTANCE_BODY }
            ...
        }
    - pattern-not: |
        class $CLASS {
            ...
            private $TYPE $FIELD;
            $RET $METHOD(...) { $METHOD_BODY }
            ...
        }
    - pattern-not: |
        @$ANN
        private $TYPE $FIELD;
  metavariable-regex:
    metavariable: $FIELD
    not-regex: '(serialVersionUID|serialPersistentFields)'
  message: The private field '$FIELD' is never used and can be removed
  languages: [java]
  severity: WARNING
  metadata:
    category: best-practices
    subcategory: unused-code
    cwe: "CWE-563: Assignment to Variable without Use ('Unused Variable')"
    confidence: MEDIUM
    likelihood: HIGH
    impact: LOW
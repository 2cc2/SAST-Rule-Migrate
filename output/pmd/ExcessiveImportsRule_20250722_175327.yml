rules:
- id: excessive-imports
  message: Excessive imports detected (more than 30). Consider reducing the number of imports.
  pattern: |
    import $PACKAGE.*;
  severity: WARNING
  languages:
  - java
  metadata:
    category: design
    subcategory:
    - performance
    cwe:
    - 'CWE-1071: Excessive Code Comments'
    confidence: MEDIUM
    likelihood: LOW
    impact: LOW
    technology:
    - Java
    references:
    - https://pmd.github.io/pmd-6.55.0/pmd_rules_java_design.html#excessiveimports
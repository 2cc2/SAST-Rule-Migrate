rules:
- id: abstract-java-rule
  patterns:
  - pattern: |
      public abstract class AbstractJavaRule extends AbstractRule implements JavaVisitor {
        @Override
        public Object visitNode(Node node, Object param) {
          node.children().forEach(n -> n.acceptVisitor(this, param));
          return param;
        }
        @Override
        public void apply(Node target, RuleContext ctx) {
          target.acceptVisitor(this, ctx);
        }
      }
  message: Found abstract Java rule extension. This is a base class for Java rules implementation.
  languages:
  - java
  severity: INFO
  metadata:
    category: style
    subcategory:
    - architecture
    technology:
    - Java
    references:
    - http://pmd.sourceforge.net/
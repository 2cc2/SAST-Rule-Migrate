rules:
- id: implicit-switch-fall-through
  message: Implicit switch fall through detected. Add a comment or explicit break/return to avoid unintended fall through.
  pattern: |
    switch ($X) {
      case $CASE:
        ... ;
      default:
        ... ;
    }
  pattern-not: |
    switch ($X) {
      case $CASE:
        ... ;
        // fall through
      default:
        ... ;
    }
  languages:
  - java
  severity: WARNING
  metadata:
    category: error_prone
    subcategory:
    - control-flow
    cwe:
    - 'CWE-484: Omitted Break Statement in Switch'
    confidence: MEDIUM
    references:
    - https://cwe.mitre.org/data/definitions/484.html
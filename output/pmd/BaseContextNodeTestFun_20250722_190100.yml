rules:
- id: type-check-function
  patterns:
  - pattern: |
      $T.$F($STR)
  - metavariable-regex:
      metavariable: $F
      regex: (typeIs|typeIsExactly|hasAnnotation)
  message: >-
    Found potentially unsafe type check function call. Be cautious about type
    checking that may infer incorrect type relationships.
  languages:
  - java
  severity: WARNING
  metadata:
    category: security
    subcategory:
    - type-safety
    cwe:
    - 'CWE-483: Incorrect Block Delimitation'
    confidence: MEDIUM
    likelihood: LOW
    impact: MEDIUM
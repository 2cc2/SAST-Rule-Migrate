rules:
- id: type-resolution-test
  patterns:
  - pattern: |
      try {
        $TYPE $T = ...;
        $T.getTypeSystem();
        if ($T == $TS.ERROR || $T == $TS.UNKNOWN) {
          ...
        } else {
          ...
        }
      } catch (Throwable $E) {
        ...
      }
  message: Detects unresolved types in code which may indicate potential type resolution issues
  languages:
  - java
  severity: WARNING
  metadata:
    category: reliability
    subcategory:
    - type-checking
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: LOW
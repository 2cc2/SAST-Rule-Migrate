rules:
- id: cyclomatic-complexity
  patterns:
  - pattern: |
      class $CLASS {
        ...
        $TYPE $METHOD(...) { ... }
        ...
      }
  - metavariable-comparison:
      metavariable: $METHOD
      comparison: $METHOD.getCyclomaticComplexity() > 10
  message: >-
    The method '$METHOD' has a cyclomatic complexity of $COMPLEXITY which exceeds the threshold of 10.
    Consider refactoring to reduce complexity and improve maintainability.
  languages:
  - java
  severity: WARNING
  metadata:
    category: maintainability
    subcategory:
    - complexity
    cwe:
    - 'CWE-1041: Use of Insufficiently Random Values'
    confidence: MEDIUM
    likelihood: LOW
    impact: MEDIUM
    owasp:
    - A3:2017 Sensitive Data Exposure
    technology:
    - Java
    references:
    - https://cwe.mitre.org/data/definitions/1041.html
rules:
- id: method-returns-internal-array
  languages:
    - java
  message: Method returns internal array which may expose internal state to unauthorized modification
  patterns:
    - pattern: |
        $RETURN_TYPE $METHOD(...) {
            ... return $EXPR;
        ...}
    - metavariable-regex:
        metavariable: $RETURN_TYPE
        regex: '\[\]'
    - pattern-not: private void $METHOD(...) {...}
    - pattern-either:
      - pattern: |
          $EXPR.$FIELD
      - pattern: |
          $CLASS.$FIELD
    - pattern-inside: |
        class $CLASS {
            $TYPE $FIELD;
        ...}
  severity: WARNING
  metadata:
    category: security
    subcategory:
      - exposure
    cwe:
      - 'CWE-495: Private Data Structure Returned From A Public Method'
    confidence: MEDIUM
    likelihood: HIGH
    impact: MEDIUM
    owasp:
      - A01:2021 - Broken Access Control
    technology:
      - Java
    references:
      - https://cwe.mitre.org/data/definitions/495.html
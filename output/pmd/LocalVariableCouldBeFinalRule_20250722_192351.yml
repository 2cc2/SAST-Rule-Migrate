rules:
- id: local-variable-could-be-final
  message: Local variable could be declared final as it's effectively final
  patterns:
    - pattern: $TYPE $VARIABLE = $INIT;
    - pattern-not: final $TYPE $VARIABLE = $INIT;
    - pattern-inside: |
        {
          ...
          $TYPE $VARIABLE = $INIT;
          ...
        }
    - metavariable-regex:
        metavariable: $VARIABLE
        regex: ^[a-z][a-zA-Z0-9]*$
      debug: false
  fix: final $TYPE $VARIABLE = $INIT;
  severity: WARNING
  languages:
    - java
  metadata:
    category: codestyle
    subcategory:
      - java-best-practices
    cwe:
      - 'CWE-563: Assignment to Variable without Use'
    technology:
      - java
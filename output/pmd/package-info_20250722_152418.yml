# 转换后的 Semgrep 规则
rules:
- id: pmd-java-package-declaration
  patterns:
  - pattern: |
      package net.sourceforge.pmd.lang.java.rule;
  message: Found PMD Java built-in rules package declaration
  languages:
  - java
  severity: INFO
  metadata:
    category: style
    subcategory:
    - packaging
    confidence: HIGH
    likelihood: LOW
    impact: LOW
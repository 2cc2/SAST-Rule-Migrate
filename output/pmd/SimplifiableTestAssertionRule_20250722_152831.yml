rules:
- id: simplifiable-test-assertion
  patterns:
    - pattern-inside: |
        $METHOD_CALL(...)
    - focus-metavariable: $METHOD_CALL
    - pattern-either:
      - pattern: |
          $TEST.assertFalse($EXPR)
      - pattern: |
          $TEST.assertTrue($EXPR)
      - pattern: |
          $TEST.assertEquals($EXP1, $EXP2)
      - pattern: |
          $TEST.assertNotEquals($EXP1, $EXP2)
    - metavariable-regex:
        metavariable: $TEST
        regex: org.junit.Assert|junit.framework.Assert
  message: |
    This test assertion can be simplified to a more specific assertion method.
  languages:
    - java
  severity: WARNING
  metadata:
    category: best-practices
    subcategory:
      - test-quality
    cwe:
      - 'CWE-398: Indicator of Poor Code Quality'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: LOW
    owasp:
      - A3:2017-Sensitive Data Exposure
    technology:
      - JUnit
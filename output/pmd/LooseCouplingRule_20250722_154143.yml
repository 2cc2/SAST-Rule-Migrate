# 转换后的 Semgrep 规则
rules:
- id: loose-coupling
  patterns:
  - pattern-either:
    - pattern: new $TYPE()
    - pattern: new $TYPE<$T>(...)
  - metavariable-regex:
      metavariable: $TYPE
      regex: (ArrayList|HashMap|HashSet|LinkedHashMap|LinkedHashSet|TreeMap|TreeSet|Vector|Hashtable)
  - pattern-not: java.util.Properties.getInstance()
  - pattern-not-inside: |
      @Override
      public void $METHOD(...) { ... }
  - pattern-not: ($TYPE) $EXPR
  - pattern-not: $EXPR instanceof $TYPE
  - pattern-not: $TYPE.class
  - pattern-not: extends $TYPE
  message: Avoid using concrete collection types (found $TYPE). Consider using interfaces (List, Map, Set) instead for better loose coupling.
  languages:
  - java
  severity: WARNING
  metadata:
    category: best-practices
    subcategory: loose-coupling
    cwe:
    - "CWE-1006: Bad Coding Practices"
    technology:
    - Java
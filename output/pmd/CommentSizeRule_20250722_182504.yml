rules:
- id: comment-size
  patterns:
  - pattern-either:
    - pattern: |
        $COMMENT
        // $...LINE
        
        // $...LINE
        
        // $...LINE
        
        // $...LINE
        
        // $...LINE
        
        // $...LINE
        
        // $...LINE
    - pattern: |
        /* $...LINE
          $...LINE
          $...LINE
          $...LINE
          $...LINE
          $...LINE
          $...LINE */
    - pattern: |
        /**
         * $...LINE
         * $...LINE
         * $...LINE
         * $...LINE
         * $...LINE
         * $...LINE
         * $...LINE
         */
  - metavariable-regex:
      metavariable: $LINE
      regex: '.{80,}'
  message: Comment too long or contains lines too lengthy
  languages:
  - java
  severity: WARNING
  metadata:
    category: documentation
    subcategory:
    - style
    cwe:
    - 'CWE-1115: Source Code Element without Standard Documentation'
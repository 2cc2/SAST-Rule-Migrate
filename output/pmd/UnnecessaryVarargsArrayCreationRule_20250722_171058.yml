rules:
- id: unnecessary-varargs-array-creation
  message: Unnecessary varargs array creation can be simplified by passing elements directly
  patterns:
    - pattern: |
        new $TYPE[] { $...ELTS }
    - pattern-inside: |
        $METHOD(..., new $TYPE[] { $...ELTS }, ...)
    - metavariable-regex:
        metavariable: $METHOD
        regex: ".+"
  fix: |
    $METHOD(..., $...ELTS)
  languages:
    - java
  severity: WARNING
  metadata:
    category: best-practices
    cwe: "CWE-398: Indicator of Poor Code Quality"
    references:
      - https://pmd.github.io/pmd-6.55.0/pmd_rules_java_bestpractices.html#unnecessaryvarargsarraycreation
    technology:
      - java
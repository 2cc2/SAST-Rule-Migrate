# 转换后的 Semgrep 规则
rules:
- id: accessor-method-generation
  patterns:
  - pattern-either:
    - pattern: $FIELD
    - pattern: $METHOD(...)
  - pattern-not-inside: |
      class $C {
        private $TYPE $FIELD;
        private $RET $METHOD(...) { ... }
      }
  - pattern-not: $THIS.$FIELD
  - pattern-not: $THIS.$METHOD(...)
  - metavariable-regex:
      metavariable: $FIELD
      regex: "^[a-z].*"
  message: Private member accessed from outside its enclosing class may break encapsulation
  languages: [java]
  severity: WARNING
  metadata:
    category: best-practices
    subcategory: encapsulation
    cwe:
    - "CWE-493: Critical Public Variable Without Final Modifier"
    owasp:
    - "A6:2017 - Security Misconfiguration"
    references:
    - https://cwe.mitre.org/data/definitions/493.html
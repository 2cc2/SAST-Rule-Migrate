rules:
- id: unnecessary_case_change
  patterns:
  - pattern: |
      $OBJ.$EQUALITY_METHOD($ARG)
  - metavariable-regex:
      metavariable: $EQUALITY_METHOD
      regex: (equals|equalsIgnoreCase)
  - pattern-not: |
      $OBJ.$EQUALITY_METHOD(..., $LOCALE)
  - pattern-either:
    - pattern: |
        $OBJ.$CASE_CHANGE_METHOD()
    - pattern: |
        $ARG.$CASE_CHANGE_METHOD()
  - metavariable-regex:
      metavariable: $CASE_CHANGE_METHOD
      regex: (toLowerCase|toUpperCase)
  message: Unnecessary case change in string comparison detected. Using case-changing methods (toLowerCase/toUpperCase) directly in equality checks can be inefficient or locale-sensitive. Consider using equalsIgnoreCase instead.
  languages:
  - java
  severity: WARNING
  metadata:
    category: style
    subcategory:
    - efficiency
    cwe:
    - 'CWE-178: Improper Handling of Case Sensitivity'
    confidence: MEDIUM
    likelihood: LOW
    impact: LOW
    owasp:
    - A3:2017-Sensitive Data Exposure
    technology:
    - Java
    references:
    - https://cwe.mitre.org/data/definitions/178.html
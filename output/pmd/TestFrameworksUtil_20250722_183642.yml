rules:
- id: junit-test-method-detection
  patterns:
  - pattern: |
      @$ANNOTATION
      public void $METHOD(...) { ... }
  - metavariable-regex:
      metavariable: $ANNOTATION
      regex: "(org\\.junit\\.Test|org\\.testng\\.annotations\\.Test|org\\.junit\\.jupiter\\.api\\.Test|org\\.junit\\.jupiter\\.api\\.RepeatedTest|org\\.junit\\.jupiter\\.api\\.TestFactory|org\\.junit\\.jupiter\\.api\\.TestTemplate|org\\.junit\\.jupiter\\.params\\.ParameterizedTest)"
  message: Test method detected with JUnit/TestNG annotation
  languages: [java]
  severity: INFO

- id: junit3-test-case-detection
  patterns:
  - pattern: |
      public class $CLASS extends junit.framework.TestCase {
        public void test$NAME(...) { ... }
      }
  message: JUnit 3 test case detected
  languages: [java]
  severity: INFO

- id: test-configuration-method-detection
  patterns:
  - pattern: |
      @$ANNOTATION
      public void $METHOD(...) { ... }
  - metavariable-regex:
      metavariable: $ANNOTATION
      regex: "(org\\.junit\\.Before|org\\.junit\\.BeforeClass|org\\.junit\\.After|org\\.junit\\.AfterClass|org\\.testng\\.annotations\\.AfterClass|org\\.testng\\.annotations\\.AfterGroups|org\\.testng\\.annotations\\.AfterMethod|org\\.testng\\.annotations\\.AfterSuite|org\\.testng\\.annotations\\.AfterTest|org\\.testng\\.annotations\\.BeforeClass|org\\.testng\\.annotations\\.BeforeGroups|org\\.testng\\.annotations\\.BeforeMethod|org\\.testng\\.annotations\\.BeforeSuite|org\\.testng\\.annotations\\.BeforeTest)"
  message: Test configuration method detected
  languages: [java]
  severity: INFO

- id: assertion-method-detection
  patterns:
  - pattern: |
      $OBJECT.$METHOD(...)
  - metavariable-regex:
      metavariable: $OBJECT
      regex: "(org\\.junit\\.Assert|org\\.junit\\.jupiter\\.api\\.Assertions|org\\.hamcrest\\.MatcherAssert|org\\.testng\\.Assert|junit\\.framework\\.Assert|junit\\.framework\\.TestCase)"
  - metavariable-regex:
      metavariable: $METHOD
      regex: "(assert.*|check.*|verify.*|fail|failWith)"
  message: Assertion method detected
  languages: [java]
  severity: INFO
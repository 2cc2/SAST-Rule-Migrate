rules:
- id: redundant-field-initializer
  patterns:
    - pattern: |
        class $CLASS {
          $TYPE $FIELD = $INIT;
          ...
        }
    - metavariable-comparison:
        metavariable: $INIT
        comparison: $INIT == $DEFAULT
    - pattern-not: |
        class $CLASS {
          final $TYPE $FIELD = $INIT;
          ...
        }
    - pattern-not-inside: |
        @lombok.Value
        class $CLASS {
          ...
        }
  message: Redundant field initializer for $FIELD (JVM would assign default value automatically)
  languages:
    - java
  severity: WARNING
  metadata:
    category: performance
    subcategory:
      - redundant
    cwe:
      - 'CWE-1164: Irrelevant Code'
    confidence: HIGH
    likelihood: LOW
    impact: LOW
    owasp:
      - A5:2021 Security Misconfiguration
    technology:
      - Java
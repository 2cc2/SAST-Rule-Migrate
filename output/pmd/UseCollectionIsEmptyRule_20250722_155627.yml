rules:
- id: use-collection-isempty
  message: Replace 'size() == 0' or 'size() != 0' with 'isEmpty()' or '!isEmpty()' for better readability and performance
  patterns:
  - pattern-either:
    - pattern: $COLLECTION.size() == 0
    - pattern: $COLLECTION.size() != 0
  - pattern-not: $COLLECTION.isEmpty()
  fixes:
  - regex: '(.*?)\.size\(\)\s*==\s*0'
    replacement: '\1.isEmpty()'
  - regex: '(.*?)\.size\(\)\s*!=\s*0'
    replacement: '!\1.isEmpty()'
  languages:
  - java
  severity: WARNING
  metadata:
    category: best-practices
    cwe: "CWE-597: Use of Wrong Operator in String Comparison"
    owasp: "A10:2021 - Server Side Request Forgery"
    references:
    - https://rules.sonarsource.com/java/RSPEC-1155
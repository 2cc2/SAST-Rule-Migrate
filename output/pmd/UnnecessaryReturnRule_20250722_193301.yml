# 转换后的 Semgrep 规则
rules:
- id: unnecessary-return
  message: Unnecessary return statement found
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: |
      return;
  - pattern-not-inside: |
      $F(...) { ... }
  - pattern-not-inside: |
      new $F(...) { ... }
  - pattern-not-inside: |
      { ... }
  - pattern-not-inside: |
      if (...) { ... }
  - pattern-not-inside: |
      try { ... } catch (...) { ... }
  - pattern-not-inside: |
      switch (...) { case $X: ... default: ... }
  - pattern-not-inside: |
      while (...) { ... }
  - pattern-not-inside: |
      do { ... } while (...);
  - pattern-not-inside: |
      for (...) { ... }
  metadata:
    category: style
    subcategory:
    - complexity
    cwe:
    - 'CWE-1110: Incomplete I/O Documentation'
    confidence: MEDIUM
    likelihood: LOW
    impact: LOW
    owasp:
    - A3:2017-Sensitive Data Exposure
    technology:
    - Java
    references:
    - https://pmd.github.io/latest/pmd_rules_java_codestyle.html#unnecessaryreturn
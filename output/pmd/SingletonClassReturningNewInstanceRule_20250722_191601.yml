rules:
- id: singleton-class-returning-new-instance
  patterns:
    - pattern: |
        class $CLASS {
            ...
            $RETURNTYPE getInstance() {
                ... return new $TYPE(...);
                ... return $LOCALVAR;
            }
        }
    - pattern-not: |
        class $CLASS {
            ...
            $RETURNTYPE getInstance() {
                ... return $FIELD;
                ... return $STATIC;
            }
        }
    - metavariable-regex:
        metavariable: $RETURNTYPE
        regex: "(?i)void"
        negation: true
  message: Singleton class method getInstance() returns new instances or local variables which violates the singleton pattern
  languages:
    - java
  severity: WARNING
  metadata:
    category: correctness
    subcategory:
      - design
    cwe:
      - "CWE-582: Array Declared Public, Final, and Static"
      - "CWE-607: Public Static Final Field References Mutable Object"
    confidence: MEDIUM
    technology:
      - java
rules:
- id: avoid-throwing-null-pointer-exception
  message: >-
    Avoid throwing NullPointerException instances directly or through variables.
    Consider using more specific exceptions or null checks instead.
  languages:
  - java
  severity: WARNING
  patterns:
    - pattern: |
        throw new NullPointerException(...);
    - pattern: |
        $VAR.getReferencedSym();
        ...
        throw $VAR;
  fix: Consider throwing more specific exceptions or performing null checks
  metadata:
    category: best-practice
    subcategory: error-handling
    cwe:
    - 'CWE-395: Use of NullPointerException Catch to Detect NULL Pointer Dereference'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    owasp:
    - A10:2021 - Server-Side Request Forgery
    technology:
    - Java
    references:
    - https://wiki.sei.cmu.edu/confluence/display/java/ERR08-J.+Do+not+catch+NullPointerException+or+any+of+its+ancestors
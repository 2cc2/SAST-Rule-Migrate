# 转换后的 Semgrep 规则
rules:
- id: insecure-crypto-iv
  message: Found hardcoded static Initialization Vector used with cryptographic operations. IvParameterSpec must not be created from static sources.
  patterns:
  - pattern-inside: |
      new javax.crypto.spec.IvParameterSpec($V)
  - pattern-either:
    - pattern: |
        new byte[] { ... }
    - pattern: | 
        "...".getBytes()
    - pattern: |
        $X.getBytes()
  languages:
  - java
  severity: WARNING
  metadata:
    category: security
    cwe:
    - "CWE-329: Not Using a Random IV with CBC Mode"
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    owasp:
    - "A3:2017-Sensitive Data Exposure"
    references:
    - https://cwe.mitre.org/data/definitions/329.html
rules:
- id: non-serializable-class
  patterns:
  - pattern: |
      class $CLASS {
        ...
        $TYPE $FIELD;
        ...
      }
  - metavariable-regex:
      metavariable: $TYPE
      regex: (?!.*(Serializable|Externalizable)).*
  - pattern-not: |
      class $CLASS implements Serializable {
        ...
      }
  - pattern-not: |
      class $CLASS implements Externalizable {
        ...
      }
  - pattern-not-inside: |
      class $CLASS {
        ...
        private static final ObjectStreamField[] serialPersistentFields = {...};
        ...
      }
  - pattern-not: |
      class $CLASS {
        ...
        private void writeObject(ObjectOutputStream $OUT) {...}
        private void readObject(ObjectInputStream $IN) {...}
        ...
      }
  - pattern-not: |
      class $CLASS {
        ...
        private Object writeReplace() {...}
        private Object readResolve() {...}
        ...
      }
  message: |
    Class contains non-serializable fields while implementing Serializable interface.
    Either make the fields transient, implement custom serialization methods, or remove Serializable implementation.
  languages: [java]
  severity: WARNING
  metadata:
    category: security
    subcategory: correctness
    cwe: ["CWE-594: J2EE Framework: Saving Unserializable Objects to Disk"]
    owasp: ["A10:2021 - Server-Side Request Forgery"]
    references:
    - https://docs.oracle.com/javase/8/docs/api/java/io/Serializable.html
    - https://cwe.mitre.org/data/definitions/594.html
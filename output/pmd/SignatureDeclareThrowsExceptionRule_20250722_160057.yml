rules:
- id: signature-declare-throws-exception
  patterns:
  - pattern: |
      $RETURN $NAME (...) throws Exception { ... }
  - pattern-not-inside: |
      @Test
      $RETURN $NAME (...) throws Exception { ... }
  - pattern-not-inside: |
      @Before
      @After
      @BeforeClass
      @AfterClass
      $RETURN $NAME (...) throws Exception { ... }
  - pattern-not-inside: |
      class $TESTCLASS extends TestCase {
        ...
        $RETURN $NAME (...) throws Exception { ... }
        ...
      }
  message: >
    Method/constructor shouldn't explicitly throw java.lang.Exception, since it
    is unclear which exceptions can be thrown. Use either a class derived from
    RuntimeException or a checked exception instead.
  languages:
  - java
  severity: WARNING
  metadata:
    category: design
    subcategory: maintainability
    cwe:
    - 'CWE-397: Declaration of Throws for Generic Exception'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
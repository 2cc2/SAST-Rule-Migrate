rules:
- id: junit-spelling
  patterns:
  - pattern: |
      class $CLASS {
        ...
        void $METHOD() { ... }
        ...
      }
  - metavariable-regex:
      metavariable: $METHOD
      regex: (?i)setup|teardown
  - pattern-not: void setUp() { ... }
  - pattern-not: void tearDown() { ... }
  message: |
    Incorrect JUnit method spelling. Use 'setUp' or 'tearDown' instead of 'setup' or 'teardown'.
  languages:
  - java
  severity: WARNING
  metadata:
    category: best-practice
    subcategory:
    - error-prone
    cwe: "CWE-1004: Sensitive Cookie Without HttpOnly Flag"
    owasp: "A03:2021 - Injection"
    technology:
    - JUnit
    references:
    - https://junit.org/junit4/javadoc/latest/org/junit/Before.html
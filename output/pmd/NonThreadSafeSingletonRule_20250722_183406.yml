rules:
- id: non-thread-safe-singleton
  patterns:
  - pattern-inside: |
      class $CLASS {
        ...
        $TYPE $FIELD;
        ...
      }
  - pattern-not-inside: |
      class $CLASS {
        ...
        static $TYPE $FIELD;
        ...
      }
  - pattern: |
      if ($FIELD == null) {
        $FIELD = new $TYPE(...);
      }
  - pattern-not: |
      synchronized (...) {
        if ($FIELD == null) {
          $FIELD = new $TYPE(...);
        }
      }
  message: Non-thread-safe singleton initialization detected. Consider using synchronized block or static initializer.
  languages:
  - java
  severity: WARNING
  metadata:
    category: security
    subcategory:
    - threading
    cwe:
    - 'CWE-362: Concurrent Execution using Shared Resource with Improper Synchronization'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    owasp:
    - A10:2021 Server-Side Request Forgery
    technology:
    - Java
    references:
    - https://cwe.mitre.org/data/definitions/362.html
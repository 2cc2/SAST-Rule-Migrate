# 转换后的 Semgrep 规则
rules:
- id: method-argument-could-be-final
  patterns:
  - pattern: |
      $TYPE $METHOD(..., $PARAM $ID, ...) {
          ...
      }
  - pattern-not: |
      $TYPE $METHOD(..., final $PARAM $ID, ...) {
          ...
      }
  - metavariable-regex:
      metavariable: $PARAM
      regex: "^\\w+$"
  - metavariable-regex:
      metavariable: $ID
      regex: "^\\w+$"
  - focus-metavariable: $ID
  message: Parameter '$ID' could be declared as final since it's effectively final
  languages:
  - java
  severity: WARNING
  metadata:
    category: style
    subcategory:
    - maintainability
    cwe:
    - 'CWE-546: Suspicious Comment'
    confidence: HIGH
    likelihood: LOW
    impact: LOW
    technology:
    - Java
rules:
- id: hard-coded-crypto-key
  patterns:
  - pattern: new javax.crypto.spec.SecretKeySpec(..., ...)
  message: Found hard-coded crypto key in SecretKeySpec constructor. This may expose sensitive cryptographic material.
  languages:
  - java
  severity: WARNING
  metadata:
    category: security
    subcategory:
    - crypto
    cwe:
    - 'CWE-321: Use of Hard-coded Cryptographic Key'
    confidence: HIGH
    likelihood: HIGH
    impact: HIGH
    owasp:
    - A9:2017 Using Components with Known Vulnerabilities
    technology:
    - Java
    references:
    - https://cwe.mitre.org/data/definitions/321.html
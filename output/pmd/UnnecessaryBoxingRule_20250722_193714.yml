rules:
- id: unnecessary-boxing
  patterns:
  - pattern-either:
    - pattern: |
        new $BOXED_TYPE($PRIMITIVE_EXPR)
    - pattern: |
        $BOXED_TYPE.valueOf($PRIMITIVE_EXPR)
    - pattern: |
        $BOXED_EXPR.$UNBOX_METHOD()
  message: Unnecessary boxing/unboxing operation detected
  languages:
  - java
  severity: WARNING
  metadata:
    category: performance
    subcategory:
    - efficiency
    cwe:
    - 'CWE-1164: Irrelevant Code'
    confidence: HIGH
    likelihood: HIGH
    impact: LOW
    owasp:
    - A10:2021 Serverless Misconfiguration
    technology:
    - Java
    references:
    - https://rules.sonarsource.com/java/RSPEC-2153
rules:
- id: avoid-reassigning-catch-variables
  patterns:
  - pattern: |
      try {
        ...
      } catch ($TYPE $VAR) {
        ...
        $VAR = ...;
        ...
      }
  message: Reassigning catch variables can lead to confusing code and potential errors. Avoid modifying the exception variable in catch blocks.
  languages:
  - java
  severity: WARNING
  metadata:
    category: best-practices
    subcategory:
    - error-handling
    cwe:
    - 'CWE-1048: Incorrect Behavior Order: Early Amplification'
    confidence: MEDIUM
    likelihood: LOW
    impact: MEDIUM
    owasp:
    - A12:2021-Security Logging and Monitoring Failures
    references:
    - https://cwe.mitre.org/data/definitions/1048.html
rules:
- id: invalid-log-message-format
  patterns:
  - pattern-either:
    - pattern: |
        ($TYPE.isA("org.slf4j.Logger", $QUALIFIER) && $SET.contains($METHOD))
    - pattern: |
        ($TYPE.isA("org.apache.logging.log4j.Logger", $QUALIFIER) && $SET.contains($METHOD))
  - pattern-not: |
      $MESSAGE.getConstValue() == null
  - pattern-not: |
      $EXPECTED.empty()     
  - pattern: |
      $CALL($ARGS)
  message: >-
    Invalid log message format, expected $EXP_ARG arguments but found $PROV_ARG
  fix: |
    $CALL($FIXED_ARGS)
  languages:
  - java
  severity: WARNING
  metadata:
    category: security
    subcategory:
    - error-handling
    cwe:
    - 'CWE-134: Use of Externally-Controlled Format String'
    confidence: MEDIUM
    impact: MEDIUM
    technology:
    - Java
    references:
    - https://cwe.mitre.org/data/definitions/134.html
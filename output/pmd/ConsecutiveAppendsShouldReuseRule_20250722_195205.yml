rules:
- id: consecutive-appends-should-reuse
  patterns:
    - pattern-either:
      - pattern: |
          $EXPR_STATEMENT;
          $NEXT_EXPR_STATEMENT;
          ($VAR = $EXPR1).append(...);
          ($VAR = $EXPR2).append(...);
      - pattern: |
          $TYPE $VAR = ... .append(...);
          $VAR.append(...);
  message: Consecutive append operations on the same StringBuilder variable should be chained/reused
  languages: [java]
  severity: WARNING
  metadata:
    category: performance
    subcategory:
    - efficiency
    cwe:
    - 'CWE-170: Improper Null Termination'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: LOW
    technology:
    - Java
    references:
    - https://pmd.github.io/latest/pmd_rules_java_performance.html#consecutiveappendsshouldreuse
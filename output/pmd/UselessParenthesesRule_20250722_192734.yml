rules:
- id: useless-parentheses
  patterns:
  - pattern: "($EXP)"
  - metavariable-comparison:
      metavariable: "$EXP"
      comparison: "needs_parentheses($EXP, false)" 
  message: "Unnecessary parentheses found around expression"
  languages:
  - java
  severity: WARNING
  metadata:
    category: style
    subcategory:
    - correctness
    cwe:
    - "CWE-1112: Incomplete Documentation of Program Transactions"
    confidence: MEDIUM
    likelihood: LOW
    impact: LOW
    technology:
    - Java
    references:
    - https://pmd.github.io/latest/pmd_rules_java_codestyle.html#uselessparentheses
rules:
- id: use-try-with-resources
  message: |
    Prefer using try-with-resources for AutoCloseable resources instead of manually closing in finally block.
  patterns:
    - pattern: |
        try {
          ...
        } finally {
          $Q.$M(...);
        }
    - metavariable-regex:
        metavariable: $M
        regex: (close|closeQuietly)
    - pattern-not: $Q.staticMethod(...)
    - pattern-inside: |
        import java.lang.AutoCloseable;
        ...
    - pattern-either:
      - pattern: $Q instanceof AutoCloseable
      - pattern: $Q != null && $Q instanceof AutoCloseable
  languages: [java]
  severity: WARNING
  metadata:
    category: best-practices
    subcategory: resource-management
    cwe: ["CWE-459: Incomplete Cleanup"]
    confidence: HIGH
    likelihood: HIGH
    impact: MEDIUM
    owasp: ["A9:2021 Security Logging and Monitoring Failures"]
    references:
      - https://docs.oracle.com/javase/tutorial/essential/exceptions/tryResourceClose.html
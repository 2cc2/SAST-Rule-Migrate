rules:
- id: abstract-class-without-abstract-method
  message: Abstract class should contain at least one abstract method
  patterns:
    - pattern: |
        abstract class $CLASS {
          ...
        }
    - pattern-not: |
        abstract $RETURN $NAME(...);
    - pattern-not: |
        abstract class $CLASS extends $SUPER { ... }
    - pattern-not: |
        abstract class $CLASS implements $INTERFACE { ... }
  languages:
    - java
  severity: WARNING
  metadata:
    category: best-practices
    cwe:
      - "CWE-398: Indicator of Poor Code Quality"
    technology:
      - java
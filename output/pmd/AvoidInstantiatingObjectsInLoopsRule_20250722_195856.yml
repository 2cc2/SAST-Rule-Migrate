rules:
- id: avoid-instantiating-objects-in-loops-improved
  message: Avoid instantiating objects or arrays in loops as it may impact performance
  patterns:
  - pattern: |
      $TYPE $VAR = new $CLASS(...);
  - pattern-not-inside: |
      {
        ...
        $LOOP { ... }
        ...
      }
  - pattern-either:
    - pattern: |
        throw new $CLASS(...);
    - pattern: |
        return new $CLASS(...);
    - pattern: |
        [...] = new $TYPE[...];
    - pattern: |
        $COLLECTION.$METHOD(...);
  languages:
  - java
  severity: WARNING
  metadata:
    category: performance
    subcategory:
    - efficiency
    cwe:
    - 'CWE-400: Uncontrolled Resource Consumption'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    technology:
    - Java
    references:
    - https://pmd.github.io/pmd-6.55.0/pmd_rules_java_performance.html#avoidinstantiatingobjectsinloops
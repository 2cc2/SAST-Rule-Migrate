rules:
- id: avoid-deeply-nested-if-statements
  patterns:
  - pattern: |
      if (...) {
        ...
        if (...) {
          ...
          if (...) {
            ...
          }
          ...
        }
        ...
      }
  - pattern-not: |
      if (...) {
        ...
        if (...) {
          ...
        }
      }
  message: Avoid deeply nested if statements (depth > 3). Deep nesting makes code harder to read and maintain.
  languages:
  - java
  severity: WARNING
  metadata:
    category: design
    subcategory:
    - complexity
    cwe:
    - 'CWE-1114: Excessive Use of Unconditional Branching'
    confidence: HIGH
    likelihood: MEDIUM
    impact: LOW
    technology:
    - Java
    references:
    - https://cwe.mitre.org/data/definitions/1114.html
# 转换后的 Semgrep 规则
rules:
- id: missing-override
  message: Missing @Override annotation for overridden method
  patterns:
  - pattern: |
      class $CLASS {
        $RET $NAME(...) {
          ...
        }
      }
  - pattern-not: |
      @Override
      $RET $NAME(...) { 
        ... 
      }
  languages:
  - java
  severity: WARNING
  metadata:
    category: best-practices
    subcategory:
    - maintainability
    cwe:
    - 'CWE-116: Improper Encoding or Escaping of Output'
    confidence: MEDIUM
    likelihood: LOW
    impact: LOW
    technology:
    - Java
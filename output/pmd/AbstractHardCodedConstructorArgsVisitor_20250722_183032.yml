rules:
- id: hard-coded-constructor-args
  patterns:
  - pattern: |
      new $TYPE($ARG)
  - focus-metavariable: $ARG
  - patterns:
    - pattern-either:
      - pattern: "..."
      - pattern: |
          new $ARRAYTYPE[] {...}
  message: Detected hard-coded sensitive data in constructor arguments
  languages:
  - java
  severity: WARNING
  metadata:
    category: security
    subcategory:
    - crypto
    cwe:
    - 'CWE-547: Use of Hard-coded, Security-relevant Constants'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    owasp:
    - A3:2021 - Sensitive Data Exposure
    technology:
    - Java
    references:
    - https://cwe.mitre.org/data/definitions/547.html
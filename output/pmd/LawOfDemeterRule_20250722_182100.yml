rules:
- id: law-of-demeter
  patterns:
    - pattern-either:
      - pattern-inside: |
          class $CLASS {
            ...
          }
      - pattern-not: $THIS.$FIELD
      - pattern-not: $THIS.$METHOD(...)
  message: |
    Possible violation of Law of Demeter:
    - Field access on foreign value: {{ $FIELD }}
    - Method call on foreign value: {{ $METHOD }}
  languages: [java]
  severity: WARNING
  metadata:
    category: design
    subcategory: [coupling]
    cwe: ['CWE-1065: Excessive Non-Strict Class Coupling']
    references:
      - https://pmd.sourceforge.io/pmd-6.55.0/pmd_rules_java_design.html#lawofdemeter
      - https://wiki.c2.com/?LawOfDemeter
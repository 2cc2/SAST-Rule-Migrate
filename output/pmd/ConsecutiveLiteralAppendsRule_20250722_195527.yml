rules:
- id: consecutive-literal-appends
  message: |
    Consecutive calls to StringBuffer/Builder.append with string literals found.
    Consider combining these calls into a single append operation.
  languages: [java]
  severity: WARNING
  patterns:
    - pattern-either:
      - pattern: |
          $TYPE $VAR = new $STRINGBUILDER($_);
          $VAR.append($LIT1);
          $VAR.append($LIT2);
      - pattern: |
          $TYPE $VAR = new $STRINGBUILDER($_);
          $VAR.append($LIT1).append($LIT2);
    - metavariable-regex:
        metavariable: $STRINGBUILDER
        regex: (StringBuffer|StringBuilder)
    - metavariable-regex:
        metavariable: $LIT1
        regex: \".*\"
    - metavariable-regex:
        metavariable: $LIT2
        regex: \".*\"
    - focus-metavariable: $STRINGBUILDER
  metadata:
    category: performance
    subcategory: string-handling
    cwe: "CWE-710: Improper Adherence to Coding Standards"
    technology:
    - Java
    references:
    - https://pmd.github.io/latest/pmd_rules_java_performance.html#consecutiveliteralappends
rules:
- id: simplify-boolean-returns
  languages:
  - java
  message: Boolean returns can be simplified
  patterns:
  - pattern: |
      if ($COND) {
        return $THEN;
      } else {
        return $ELSE;
      }
  - focus-metavariable:
    - $COND
    - $THEN
    - $ELSE
  - metavariable-regex:
      metavariable: $THEN
      regex: (true|false)
  - metavariable-regex:
      metavariable: $ELSE
      regex: (true|false)
  severity: WARNING
  fix: |
    return $COND;
  metadata:
    category: style
    subcategory:
    - simplification
    cwe:
    - 'CWE-670: Always-Incorrect Control Flow Implementation'
    confidence: MEDIUM
    likelihood: LOW
    impact: LOW
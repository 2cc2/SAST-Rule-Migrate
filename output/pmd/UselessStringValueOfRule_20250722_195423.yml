rules:
- id: useless_string_valueof
  patterns:
  - pattern: |
      $X.valueOf($ARG)
  - pattern-not: |
      $X.valueOf(..., ...)
  - pattern-inside: |
      $STR.concat(...) |
      $STR + ... |
      ... + $STR
  - metavariable-regex:
      metavariable: $X
      regex: String
  - metavariable-type:
      metavariable: $ARG
      type: java.lang.String
  message: |
    Useless String.valueOf() call on a String argument in string concatenation.
  languages:
  - java
  severity: WARNING
  metadata:
    category: performance
    subcategory:
    - efficiency
    cwe:
    - 'CWE-116: Improper Encoding or Escaping of Output'
    technote: |
      String.valueOf() is redundant when the argument is already a String.
rules:
- id: immutable-field
  patterns:
  - pattern: |
      class $CLASS {
        $TYPE $FIELD;
        ...
      }
  - pattern-not: |
      class $CLASS {
        @lombok.Builder $TYPE $FIELD;
        ...
      }
  - pattern-not: |
      class $CLASS {
        @lombok.Data $TYPE $FIELD;
        ...
      }
  - pattern-not: |
      class $CLASS {
        @lombok.Setter $TYPE $FIELD;
        ...
      }
  - pattern-not: |
      class $CLASS {
        @lombok.Value $TYPE $FIELD;
        ...
      }
  - pattern-not: |
      class $CLASS {
        ...
        @lombok.Setter $TYPE $FIELD;
        ...
      }
  - pattern-not: |
      class $CLASS {
        private volatile $TYPE $FIELD;
        ...
      }
  - pattern-not: |
      class $CLASS {
        private static $TYPE $FIELD;
        ...
      }
  - pattern-not: |
      class $CLASS {
        private final $TYPE $FIELD;
        ...
      }
  - metavariable-regex:
      metavariable: $FIELD
      regex: ^[a-z].*
  message: >
    The field '$FIELD' should be declared as final since it's not modified outside of constructors.
    Consider making it final or annotating with lombok's @Value/@Setter if mutability is required.
  languages:
  - java
  severity: WARNING
  metadata:
    category: design
    subcategory:
    - immutability
    cwe:
    - 'CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes'
    confidence: MEDIUM
    likelihood: LOW
    impact: MEDIUM
    owasp:
    - A9:2021 Security Logging and Monitoring Failures
    technology:
    - Java
    references:
    - https://rules.sonarsource.com/java/RSPEC-1170
    - https://cwe.mitre.org/data/definitions/915.html
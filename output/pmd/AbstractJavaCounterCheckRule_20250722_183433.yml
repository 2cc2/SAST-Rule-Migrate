rules:
- id: abstract-java-counter-check
  patterns:
  - pattern: |
      public abstract class $CLASS<T extends JavaNode> {
        private final PropertyDescriptor<Integer> reportLevel = ...;
        
        public $CLASS(Class<T> nodeType) {
          ...
          definePropertyDescriptor(reportLevel);
        }
        
        protected abstract int defaultReportLevel();
        
        protected boolean isIgnored(T node) { ... }
        
        protected abstract boolean isViolation(T node, int reportLevel);
        
        @Override
        public Object visitJavaNode(JavaNode node, Object data) {
          ...
          if (!isIgnored(t)) {
            if (isViolation(t, getProperty(reportLevel))) {
              asCtx(data).addViolation(node);
            }
          }
          ...
        }
      }
  message: |
    AbstractJavaCounterCheckRule found. This is a template for rules that count node lengths.
  languages:
  - java
  severity: INFO
  metadata:
    category: style
    subcategory:
    - abstract
    technology:
    - Java
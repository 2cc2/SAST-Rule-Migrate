rules:
- id: get-modifiers-fun
  patterns:
  - pattern: |
      $MODS = $OWNER.getModifiers();
      $SET = $EXPLICIT ? $MODS.getExplicitModifiers() : $MODS.getEffectiveModifiers();
      $RESULT = CollectionUtil.map($SET, $MODIFIER::getToken);
  - pattern-inside: |
      class $CLASS {
          ...
          public Object method(...) {
              ...
          }
      }
  message: Found usage of GetModifiersFun functionality
  languages:
  - java
  severity: INFO
  metadata:
    category: code-style
    subcategory:
    - xpath
    technology:
    - java
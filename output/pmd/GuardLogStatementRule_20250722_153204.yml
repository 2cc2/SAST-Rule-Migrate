rules:
- id: guard-log-statement
  patterns:
  - pattern: |
      $METHODCALL(..., $ARG(...), ...)
  - metavariable-regex:
      metavariable: $METHODCALL
      regex: (trace|debug|info|warn|error|log|finest|finer|fine|warning|severe)
  - pattern-not: |
      if ($GUARD.$GUARD_METHOD(...)) {
        ...
        $METHODCALL(...);
        ...
      }
  - metavariable-regex:
      metavariable: $GUARD_METHOD
      regex: (isTraceEnabled|isDebugEnabled|isInfoEnabled|isWarnEnabled|isErrorEnabled|isLoggable)
  message: >
    Log statement should be guarded by a corresponding log level check (e.g. isDebugEnabled for debug-level logs)
    to avoid unnecessary string construction when logging is disabled.
  languages:
  - java
  severity: WARNING
  metadata:
    category: best-practices
    subcategory:
    - logging
    cwe:
    - 'CWE-478: Missing Default Case in Switch'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: LOW
    owasp:
    - A03:2021 - Injection
    technology:
    - logging
rules:
- id: abstract-naming-convention
  patterns:
  - pattern: |
      abstract class $CLASS {
        ...
        void checkMatches($T $NODE, PropertyDescriptor<Pattern> $REGEX, Object $DATA) {
          String $NAME = nameExtractor($NODE);
          if (!getProperty($REGEX).matcher($NAME).matches()) {
            asCtx($DATA).addViolation($NODE, kindDisplayName($NODE, $REGEX), $NAME, getProperty($REGEX).toString());
          }
        }
      }
  message: |
    Naming convention violation found. The name '{{$NAME}}' does not match the required pattern '{{getProperty($REGEX).toString()}}'.
  languages:
  - java
  severity: WARNING
  metadata:
    category: code-style
    subcategory: naming-convention
    cwe:
    - 'CWE-178: Improper Handling of Case Sensitivity'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: LOW
rules:
- id: inefficient-string-buffering
  patterns:
  - pattern: |
      $STRINGBUILDER.$METHOD(
        $EXPR + $EXPR
      )
  - pattern: |
      new $STRINGBUILDER(
        $EXPR + $EXPR
      )
  - metavariable-regex:
      metavariable: $STRINGBUILDER
      regex: (StringBuffer|StringBuilder)
  - metavariable-regex:
      metavariable: $METHOD
      regex: (append|toString)
  message: Inefficient string buffering using concatenation operator in StringBuffer/StringBuilder. Consider using chained append calls instead.
  languages:
  - java
  severity: WARNING
  metadata:
    category: performance
    subcategory: inefficient
    cwe:
    - 'CWE-710: Improper Adherence to Coding Standards'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    references:
    - https://pmd.github.io/latest/pmd_rules_java_performance.html#inefficientstringbuffering
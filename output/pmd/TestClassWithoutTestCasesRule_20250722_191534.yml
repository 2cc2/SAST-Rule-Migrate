rules:
- id: test-class-without-test-cases
  patterns:
    - pattern: |
        class $CLASS {
          ...
        }
    - metavariable-pattern:
        metavariable: $CLASS
        patterns:
          - pattern-not: abstract class $CLASS {...}
          - pattern-not: interface $CLASS {...}
          - pattern-either:
              - pattern: |
                  @Test
                  class $CLASS {...}
              - pattern: |
                  @RunWith(...)
                  class $CLASS {...}
              - pattern-regex: ^(?:.*\.)?Test[^\.]*$|^(?:.*\.)?.*Tests?$|^(?:.*\.)?.*TestCase$
          - pattern-not-inside: |
              class $CLASS {
                ...
                @Test
                void $METHOD() {...}
              }
          - pattern-not-inside: |
              class $CLASS {
                ...
                class $NESTED {
                  @Test
                  void $METHOD() {...}
                }
              }
  message: Test class '${CLASS}' does not contain any test cases
  languages: [java]
  severity: WARNING
  metadata:
    category: correctness
    subcategory: test
    cwe: "CWE-489: Leftover Debug Code"
    confidence: MEDIUM
    technology:
      - junit
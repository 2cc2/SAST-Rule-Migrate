# 转换后的 Semgrep 规则
rules:
- id: avoid-reassigning-parameters
  patterns:
    - pattern-either:
      - pattern: |
          class $CLASS {
              $RET $METHOD($TYPE $PARAM) {
                  $PARAM = $EXPR;
              }
          }
      - pattern: |
          class $CLASS {
              $RET $METHOD($TYPE1 $PARAM1, $TYPE $PARAM, $TYPE2 $PARAM2) {
                  $PARAM = $EXPR;
              }
          }
    - pattern-not: |
        class $CLASS {
            $RET $METHOD(final $TYPE $PARAM) {
                ...
            }
        }
  message: Reassigning method or constructor parameters is not recommended. Consider making the parameter 'final' or using a local variable instead.
  languages: [java]
  severity: WARNING
  metadata:
    category: best-practices
    subcategory:
      - maintainability
    cwe:
      - 'CWE-670: Always-Incorrect Control Flow Implementation'
    confidence: MEDIUM
    likelihood: LOW
    impact: LOW
    owasp:
      - A9:2017 Using Components with Known Vulnerabilities
    technology:
      - Java
    references:
      - https://rules.sonarsource.com/java/RSPEC-1226
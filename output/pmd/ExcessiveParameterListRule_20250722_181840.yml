rules:
- id: excessive_parameter_list
  patterns:
  - pattern: |
      $RET $NAME(...) {
        ...
      }
  - focus-metavariable: $NAME
  - pattern-not: |
      private $TYPE(...) { ... }
  - metavariable-comparison:
      metavariable: $NAME
      comparison: $NAME.length > 10
  message: >
    Excessive parameter list detected (more than 10 parameters).
    Long parameter lists can indicate poor code design and make methods harder to understand and maintain.
  languages:
  - java
  severity: WARNING
  metadata:
    category: design
    subcategory:
    - complexity
    cwe:
    - 'CWE-561: Dead Code'
    - 'CWE-1048: Invokable Control Flow with Unnecessary Functionality'
    confidence: MEDIUM
    likelihood: LOW
    impact: MEDIUM
    technology:
    - Java
    references:
    - https://pmd.github.io/latest/pmd_rules_java_design.html#excessiveparameterlist
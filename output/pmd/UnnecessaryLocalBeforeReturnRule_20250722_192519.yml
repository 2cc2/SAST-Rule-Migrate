rules:
- id: unnecessary-local-before-return
  patterns:
  - pattern: |
      $TYPE $VAR = ...;
      ...
      return $VAR;
  - pattern-not: |
      $TYPE $VAR = ...;
      ...
      $VAR = ...;
      ...
      return $VAR;
  - pattern-not: $TYPE $VAR = ...; ...($VAR); ... return $VAR;
  message: Unnecessary local variable before return statement. Consider directly returning the expression.
  languages: [java]
  severity: WARNING
  metadata:
    category: code-style
    subcategory: unnecessary
    cwe: "CWE-563: Assignment to Variable without Use"
    technology:
    - Java
rules:
- id: junit-assertions-should-include-message
  message: Unit test assertions should include a message (deprecated, use UnitTestAssertionsShouldIncludeMessageRule instead)
  patterns:
  - pattern: |
      class $CLASS extends UnitTestAssertionsShouldIncludeMessageRule { ... }
  - metavariable-regex:
      metavariable: $CLASS
      regex: .*JUnitAssertionsShouldIncludeMessage.*
  languages:
  - java
  severity: WARNING
  metadata:
    category: best-practices
    deprecated: true
    replacement: UnitTestAssertionsShouldIncludeMessageRule
rules:
- id: class-with-only-private-constructors-should-be-final
  patterns:
    - pattern: |
        class $CLASS {
          ...
        }
    - pattern-not: final class $CLASS { ... }
    - pattern-not: |
        @lombok.Value
        class $CLASS { ... }
    - pattern-either:
      - pattern-not: |
          @lombok.NoArgsConstructor
          class $CLASS { ... }
      - pattern-not: |
          @lombok.NoArgsConstructor(...)
          class $CLASS { ... }
    - pattern-either:
      - pattern-not: |
          @lombok.RequiredArgsConstructor
          class $CLASS { ... }
      - pattern-not: |
          @lombok.RequiredArgsConstructor(...)
          class $CLASS { ... }
    - pattern-either:
      - pattern-not: |
          @lombok.AllArgsConstructor
          class $CLASS { ... }
      - pattern-not: |
          @lombok.AllArgsConstructor(...)
          class $CLASS { ... }
    - pattern: |
        class $CLASS {
          ...
          private $CLASS(...) { ... }
          ...
        }
    - pattern-not: |
        class $CLASS {
          ...
          public $CLASS(...) { ... }
          ...
        }
    - metavariable-regex:
        metavariable: $CLASS
        regex: ^(?!.*extends).*$
  message: |
    Class with only private constructors should be declared final to prevent subclassing.
  languages: [java]
  severity: WARNING
  metadata:
    category: design
    cwe: "CWE-493: Critical Public Variable Without Final Modifier"
    owasp: "A12:2021 - Security Misconfiguration"
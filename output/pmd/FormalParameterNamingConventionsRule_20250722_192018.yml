rules:
- id: formal-parameter-naming-conventions
  patterns:
  - pattern: |
      $TYPE $VAR;
  - metavariable-pattern:
      metavariable: $VAR
      patterns:
      - pattern-not-regex: ^[a-z][a-zA-Z0-9]*$
      - pattern-not-regex: ^[a-z][a-zA-Z0-9]*$
      - pattern-not-regex: ^[a-z][a-zA-Z0-9]*$
      - pattern-not-regex: ^[a-z][a-zA-Z0-9]*$
  message: Parameter name '$VAR' does not match naming convention
  languages:
  - java
  severity: WARNING
  metadata:
    category: style
    subcategory:
    - naming
    cwe:
    - 'CWE-1099: Improper Validation of Naming Conventions'
    confidence: MEDIUM
    likelihood: LOW
    impact: LOW
    owasp:
    - A3:2017-Sensitive Data Exposure
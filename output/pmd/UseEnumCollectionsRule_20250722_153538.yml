# 转换后的 Semgrep 规则
rules:
- id: use-enum-collections
  message: |
    Consider using EnumMap or EnumSet instead of HashMap or HashSet when working with enum keys for better performance and type safety.
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern-either:
    - pattern: new HashMap<$TYPE>(...)
    - pattern: new HashSet<$TYPE>(...)
  - pattern-not: new EnumMap<$TYPE>(...)
  - pattern-not: new EnumSet<$TYPE>(...)
  - metavariable-regex:
      metavariable: $TYPE
      regex: .*Enum.*
  metadata:
    category: best-practice
    subcategory:
    - performance
    cwe:
    - 'CWE-1088: Excessive Use of Unconditional Branching'
    confidence: MEDIUM
    likelihood: HIGH
    impact: MEDIUM
    owasp:
    - A12:2021-Insecure Design
    references:
    - https://docs.oracle.com/javase/8/docs/api/java/util/EnumMap.html
    - https://docs.oracle.com/javase/8/docs/api/java/util/EnumSet.html
rules:
- id: insufficient-string-buffer-declaration
  languages:
  - java
  message: StringBuffer/StringBuilder may have been pre-sized incorrectly (capacity=${1}, anticipated length=${2})
  patterns:
  - pattern: |
      $TYPE $VAR = new $BUILDER(...);
  - pattern-not: $VAR = new $BUILDER($SIZE)
  - metavariable-regex:
      metavariable: $BUILDER
      regex: (StringBuffer|StringBuilder)
  - pattern-inside: |
      class $CLASS {
        ...
      }
  severity: WARNING
  metadata:
    category: performance
    cwe:
    - 'CWE-131: Incorrect Calculation of Buffer Size'
    technology:
    - Java
    references:
    - https://sourceforge.net/p/pmd/discussion/188194/thread/aba9dae7/
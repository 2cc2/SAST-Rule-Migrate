rules:
- id: for-loop-can-be-foreach
  patterns:
    - pattern-either:
      - pattern: |
          for ($TYPE_DECL $VAR_DECL = 0; $VAR_DECL < $ITERABLE.size(); $VAR_DECL++) {
            ...
          }
      - pattern: |
          for ($TYPE_DECL $VAR_DECL = 0; $VAR_DECL < $ITERABLE.length; $VAR_DECL++) {
            ...
          }
      - patterns:
        - pattern: |
            for (Iterator<$TYPE_DECL> $ITER_DECL = $ITERABLE.iterator(); $ITER_DECL.hasNext();) {
              $TYPE_DECL $ELEM_DECL = $ITER_DECL.next();
              ...
            }
  message: This for loop can be replaced with a foreach loop to improve readability and reduce potential errors.
  languages: [java]
  severity: WARNING
  metadata:
    category: best-practices
    subcategory: readability
    cwe: ["CWE-398: Indicator of Poor Code Quality"]
    references:
      - https://pmd.github.io/pmd-6.55.0/pmd_rules_java_bestpractices.html#forloopcanbeforeach
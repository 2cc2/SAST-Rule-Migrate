rules:
- id: avoid-hardcoded-ip
  patterns:
    - pattern: "\"$IP\""
    - metavariable-regex:
        metavariable: $IP
        regex: '(?:(?:[0-9]{1,3}\.){3}[0-9]{1,3}|(?:[0-9a-fA-F]{1,4}:)+(?:[0-9a-fA-F]{1,4}|(?:(?:[0-9]{1,3}\.){3}[0-9]{1,3}))?)'
  message: "Hardcoded IP address detected. Consider using configuration files or environment variables instead."
  languages:
    - java
  severity: WARNING
  metadata:
    category: security
    subcategory:
      - best-practices
    cwe:
      - "CWE-547: Use of Hard-coded, Security-relevant Constants"
    references:
      - https://cwe.mitre.org/data/definitions/547.html
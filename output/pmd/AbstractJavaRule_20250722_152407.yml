rules:
- id: abstract-java-rule-visitor
  patterns:
  - pattern: |
      public abstract class AbstractJavaRule extends AbstractRule implements JavaVisitor {
          @Override
          public Object visitNode(Node node, Object param) {
              node.children().forEach(n -> n.acceptVisitor(this, param));
              return param;
          }
      
          @Override
          public void apply(Node target, RuleContext ctx) {
              target.acceptVisitor(this, ctx);
          }
      }
  message: Found a custom Java rule implementation extending AbstractJavaRule
  languages: [java]
  severity: INFO
  metadata:
    category: code-style
    subcategory:
    - architecture
    technology:
    - Java
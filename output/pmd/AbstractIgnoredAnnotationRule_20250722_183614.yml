rules:
- id: abstract-ignored-annotation-rule
  patterns:
  - pattern: |
      return getProperty($DESCRIPTOR).stream().anyMatch($NODE::isAnnotationPresent);
  - pattern-not-inside: |
      @interface $A { ... }
  message: |
    Found usage of ignored annotations check. This may indicate intentional suppression of security checks.
  languages:
  - java
  severity: INFO
  metadata:
    category: security
    subcategory:
    - annotation
    confidence: MEDIUM
    likelihood: LOW
    impact: LOW
    references:
    - https://pmd.github.io/latest/pmd_rules_java_design.html#ignoredannotation
rules:
- id: avoid-reassigning-loop-variables
  patterns:
  - pattern: |
      for ($TYPE $VAR : ...) {
        ...
        $VAR = ...;
        ...
      }
  - pattern: |
      for (...; ...; ...) {
        ...
        $VAR = ...;
        ...
      }
  message: Reassigning loop variables can lead to confusing code and potential bugs. Consider using a different variable name.
  languages:
  - java
  severity: WARNING
  metadata:
    category: best-practices
    subcategory:
    - readability
    cwe:
    - 'CWE-600: Uncaught Exception in Servlet'
    owasp:
    - A3:2017-Sensitive Data Exposure
    references:
    - https://rules.sonarsource.com/java/RSPEC-1229
    - https://pmd.github.io/latest/pmd_rules_java_bestpractices.html#avoidreassigningloopvariables
# 转换后的 Semgrep 规则
rules:
- id: close-resource
  patterns:
    - pattern-either:
      - pattern: |
          $TYPE $VAR = ...;
          ...
          try {
              ...
          } finally {
              $VAR.close();
          }
      - pattern: |
          $TYPE $VAR = ...;
          ...
          try ($TYPE $VAR2 = $VAR) {
              ...
          }
    - pattern-not: |
        java.io.ByteArrayOutputStream $VAR = ...;
    - pattern-not: |
        java.io.ByteArrayInputStream $VAR = ...;
    - pattern-not: |
        java.io.StringWriter $VAR = ...; 
    - pattern-not: |
        java.io.CharArrayWriter $VAR = ...;
    - pattern-not: |
        java.util.stream.Stream $VAR = ...;
    - pattern-not: |
        java.util.stream.IntStream $VAR = ...;
    - pattern-not: |
        java.util.stream.LongStream $VAR = ...;
    - pattern-not: |
        java.util.stream.DoubleStream $VAR = ...;
  message: Resource $VAR should be closed unconditionally in finally block or via try-with-resources
  languages:
    - java
  severity: WARNING
  metadata:
    category: security
    subcategory:
      - resource-management
    cwe:
      - 'CWE-459: Incomplete Cleanup'
    confidence: MEDIUM
    likelihood: MEDIUM  
    impact: MEDIUM
    owasp:
      - A6:2017-Security Misconfiguration
    technology:
      - Java
    references:
      - https://cwe.mitre.org/data/definitions/459.html
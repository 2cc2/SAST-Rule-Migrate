rules:
- id: unit-test-too-many-asserts
  patterns:
  - pattern: |
      @Test
      public void $METHOD(...) {
        ...
        $ASSERT.$M(...);
        ...
      }
  - metavariable-regex:
      metavariable: $ASSERT
      regex: (assert|assertThat|assertEquals|assertTrue|assertFalse|assertNotNull|assertNull|assertSame|assertNotSame|assertArrayEquals|fail|<...>)
  - pattern-not: |
      @Test
      public void $METHOD(...) { ... }
  - focus-metavariable: $METHOD
  message: Unit test contains too many assertions (max $MAX_ASSERTS). Consider splitting the test into multiple smaller tests.
  languages:
  - java
  severity: WARNING
  metadata:
    category: best-practices
    subcategory:
    - testing
    cwe:
    - 'CWE-398: Indicator of Poor Code Quality'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: LOW
    technology:
    - JUnit
    references:
    - https://pmd.github.io/latest/pmd_rules_java_bestpractices.html#unittestcontainstoomanyasserts
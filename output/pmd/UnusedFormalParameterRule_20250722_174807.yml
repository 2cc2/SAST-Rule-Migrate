# 转换后的 Semgrep 规则
rules:
- id: unused-formal-parameter
  message: Unused formal parameter '$VAR' in method
  patterns:
  - pattern: |
      $RETURNTYPE $METHOD(...) {
        ...
      }
  - pattern-not: |
      $RETURNTYPE $METHOD(..., $TYPE $VAR, ...) {
        ...
        $VAR.$ANY(...);
        ...
      }
  - pattern-not: |
      $RETURNTYPE $METHOD(..., $TYPE $VAR, ...) {
        ...
        $ANY.$VAR(...);
        ...
      }
  - pattern-not: |
      $RETURNTYPE $METHOD(..., $TYPE $VAR, ...) {
        ...
        $ANY = $VAR;
        ...
      }
  - metavariable-regex:
      metavariable: $METHOD
      regex: (private|protected)
  languages:
  - java
  severity: WARNING
  metadata:
    category: best-practices
    subcategory: unused
    cwe:
    - 'CWE-563: Assignment to Variable without Use'
    confidence: MEDIUM
    technology:
    - Java
    references:
    - https://cwe.mitre.org/data/definitions/563.html
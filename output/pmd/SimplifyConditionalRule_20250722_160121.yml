rules:
- id: simplify-conditional
  message: Simplify conditional expression can be simplified (e.g. `a != null && a instanceof T` -> `a instanceof T`)
  patterns:
  - pattern: |
      $LEFT == null || $LEFT instanceof $T
  - pattern: |
      $LEFT != null && $LEFT instanceof $T
  fix: $LEFT instanceof $T
  languages:
  - java
  severity: WARNING
  metadata:
    category: maintainability
    subcategory:
    - simplification
    cwe:
    - "CWE-1114: Inappropriate Comments"
    confidence: MEDIUM
    likelihood: LOW
    impact: LOW
    owasp:
    - A3:2021 - Injection
    technology:
    - Java
rules:
- id: suspicious-octal-escape
  patterns:
  - pattern: |
      "$STR"
  - metavariable-regex:
      metavariable: $STR
      regex: '(?<!\\)\\([0-7])([0-7])?([0-7])?([0-9])?'
  message: Suspicious octal escape sequence detected. Octal escapes followed by decimal digits can be confusing and error-prone.
  languages: 
  - java
  severity: WARNING
  metadata:
    category: error-prone
    subcategory:
    - suspicious-code
    cwe:
    - 'CWE-116: Improper Encoding or Escaping of Output'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    references:
    - https://cwe.mitre.org/data/definitions/116.html
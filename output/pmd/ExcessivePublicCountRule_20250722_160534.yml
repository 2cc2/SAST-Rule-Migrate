# 转换后的 Semgrep 规则
rules:
- id: excessive-public-count
  patterns:
  - pattern-inside: |
      class $CLASS {
        ...
      }
  - pattern-either:
    - pattern: |
        public $TYPE $FIELD;
    - pattern: |
        public $TYPE $FIELD = ...;
    - pattern: |
        public $RETURN $METHOD(...) { ... }
  - pattern-not: |
      public static final $TYPE $CONSTANT = ...;
  message: Class has too many public members (over $REPORTLEVEL). Consider splitting into subclasses to reduce coupling and improve testability.
  languages:
  - java
  severity: WARNING
  metadata:
    category: design
    cwe:
    - "CWE-657: Violation of Secure Design Principles"
    owasp:
    - A3:2017-Sensitive Data Exposure
    technology:
    - Java
    references:
    - https://pmd.github.io/latest/pmd_rules_java_design.html#excessivepubliccount
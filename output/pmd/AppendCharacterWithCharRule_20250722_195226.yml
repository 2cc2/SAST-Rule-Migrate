rules:
- id: append-character-with-char
  patterns:
  - pattern: |
      $BUFFER.append("$CHAR")
  - metavariable-regex:
      metavariable: $CHAR
      regex: '^.$'
  - pattern-inside: |
      import java.lang.StringBuffer;
      ...
  - pattern-inside: |
      import java.lang.StringBuilder;
      ...
  message: |
    Using StringBuffer.append() with a single character string literal is inefficient.
    Consider using StringBuffer.append() with a character literal instead.
  languages:
  - java
  severity: WARNING
  metadata:
    category: performance
    subcategory:
    - efficiency
    cwe:
    - 'CWE-697: Incorrect Comparison'
    confidence: MEDIUM
    likelihood: LOW
    impact: LOW
    technology:
    - Java
    references:
    - https://sourceforge.net/p/pmd/feature-requests/381/
rules:
- id: loose-package-coupling
  patterns:
    - pattern: |
        import $PACKAGE.$CLASS;
    - pattern-not: |
        import $ALLOWED.*;
  message: |
    Package coupling violation detected. Restricted package '$PACKAGE' is used outside of allowed scope.
    Allowed classes: $ALLOWED_CLASSES
  fix: |
    Import only allowed classes from restricted packages
  languages:
    - java
  severity: WARNING
  metadata:
    category: design
    subcategory:
      - coupling
    cwe:
      - "CWE-1004: Sensitive Cookie Without 'HttpOnly' Flag" # Note: This might not be the most accurate CWE mapping
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    technology:
      - Java
    references:
      - https://pmd.github.io/pmd-6.55.0/pmd_rules_java_design.html#loosepackagecoupling
    custom:
      restricted_packages: ${{PACKAGES}}
      allowed_classes: ${{CLASSES}}
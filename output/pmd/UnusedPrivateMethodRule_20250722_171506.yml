rules:
- id: unused-private-method
  patterns:
  - pattern: |
      private $RETURN $NAME(...) { ... }
  - pattern-not: |
      @($ANNOT)
      private $RETURN $NAME(...) { ... }
  - pattern-not-inside: |
      private $RETURN $NAME(...) {
        $BODY
        $NAME(...);
        ...
      }
  - pattern-not: |
      private void readObject(...) { ... }
  - pattern-not: |
      private void readObjectNoData() { ... }
  - pattern-not: |
      private void writeObject(...) { ... }
  - pattern-not: |
      private Object readResolve() { ... }
  - pattern-not: |
      private Object writeReplace() { ... }
  - pattern-not: |
      @PostConstruct
      private $RETURN $NAME(...) { ... }
  - pattern-not: |
      @PreDestroy
      private $RETURN $NAME(...) { ... }
  - pattern-not: |
      @EqualsAndHashCode.Include
      private $RETURN $NAME(...) { ... }
  message: Private method '$NAME' is unused and can be safely removed
  languages:
  - java
  severity: WARNING
  metadata:
    category: best-practices
    subcategory:
    - dead-code
    cwe:
    - 'CWE-561: Dead Code'
    confidence: MEDIUM
    likelihood: HIGH
    impact: LOW
    owasp:
    - A9:2021 Security Logging and Monitoring Failures
    technology:
    - Java
    references:
    - https://cwe.mitre.org/data/definitions/561.html
rules:
- id: data-class
  patterns:
  - pattern: |
      class $CLASS {
        $FIELDS
        $METHODS
      }
  - metavariable-regex:
      metavariable: $FIELDS
      regex: 'public\s+\w+\s+\w+\s*;'
      times: 4
  - metavariable-regex:
      metavariable: $METHODS
      regex: 'public\s+\w+\s+get\w+\s*\(\)|public\s+\w+\s+set\w+\s*\(\w+\)'
      times: 5
  message: |
    This class appears to be a data class with too many accessors/public fields
    and insufficient complexity (WMC < 31/47). Consider refactoring.
  languages:
  - java
  severity: WARNING
  metadata:
    category: design
    subcategory:
    - maintainability
    cwe:
    - 'CWE-1041: Use of Low-Level Functionality'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: LOW
    owasp:
    - A3:2021-Injection
    technology:
    - Java
    references:
    - https://pmd.github.io/pmd-6.0.0/pmd_rules_java_design.html#dataclass
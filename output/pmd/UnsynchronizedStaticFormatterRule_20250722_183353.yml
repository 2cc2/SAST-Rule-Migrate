rules:
- id: unsynchronized-static-formatter
  message: Using a static Formatter (e.g. SimpleDateFormatter, DecimalFormatter) without synchronization in multi-threaded environment may cause unexpected results
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: |
      $TYPE $FIELD = ...;
  - pattern-not: org.apache.commons.lang3.time.FastDateFormat
  - pattern-inside: |
      class $CLASS {
        static {
          ...;
        }
        ...
      }
  - metavariable-regex:
      metavariable: $TYPE
      regex: "(java\\.text\\.Format|java\\.text\\.SimpleDateFormat|java\\.text\\.DecimalFormat)"
  - pattern-not-inside: |
      synchronized($FIELD) {
        ...
      }
  - pattern-not-inside: |
      synchronized void $METHOD(...) { ... }
  metadata:
    category: security
    subcategory:
    - thread-safety
    cwe:
    - 'CWE-362: Concurrent Execution using Shared Resource with Improper Synchronization'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    owasp:
    - A10:2021 Server-Side Request Forgery
    technology:
    - Java
    references:
    - https://cwe.mitre.org/data/definitions/362.html
rules:
- id: cognitive-complexity
  patterns:
  - pattern: |
      $METHOD (...)
      {
        ...
      }
  - metavariable-regex:
      metavariable: $METHOD
      regex: (method|constructor)
  - focus-metavariable: $METHOD
  message: Cognitive complexity of $METHOD is too high ({{cognitive}} >= {{reportLevel}})
  languages:
  - java
  severity: WARNING
  metadata:
    category: design
    subcategory:
    - complexity
    cwe:
    - 'CWE-1114: Inappropriate Cognitive Complexity'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    technology:
    - Java
    references:
    - https://pmd.github.io/pmd-6.23.0/pmd_rules_java_design_cognitivecomplexity.html
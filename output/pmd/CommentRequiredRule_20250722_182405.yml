rules:
- id: comment-required
  patterns:
  - pattern: |
      class $CLASS {
        ...
      }
  - pattern-not: |
      /**
       * $COMMENT
       */
      class $CLASS {
        ...
      }
  message: Class comments are required
  languages: [java]
  severity: WARNING

- id: field-comment-required
  patterns:
  - pattern: |
      $TYPE $FIELD;
  - pattern-not: |
      /**
       * $COMMENT
       */
      $TYPE $FIELD;
  message: Field comments are required
  languages: [java]
  severity: WARNING

- id: public-method-comment-required
  patterns:
  - pattern: |
      public $RETURN $METHOD(...) { ... }
  - pattern-not: |
      /**
       * $COMMENT
       */
      public $RETURN $METHOD(...) { ... }
  message: Public method comments are required
  languages: [java]
  severity: WARNING

- id: protected-method-comment-required
  patterns:
  - pattern: |
      protected $RETURN $METHOD(...) { ... }
  - pattern-not: |
      /**
       * $COMMENT
       */
      protected $RETURN $METHOD(...) { ... }
  message: Protected method comments are required
  languages: [java]
  severity: WARNING

- id: enum-comment-required
  patterns:
  - pattern: |
      enum $ENUM { ... }
  - pattern-not: |
      /**
       * $COMMENT
       */
      enum $ENUM { ... }
  message: Enum comments are required
  languages: [java]
  severity: WARNING

- id: serial-version-uid-comment-required
  patterns:
  - pattern: |
      private static final long serialVersionUID = $VAL;
  - pattern-not: |
      /**
       * $COMMENT
       */
      private static final long serialVersionUID = $VAL;
  message: serialVersionUID comments are required
  languages: [java]
  severity: WARNING

- id: serial-persistent-fields-comment-required
  patterns:
  - pattern: |
      private static final ObjectStreamField[] serialPersistentFields = $VAL;
  - pattern-not: |
      /**
       * $COMMENT
       */
      private static final ObjectStreamField[] serialPersistentFields = $VAL;
  message: serialPersistentFields comments are required
  languages: [java]
  severity: WARNING
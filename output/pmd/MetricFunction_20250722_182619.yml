rules:
- id: metric-function-check
  patterns:
  - pattern: |
      Optional<Double> $METRIC = Metric.compute($M, $N, MetricOptions.emptyOptions());
  - metavariable-regex:
      metavariable: $M
      regex: .*
  message: |
    The metric function computation may return null or NaN which should be properly handled.
  languages:
  - java
  severity: WARNING
  metadata:
    category: reliability
    subcategory:
    - error-handling
    cwe:
    - 'CWE-703: Improper Check or Handling of Exceptional Conditions'
    confidence: MEDIUM
    likelihood: LOW
    impact: MEDIUM
    technology:
    - Java
    references:
    - https://cwe.mitre.org/data/definitions/703.html
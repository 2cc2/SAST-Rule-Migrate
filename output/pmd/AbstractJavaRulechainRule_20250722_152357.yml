rules:
- id: abstract-java-rulechain-rule
  patterns:
  - pattern: |
      public abstract class $CLASS extends AbstractJavaRule {
        private final RuleTargetSelector selector;
        
        @SafeVarargs
        public $CLASS(Class<? extends JavaNode> $FIRST, Class<? extends JavaNode>... $VISITS) {
          selector = RuleTargetSelector.forTypes($FIRST, $VISITS);
        }
        
        @Override
        protected final @NonNull RuleTargetSelector buildTargetSelector() {
          return selector;
        }
        
        @Override
        public Object visitJavaNode(JavaNode $NODE, Object $DATA) {
          return $DATA;
        }
      }
  message: |
    Found an implementation of AbstractJavaRulechainRule. This is a base class for rules using the rulechain.
  languages:
  - java
  severity: INFO
  metadata:
    category: code-style
    technology:
    - Java
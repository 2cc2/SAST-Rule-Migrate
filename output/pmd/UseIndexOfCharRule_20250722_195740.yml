rules:
- id: use-index-of-char
  patterns:
  - pattern: |
      $OBJ.indexOf("$CHAR")
  - pattern: |
      $OBJ.lastIndexOf("$CHAR")
  message: |
    Using indexOf with a single-character string is less efficient than using indexOf with a char.
    Consider replacing with indexOf(char) for better performance.
  languages:
  - java
  severity: WARNING
  metadata:
    category: performance
    subcategory:
    - efficiency
    cwe:
    - 'CWE-610: Improper Restriction of XML External Entity Reference'
    confidence: HIGH
    likelihood: LOW
    impact: LOW
    technology:
    - Java
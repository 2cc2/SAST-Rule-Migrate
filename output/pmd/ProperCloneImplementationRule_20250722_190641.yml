rules:
- id: proper-clone-implementation
  patterns:
  - pattern: |
      class $CLASS {
          @Override
          Object clone() { 
             ... 
             new $CLASS(...);
             ... 
          } 
      }
  - pattern-not: final class $CLASS { ... }
  message: |
    Found improper clone() implementation. The class is not final and allocates
    instances of itself in the clone method, which may lead to issues with
    inheritance and proper cloning behavior.
  languages: [java]
  severity: WARNING
  metadata:
    category: correctness
    subcategory: error-prone
    cwe: "CWE-580: clone() Method Without super.clone()"
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
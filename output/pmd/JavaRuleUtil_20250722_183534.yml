rules:
- id: stringbuilder-ctor-or-append
  patterns:
    - pattern-either:
      - pattern: |
          $X.append(...)
      - pattern: |
          new StringBuilder(...)
      - pattern: |
          new StringBuffer(...)
  message: Potential string builder constructor or append call detected
  languages: [java]
  severity: WARNING
  metadata:
    category: style
    subcategory:
    - efficiency
    cwe:
    - 'CWE-710: Improper Adherence to Coding Standards'
    confidence: MEDIUM
    likelihood: LOW
    impact: LOW
    technology:
    - Java

- id: utility-class-detection
  patterns:
    - pattern: |
        class $C {
          static {
            ...
          }
          static $TYPE $FIELD;
          static $RET $METHOD(...) { ... }
        }
  message: Potential utility class detected (contains only static members)
  languages: [java]
  severity: WARNING
  metadata:
    category: style
    subcategory:
    - design
    confidence: MEDIUM
    likelihood: LOW
    impact: LOW
    technology:
    - Java

- id: lombok-annotation-detection
  patterns:
    - pattern: |
        @$ANN(...)
        class $C { ... }
    - metavariable-regex:
        metavariable: $ANN
        regex: "(lombok\\.Data|lombok\\.Getter|lombok\\.Setter|lombok\\.Value|lombok\\.RequiredArgsConstructor|lombok\\.AllArgsConstructor|lombok\\.NoArgsConstructor|lombok\\.Builder|lombok\\.EqualsAndHashCode|lombok\\.experimental\\.Delegate)"
  message: Lombok annotation detected
  languages: [java]
  severity: INFO
  metadata:
    category: style
    subcategory:
    - framework
    technology:
    - Java
    - Lombok

- id: getter-setter-detection
  patterns:
    - pattern-either:
      - pattern: |
          $RET get$CAP(...) { ... }
      - pattern: |
          $RET is$CAP(...) { ... }
      - pattern: |
          void set$CAP(...) { ... }
      - pattern: |
          $OBJ.get$CAP(...)
      - pattern: |
          $OBJ.is$CAP(...)
      - pattern: |
          $OBJ.set$CAP(...)
  message: Potential getter/setter method detected
  languages: [java]
  severity: INFO
  metadata:
    category: style
    subcategory:
    - design
    confidence: MEDIUM
    technology:
    - Java

- id: serialization-field-detection
  patterns:
    - pattern-either:
      - pattern: |
          private static final ObjectStreamField[] serialPersistentFields = ...;
      - pattern: |
          private static final long serialVersionUID = ...;
  message: Serialization-specific field detected
  languages: [java]
  severity: INFO
  metadata:
    category: correctness
    subcategory:
    - serialization
    confidence: HIGH
    technology:
    - Java
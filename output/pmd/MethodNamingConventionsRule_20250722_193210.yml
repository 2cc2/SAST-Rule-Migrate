rules:
- id: method-naming-conventions
  patterns:
  - pattern: |
      class $CLASS {
        $RETURN $METHOD(...) { ... }
      }
  - metavariable-regex:
      metavariable: $METHOD
      regex: (test[A-Z0-9][a-zA-Z0-9]*)
      regex-flags: DOTALL
  message: Method '$METHOD' does not follow naming conventions for JUnit 3 tests
  languages: [java]
  severity: WARNING
  metadata:
    category: style
    subcategory:
    - naming
    cwe:
    - 'CWE-178: Improper Handling of Case Sensitivity'
    confidence: MEDIUM
    likelihood: HIGH
    impact: LOW
    owasp:
    - A3:2017 Sensitive Data Exposure
    technology:
    - Java
    references:
    - https://pmd.github.io/latest/pmd_rules_java_codestyle.html#methodnamingconventions
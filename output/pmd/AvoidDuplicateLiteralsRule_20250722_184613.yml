rules:
- id: avoid-duplicate-literals
  patterns:
  - pattern: |
      $X = "..."
  - pattern-not: |
      $X = $IGNORED
  - metavariable-regex:
      metavariable: $X
      regex: '.{3,}'
  - pattern-not-inside: |
      @$ANN(...)
  message: Found duplicate string literals (threshold exceeded)
  languages:
  - java
  severity: WARNING
  metadata:
    category: error-prone
    subcategory:
    - maintainability
    cwe:
    - 'CWE-1164: Irrelevant Code'
    confidence: MEDIUM
    likelihood: LOW
    impact: LOW
    references:
    - https://pmd.github.io/latest/pmd_rules_java_errorprone.html#avoidduplicateliterals
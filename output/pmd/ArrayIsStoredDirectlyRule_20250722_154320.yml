# 转换后的 Semgrep 规则
rules:
- id: array-stored-directly
  message: If a method or constructor receives an array as an argument, the array should be cloned instead of directly stored. This prevents future changes from the user from affecting the original array.
  severity: WARNING
  languages:
  - java
  patterns:
  - pattern-either:
    - pattern: |
        public $RET $METHOD(..., $TYPE[] $PARAMVAR, ...) {
          ...;
          this.$FIELD = $PARAMVAR;
          ...;
        }
    - pattern: |
        protected $RET $METHOD(..., $TYPE[] $PARAMVAR, ...) {
          ...;
          this.$FIELD = $PARAMVAR;
          ...;
        }
  - pattern-not-inside: |
      private $TYPE $METHOD(...) { ... }
  metadata:
    category: security
    subcategory:
    - vuln
    cwe:
    - 'CWE-374: Passing Mutable Objects to an Untrusted Method'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    owasp:
    - A8:2017 Insecure Deserialization
    technology:
    - Java
    references:
    - https://cwe.mitre.org/data/definitions/374.html
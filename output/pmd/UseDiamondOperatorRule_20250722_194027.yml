rules:
- id: use-diamond-operator
  message: "Explicit type arguments can be replaced by a diamond"
  languages: [java]
  severity: WARNING
  patterns:
  - pattern: "new $TYPE<$PARAMS>()"
  - pattern-not: "new $TYPE<>()"
  metadata:
    category: "style"
    subcategory: ["efficiency"]
    cwe: ["CWE-398: Indicator of Poor Code Quality"]
    owasp:
    - "A1:2021-Broken Access Control"
    references:
    - "https://docs.oracle.com/javase/7/docs/technotes/guides/language/type-inference-generic-instance-creation.html"
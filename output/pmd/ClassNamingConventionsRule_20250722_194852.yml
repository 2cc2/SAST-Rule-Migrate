# 转换后的 Semgrep 规则
rules:
- id: class-naming-conventions
  patterns:
    - pattern: |
        class $CLASS { ... }
    - pattern-not: class $TEST_CLASS { ... }
    - metavariable-regex:
        metavariable: $CLASS
        regex: "^[A-Z][a-zA-Z0-9]*$"
  message: Class name should follow PascalCase convention
  languages:
    - java
  severity: WARNING
  metadata:
    category: style
    owasp:
      - A3:2017-Sensitive Data Exposure
    cwe:
      - CWE-1091: Use of Inadequately Resolved Name or Reference
    technology:
      - java

- id: abstract-class-naming-conventions
  patterns:
    - pattern: |
        abstract class $ABSTRACT_CLASS { ... }
    - metavariable-regex:
        metavariable: $ABSTRACT_CLASS
        regex: "^Abstract[A-Z][a-zA-Z0-9]*$"
  message: Abstract class name should start with 'Abstract' and follow PascalCase
  languages:
    - java
  severity: WARNING
  metadata:
    category: style
    owasp:
      - A3:2017-Sensitive Data Exposure
    cwe:
      - CWE-1091: Use of Inadequately Resolved Name or Reference
    technology:
      - java

- id: interface-naming-conventions
  patterns:
    - pattern: |
        interface $INTERFACE { ... }
    - metavariable-regex:
        metavariable: $INTERFACE
        regex: "^[A-Z][a-zA-Z0-9]*$"
  message: Interface name should follow PascalCase convention
  languages:
    - java
  severity: WARNING
  metadata:
    category: style
    owasp:
      - A3:2017-Sensitive Data Exposure
    cwe:
      - CWE-1091: Use of Inadequately Resolved Name or Reference
    technology:
      - java

- id: enum-naming-conventions
  patterns:
    - pattern: |
        enum $ENUM { ... }
    - metavariable-regex:
        metavariable: $ENUM
        regex: "^[A-Z][a-zA-Z0-9]*$"
  message: Enum name should follow PascalCase convention
  languages:
    - java
  severity: WARNING
  metadata:
    category: style
    owasp:
      - A3:2017-Sensitive Data Exposure
    cwe:
      - CWE-1091: Use of Inadequately Resolved Name or Reference
    technology:
      - java

- id: test-class-naming-conventions
  patterns:
    - pattern: |
        @Test
        class $TEST_CLASS { ... }
    - metavariable-regex:
        metavariable: $TEST_CLASS
        regex: "^Test.*$|^[A-Z][a-zA-Z0-9]*Test(s|Case)?$"
  message: Test class name should follow standard test naming convention
  languages:
    - java
  severity: WARNING
  metadata:
    category: style
    owasp:
      - A3:2017-Sensitive Data Exposure
    cwe:
      - CWE-1091: Use of Inadequately Resolved Name or Reference
    technology:
      - java
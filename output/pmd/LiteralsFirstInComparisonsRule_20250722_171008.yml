rules:
- id: literals-first-in-comparisons
  message: |
    Literal strings should be placed first in string comparisons to avoid NullPointerException.
  languages:
  - java
  patterns:
  - pattern-either:
    - pattern: |
        $OBJ.equals($ARG)
    - pattern: |
        $OBJ.equalsIgnoreCase($ARG)
    - pattern: |
        $OBJ.compareTo($ARG)
    - pattern: |
        $OBJ.compareToIgnoreCase($ARG)
    - pattern: |
        $OBJ.contentEquals($ARG)
  - pattern-not: '"..." == $OBJ || "...".equals($OBJ) || ...'
  - metavariable-regex:
      metavariable: $OBJ
      regex: ^(?!(".*"|null)).*$
  - metavariable-regex:
      metavariable: $ARG
      regex: ^".*"$
  severity: WARNING
  metadata:
    category: best-practices
    cwe: "CWE-476: NULL Pointer Dereference"
    owasp:
    - A10:2021 - Server-Side Request Forgery
    references:
    - https://rules.sonarsource.com/java/RSPEC-1132
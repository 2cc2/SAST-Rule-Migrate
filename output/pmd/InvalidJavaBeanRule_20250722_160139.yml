rules:
- id: invalid-java-bean
  patterns:
  - pattern: |
      class $CLASS {
        ...
      }
  - metavariable-regex:
      metavariable: $CLASS
      regex: ^[A-Z][a-zA-Z0-9]*$
  - pattern-not: |
      @Data
      class $CLASS {
        ...
      }
  - pattern-not-inside: |
      import lombok.*;
      ...
  message: |
    The Java Bean '${CLASS}' has the following issues:
    - Missing no-arg constructor
    - Missing getters/setters for properties
    - Type mismatches in getters/setters
    - Boolean property getter naming issues
  fix: |
    // Add missing Java Bean requirements
  languages:
  - java
  severity: WARNING
  metadata:
    category: design
    subcategory:
    - java-beans
    cwe:
    - 'CWE-398: Indicator of Poor Code Quality'
    confidence: MEDIUM
    owasp:
    - A3:2021 Injection
    technology:
    - Java
    references:
    - https://www.oracle.com/java/technologies/javase/javabeans-spec.html
rules:
- id: unit-test-assertions-should-include-message
  patterns:
  - pattern-inside: |
      @Test
      public void $M(...) { ... }
  - pattern-either:
    - pattern: $ASSERT.assertEquals($ARG1, $ARG2)
    - pattern: $ASSERT.assertTrue($ARG)
    - pattern: $ASSERT.assertFalse($ARG)
    - pattern: $ASSERT.assertSame($ARG1, $ARG2)
    - pattern: $ASSERT.assertNotSame($ARG1, $ARG2)
    - pattern: $ASSERT.assertNull($ARG)
    - pattern: $ASSERT.assertNotNull($ARG)
    - pattern: $ASSERT.assertArrayEquals($ARG1, $ARG2)
    - pattern: $ASSERT.assertThat($ARG1, $ARG2)
    - pattern: $ASSERT.fail()
    - pattern: $ASSERT.assertEquals($FLOAT1, $FLOAT2, $DELTA)
  message: Unit test assertions should include a message parameter for better error reporting
  languages: [java]
  severity: WARNING
  metadata:
    category: best-practice
    subcategory: testing
    cwe:
    - "CWE-209: Information Exposure Through an Error Message"
    references:
    - https://rules.sonarsource.com/java/tag/spring/RSPEC-3415
    - https://junit.org/junit4/javadoc/latest/org/junit/Assert.html
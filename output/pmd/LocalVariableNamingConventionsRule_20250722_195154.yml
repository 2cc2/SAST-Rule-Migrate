rules:
- id: local-variable-naming-convention
  patterns:
    - pattern: |
        $TYPE $VAR;
    - metavariable-pattern:
        metavariable: $VAR
        patterns:
          - pattern-not: "_isUnnamed_()"
          - pattern-either:
              - patterns:
                  - pattern: "_isExceptionBlockParameter_()"
                  - metavariable-regex:
                      metavariable: "_getName_()"
                      regex: $EXCEPTION_REGEX
              - patterns:
                  - pattern: "_isLocalVariable_()"
                  - pattern-either:
                      - patterns:
                          - pattern: "_isFinal_()"
                          - metavariable-regex:
                              metavariable: "_getName_()"
                              regex: $FINAL_REGEX
                      - patterns:
                          - pattern-not: "_isFinal_()"
                          - metavariable-regex:
                              metavariable: "_getName_()"
                              regex: $LOCAL_REGEX
  message: Local variable naming convention violation
  languages:
    - java
  severity: WARNING
  options:
    localVarRegex: ^[a-z][a-zA-Z0-9]*$
    finalVarRegex: ^[a-z][a-zA-Z0-9]*$
    exceptionBlockParameterRegex: ^[a-z][a-zA-Z0-9]*$
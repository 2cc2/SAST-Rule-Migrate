rules:
- id: exception-as-flow-control
  patterns:
  - pattern-inside: |
      try {
        ...;
        $THROW new $EXCEPTION(...);
        ...;
      } catch ($TYPE $VAR) {
        ...;
      }
  - pattern-not: |
      try {
        ...;
      } catch ($TYPE $VAR) {
        throw $VAR;
      }
  - metavariable-regex:
      metavariable: $EXCEPTION
      regex: .*Exception
  message: Using exceptions as flow control is not recommended. Consider refactoring the logic to avoid this pattern.
  languages: [java]
  severity: WARNING
  metadata:
    category: design
    subcategory: error-handling
    cwe: "CWE-248: Uncaught Exception"
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: LOW
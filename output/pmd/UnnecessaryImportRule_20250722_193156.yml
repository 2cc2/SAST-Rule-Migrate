rules:
- id: unnecessary-import
  languages:
  - java
  message: Unnecessary import found
  severity: WARNING
  patterns:
  - pattern-either:
    - pattern: import $TYPE;
    - pattern: import static $TYPE;
  - pattern-not-regex: |
      /\*\*
       .*\{
       @link \$TYPE
       .*\*/
  - pattern-not-regex: |
      /\*\*
       .*@see \$TYPE
       .*\*/
  - pattern-not: import java.lang.$TYPE;
  - pattern: import $PKG.$TYPE;
  - metavariable-regex:
      metavariable: $PKG
      regex: ^(.*\.)?(same|current)package$
      negation: true
  metadata:
    category: code-style
    subcategory:
    - efficiency
    cwe:
    - 'CWE-561: Dead Code'
    confidence: MEDIUM
    likelihood: HIGH
    impact: LOW
    owasp:
    - A9:2021 Security Logging and Monitoring Failures
    technology:
    - Java
    references:
    - https://cwe.mitre.org/data/definitions/561.html
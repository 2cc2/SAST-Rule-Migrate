rules:
- id: double-checked-locking
  patterns:
    - pattern: |
        synchronized ($THIS) {
          if ($VAR == null) {
            $VAR = $INIT;
          }
        }
    - pattern-not: |
        if ($VAR == null) {
          synchronized ($THIS) {
            if ($VAR == null) {
              $VAR = $INIT;
            }
          }
        }
  message: Potential double-checked locking pattern detected. This pattern is unsafe and may lead to inconsistent object state due to improper synchronization. Correct implementation should check null twice with synchronization in between.
  languages:
    - java
  severity: WARNING
  metadata:
    category: multithreading
    subcategory:
      - concurrency
    cwe:
      - 'CWE-609: Double-Checked Locking'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    owasp:
      - A10:2021 - Server-Side Request Forgery
    technology:
      - Java
    references:
      - https://www.cs.umd.edu/~pugh/java/memoryModel/DoubleCheckedLocking.html
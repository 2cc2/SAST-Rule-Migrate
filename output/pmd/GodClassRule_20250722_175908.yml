rules:
- id: god-class
  patterns:
    - pattern: |
        class $CLASS {
          ...
        }
    - metavariable-regex:
        metavariable: $CLASS
        regex: (?s).*
  message: |
    The class $CLASS appears to be a 'God Class' design flaw. It has very high Weighted Method Count (WMC >= 47),
    accesses too much foreign data (ATFD > 5), and has low tight class cohesion (TCC < 1/3). Consider splitting this
    class into smaller, more focused classes.
  languages:
    - java
  severity: WARNING
  metadata:
    category: design
    subcategory:
      - complexity
    cwe:
      - 'CWE-1006: Bad Coding Practices'
    references:
      - 'Lanza. Object-Oriented Metrics in Practice. Page 80.'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
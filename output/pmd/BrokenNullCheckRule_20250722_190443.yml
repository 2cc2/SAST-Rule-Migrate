rules:
- id: broken-null-check
  patterns:
    - pattern-either:
      - pattern: |
          ($X == null || ...) && $Y
      - pattern: |
          ($X != null && ...) || $Y
    - focus-metavariable: $Y
  message: |
    Potential broken null check detected. Dereferencing or unboxing this operand may throw a NullPointerException:
    - If dereferencing: 'Dereferencing the qualifier of this expression will throw a NullPointerException'
    - If unboxing: 'Unboxing this operand will throw a NullPointerException'
  languages:
    - java
  severity: WARNING
  metadata:
    category: correctness
    subcategory:
      - error-prone
    cwe:
      - 'CWE-476: NULL Pointer Dereference'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    technology:
      - Java
    references:
      - https://cwe.mitre.org/data/definitions/476.html
rules:
- id: check-skip-result
  message: The result of InputStream.skip() should be checked as it may not skip the requested number of bytes.
  languages:
  - java
  severity: WARNING
  pattern: |
    $X.skip($ARG);
  pattern-not: |
    $TYPE $VAR = $X.skip($ARG);
  metadata:
    category: security
    cwe: "CWE-252: Unchecked Return Value"
    references:
    - https://cwe.mitre.org/data/definitions/252.html
    owasp:
    - A6:2017-Security Misconfiguration
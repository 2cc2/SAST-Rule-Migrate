rules:
- id: big-integer-instantiation
  patterns:
  - pattern: |
      new $TYPE($ARG)
  - metavariable-regex:
      metavariable: $TYPE
      regex: (BigInteger|BigDecimal)
  - metavariable-regex:
      metavariable: $ARG
      regex: "(0|0\\.|1|10|2)"
  message: |
    Use of well-known constants (like BigInteger.ZERO or BigDecimal.ONE) is preferred over instantiation with primitive values.
    Consider replacing with the appropriate constant for better performance and clarity.
  languages:
  - java
  severity: WARNING
  metadata:
    category: performance
    subcategory:
    - best-practice
    cwe:
    - 'CWE-1048: Use of Inefficient Data Structure'
    references:
    - https://rules.sonarsource.com/java/RSPEC-2111
rules:
- id: unnecessary-fully-qualified-name
  patterns:
  - pattern: |
      $TYPE.$MEMBER(...)
  - pattern-not: |
      import $PACKAGE.$TYPE
  - pattern-not: |
      $TYPE.$MEMBER = $VAL
  message: Unnecessary fully qualified name '$TYPE.$MEMBER' can be replaced with simple name '$MEMBER'
  languages:
  - java
  severity: WARNING
  metadata:
    category: style
    subcategory: clarity
    cwe: "CWE-710: Improper Adherence to Coding Standards"
    confidence: MEDIUM
    likelihood: LOW
    impact: LOW
    references:
    - https://pmd.github.io/latest/pmd_rules_java_codestyle.html#unnecessaryfullyqualifiedname
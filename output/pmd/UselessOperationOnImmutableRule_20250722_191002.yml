rules:
- id: useless-operation-on-immutable
  patterns:
  - pattern: |
      ($QUALIFIER).$METHOD(...)
  - pattern-not-inside: |
      $_ = ($QUALIFIER).$METHOD(...);
  - metavariable-regex:
      metavariable: "$QUALIFIER"
      regex: (String|BigDecimal|BigInteger|Temporal|Duration|Period)
  - metavariable-regex:
      metavariable: "$METHOD"
      regex: (?!getChars).*
  message: >-
    An operation on an Immutable object (String, BigDecimal, BigInteger, Temporal,
    Duration or Period) won't change the object itself. The result of the operation is a new object.
    Therefore, ignoring the operation result is an error.
  languages:
  - java
  severity: WARNING
  metadata:
    category: correctness
    subcategory:
    - errorprone
    cwe:
    - 'CWE-116: Improper Encoding or Escaping of Output'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    technology:
    - Java
rules:
- id: unnecessary-modifier
  patterns:
    - pattern: |
        enum $ENUM {
          ...
        }
    - pattern-inside: |
        public enum $ENUM { ... }
  message: "Unnecessary modifier 'public' for enum declaration (enums are implicitly public)"
  languages: [java]
  severity: WARNING

- id: unnecessary-static-modifier
  patterns:
    - pattern: |
        enum $ENUM {
          ...
        }
    - pattern-inside: |
        static enum $ENUM { ... }
  message: "Unnecessary modifier 'static' for nested enum declaration (nested enums are implicitly static)"
  languages: [java]
  severity: WARNING

- id: unnecessary-abstract-modifier
  patterns:
    - pattern: |
        @interface $ANNOTATION {
          ...
        }
    - pattern-inside: |
        abstract @interface $ANNOTATION { ... }
  message: "Unnecessary modifier 'abstract' for annotation type (annotation types are implicitly abstract)"
  languages: [java]
  severity: WARNING

- id: interface-implicit-abstract
  patterns:
    - pattern: |
        interface $INTERFACE {
          ...
        }
    - pattern-inside: |
        abstract interface $INTERFACE { ... }
  message: "Unnecessary modifier 'abstract' for interface (interfaces are implicitly abstract)"
  languages: [java]
  severity: WARNING

- id: unnecessary-private-constructor
  patterns:
    - pattern: |
        enum $ENUM {
          private $ENUM() { ... }
          ...
        }
  message: "Unnecessary modifier 'private' for enum constructor (enum constructors are implicitly private)"
  languages: [java]
  severity: WARNING

- id: unnecessary-final-resource
  patterns:
    - pattern: |
        try ($TYPE $VAR = ...) { ... }
    - pattern-inside: |
        try (final $TYPE $VAR = ...) { ... }
  message: "Unnecessary modifier 'final' for resource specification (resources are implicitly final)"
  languages: [java]
  severity: WARNING
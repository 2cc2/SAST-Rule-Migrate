rules:
- id: inefficient-empty-string-check
  patterns:
  - pattern: |
      $X.trim().length() == 0
  - pattern: |
      $X.trim().isEmpty()
  message: >-
    Inefficient empty string check using trim() creates unnecessary string objects.
    Consider using a loop to check for whitespace or utility methods like
    StringUtils.isBlank() from Apache Commons, StringUtils.hasText() from Spring,
    or CharMatcher.whitespace() from Guava.
  languages:
  - java
  severity: WARNING
  metadata:
    category: performance
    subcategory:
    - efficiency
    cwe:
    - 'CWE-816: Use of Deprecated or Obsolete Functions'
    confidence: HIGH
    likelihood: MEDIUM
    impact: MEDIUM
    technology:
    - Java
    references:
    - https://pmd.github.io/latest/pmd_rules_java_performance.html#inefficientemptystringcheck
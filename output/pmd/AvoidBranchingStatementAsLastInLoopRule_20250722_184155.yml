rules:
- id: avoid-branching-statement-as-last-in-loop
  patterns:
  - pattern-not-inside: |
      switch($EXPR) {
        case $CASE:
          ...
          $BRANCH;
          ...
      }
  - pattern-either:
    - pattern: |
        for (...; ...; ...) {
          ...
          $BRANCH;
        }
    - pattern: |
        for ($TYPE $VAR : $EXPR) {
          ...
          $BRANCH;
        }
    - pattern: |
        while (...) {
          ...
          $BRANCH;
        }
    - pattern: |
        do {
          ...
          $BRANCH;
        } while (...);
  - metavariable-regex:
      metavariable: $BRANCH
      regex: (break|continue|return)
  message: Avoid using branching statements (break, continue, return) as the last statement in a loop
  languages:
  - java
  severity: WARNING
  metadata:
    category: error-prone
    subcategory:
    - control-flow
    cwe:
    - 'CWE-670: Always-Incorrect Control Flow Implementation'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: LOW
    technology:
    - Java
rules:
- id: accessor-class-generation
  message: Detected potentially problematic constructor access - may violate access control
  patterns:
    - pattern-not: new $T() { ... }
    - pattern-either:
      - pattern: new $TYPE(...)
      - pattern: $THIS(...)
      - pattern: super(...)
  fix: Consider reviewing constructor access modifiers
  languages:
    - java
  severity: WARNING
  metadata:
    category: security
    subcategory:
      - access-control
    cwe:
      - 'CWE-493: Critical Public Variable Without Final Modifier'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    owasp:
      - A01:2021 - Broken Access Control
    technology:
      - Java
    references:
      - https://cwe.mitre.org/data/definitions/493.html
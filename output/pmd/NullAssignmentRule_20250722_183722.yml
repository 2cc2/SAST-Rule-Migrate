rules:
- id: null-assignment
  patterns:
    - pattern: |
        $X = null;
    - pattern-not: |
        final $TYPE $Y = null;
    - pattern-not-inside: |
        $X = $COND ? ... : ...;
  message: Assigning null to a non-final variable may lead to NullPointerException
  languages: 
    - java
  severity: WARNING
  metadata:
    category: error-prone
    cwe:
      - "CWE-476: NULL Pointer Dereference"
    technology:
      - java
rules:
- id: primitive-wrapper-instantiation
  languages:
    - java
  message: |
    Do not use primitive wrapper constructors or Boolean.valueOf with literal values, 
    prefer Boolean.TRUE/FALSE or valueOf for other cases.
  patterns:
    - pattern-either:
      - pattern: new Boolean($ARG)
      - pattern: Boolean.valueOf($ARG)
  fix-regex:
    regex: 'new Boolean\((.*)\)|Boolean\.valueOf\((.*)\)'
    replacement: |
      $1.equals("true") ? Boolean.TRUE : 
      $1.equals("false") ? Boolean.FALSE : 
      Boolean.valueOf($1)
  severity: WARNING
  metadata:
    category: best-practices
    cwe:
      - "CWE-582: Array Declared Public, Final, and Static"
    owasp:
      - "A9: Using Components with Known Vulnerabilities"
    references:
      - "https://rules.sonarsource.com/java/RSPEC-2131"
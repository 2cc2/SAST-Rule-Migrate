rules:
- id: ncss-count-exceeded
  patterns:
  - pattern: |
      $TYPE_DECLARATION {
        ...
      }
  - pattern: |
      $METHOD_DECLARATION {
        ...
      }
  message: >
    NCSS count exceeded - Type: $TYPE_DECLARATION has $NCSS_SIZE NCSS (highest method: $HIGHEST).
    Method: $METHOD_DECLARATION has $METHOD_SIZE NCSS.
  languages:
  - java
  severity: WARNING
  metadata:
    category: design
    subcategory:
    - complexity
    cwe:
    - 'CWE-398: Indicator of Poor Code Quality'
    confidence: HIGH
    likelihood: MEDIUM
    impact: MEDIUM
    technology:
    - Java
    references:
    - https://pmd.github.io/latest/pmd_rules_java_design.html#ncsscount
    custom:
      method-report-level: 60
      class-report-level: 1500
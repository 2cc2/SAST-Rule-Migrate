rules:
- id: unit-test-should-include-assert
  patterns:
  - pattern-inside: |
      @Test
      public $RET $METHOD(...) {
        ...
      }
  - pattern-not: |
      @Test
      public $RET $METHOD(...) {
        ...
        $ASSERT_METHOD(...);
        ...
      }
  - pattern-not: |
      @Test
      public $RET $METHOD(...) {
        ...
        assertEquals(...);
        ...
      }
  - pattern-not: |
      @Test
      public $RET $METHOD(...) {
        ...
        assertTrue(...);
        ...
      }
  - pattern-not: |
      @Test
      public $RET $METHOD(...) {
        ...
        assertFalse(...);
        ...
      }
  - pattern-not: |
      @Test
      public $RET $METHOD(...) {
        ...
        assertThat(...);
        ...
      }
  - metavariable-regex:
      metavariable: $METHOD
      regex: (?i)test.*
  message: Unit test methods should include at least one assertion
  languages:
  - java
  severity: WARNING
  metadata:
    category: best-practice
    subcategory:
    - testing
    cwe:
    - 'CWE-489: Active Debug Code'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    owasp:
    - A03:2021 - Injection
    technology:
    - JUnit
    references:
    - https://cwe.mitre.org/data/definitions/489.html
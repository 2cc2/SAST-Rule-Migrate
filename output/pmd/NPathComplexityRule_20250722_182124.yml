rules:
- id: npath-complexity
  patterns:
  - pattern: |
      $METHOD(...) {
          ...
      }
  - metavariable-comparison:
      metavariable: $METHOD
      comparison: MetricsUtil.computeMetric(JavaMetrics.NPATH_COMP, $METHOD) >= 200
  message: "N-Path Complexity is too high (%s). Method/constructor '%s' has NPath complexity of %s, which exceeds the threshold of %s."
  languages:
  - java
  severity: WARNING
  metadata:
    category: design
    subcategory:
    - complexity
    cwe:
    - 'CWE-1115: Source Code Element without Standardized Whitespace'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    technology:
    - Java
    references:
    - https://sourceforge.net/p/pmd/discussion/188192/thread/1d24dfc4/
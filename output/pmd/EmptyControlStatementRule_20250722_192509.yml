# 转换后的 Semgrep 规则
rules:
- id: empty-finally-statement
  patterns:
    - pattern: |
        finally {
          $...BODY
        }
    - metavariable-pattern:
        metavariable: $...BODY
        pattern: ""
    - pattern-not-inside: |
        finally {
          // $ANY
          ...          
        }
  message: Empty finally statement
  languages: [java]
  severity: WARNING
  options:
    allow_commented_blocks: false
  metadata:
    category: code-style
    cwe: "CWE-1071: Empty Code Block"

- id: empty-synchronized-statement
  patterns:
    - pattern: |
        synchronized (...) {
          $...BODY
        }
    - metavariable-pattern:
        metavariable: $...BODY
        pattern: ""
    - pattern-not-inside: |
        synchronized (...) {
          // $ANY
          ...          
        }
  message: Empty synchronized statement
  languages: [java]
  severity: WARNING
  options:
    allow_commented_blocks: false
  metadata:
    category: code-style
    cwe: "CWE-1071: Empty Code Block"

- id: empty-switch-statement
  pattern: |
    switch (...) {
    }
  message: Empty switch statement
  languages: [java]
  severity: WARNING
  metadata:
    category: code-style
    cwe: "CWE-1071: Empty Code Block"

- id: empty-nested-block
  patterns:
    - pattern: |
        {
          {
            $...BODY
          }
        }
    - metavariable-pattern:
        metavariable: $...BODY
        pattern: ""
    - pattern-not-inside: |
        {
          {
            // $ANY
            ...          
          }
        }
  message: Empty nested block
  languages: [java]
  severity: WARNING
  options:
    allow_commented_blocks: false
  metadata:
    category: code-style
    cwe: "CWE-1071: Empty Code Block"

- id: empty-try-statement
  patterns:
    - pattern: |
        try {
          $...BODY
        }
    - metavariable-pattern:
        metavariable: $...BODY
        pattern: ""
    - pattern-not-inside: |
        try {
          // $ANY
          ...          
        }
  message: Empty try statement
  languages: [java]
  severity: WARNING
  options:
    allow_commented_blocks: false
  metadata:
    category: code-style
    cwe: "CWE-1071: Empty Code Block"
rules:
- id: confusing-varargs-method-call
  patterns:
  - pattern-inside: |
      $OBJ.$METHOD(..., $LAST_ARG)
  - pattern: |
      $LAST_ARG
  - metavariable-pattern:
      metavariable: $LAST_ARG
      patterns:
      - pattern-not: ($TYPE) $_
      - pattern-not: new $TYPE[] {...}
  - pattern-either:
    - pattern-inside: |
        class $C {
          void $M(..., $T... $ARG) { ... }
        }
    - pattern-inside: |
        class $C {
          static void $M(..., $T... $ARG) { ... }
        }
  message: >
    Unclear if a varargs or non-varargs call is intended. Cast to %s or %s[],
    or pass varargs parameters separately to clarify intent.
  languages:
  - java
  severity: WARNING
  metadata:
    category: error-prone
    subcategory:
    - correctness
    cwe:
    - 'CWE-628: Function Call with Incorrectly Specified Arguments'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: LOW
    technology:
    - Java
    references:
    - https://cwe.mitre.org/data/definitions/628.html
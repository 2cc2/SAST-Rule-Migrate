rules:
- id: string-instantiation
  message: Avoid unnecessary string instantiation with 'new String()' 
  patterns:
    - pattern: new String($ARG)
    - pattern-not: new String(new byte[] {...})
    - pattern-not: new String(new char[] {...})
  languages:
    - java
  severity: WARNING
  metadata:
    category: performance
    subcategory:
      - inefficient
    cwe:
      - "CWE-789: Memory Allocation with Excessive Size Value"
    confidence: MEDIUM
    likelihood: LOW
    impact: MEDIUM
    references:
      - https://pmd.github.io/pmd-6.55.0/pmd_rules_java_performance.html#stringinstantiation
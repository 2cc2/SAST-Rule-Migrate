rules:
- id: idempotent-operations
  patterns:
  - pattern: |
      $L = $L
  message: Detected idempotent operation (variable assigned to itself)
  languages:
  - java
  severity: WARNING
  metadata:
    category: error-prone
    subcategory:
    - correctness
    cwe:
    - 'CWE-670: Always-Incorrect Control Flow Implementation'
    confidence: MEDIUM
    likelihood: LOW
    impact: LOW
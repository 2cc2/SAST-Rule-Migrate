# 转换后的 Semgrep 规则
rules:
- id: dataflow-analysis
  patterns:
  - pattern-inside: |
      class $CLASS {
        ...
      }
  - pattern: |
      $VAR = $EXPR;
  message: Potential data flow issue found
  languages: [java]
  severity: WARNING
  metadata:
    category: security
    subcategory: [vuln]
    cwe: ["CWE-476: NULL Pointer Dereference"]
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    owasp: ["A9:2021 Security Logging and Monitoring Failures"]
    technology: [Java]
    references:
    - https://cwe.mitre.org/data/definitions/476.html
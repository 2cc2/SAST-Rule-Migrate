rules:
- id: unused-assignment
  patterns:
  - pattern: |
      $VAR = $EXPR
  - pattern-not: |
      $USAGE = $VAR
  message: "Assignment to variable '%s' is never used"
  languages:
  - java
  severity: WARNING
  metadata:
    category: best-practices
    subcategory:
    - unused
    cwe:
    - 'CWE-563: Assignment to Variable without Use'
    confidence: MEDIUM
    likelihood: HIGH
    impact: LOW
    owasp:
    - A9:2021 Security Logging and Monitoring Failures
    technology:
    - Java
    references:
    - https://cwe.mitre.org/data/definitions/563.html
rules:
- id: singular-field
  patterns:
  - pattern: |
      class $CLASS {
        ...
        private $TYPE $FIELD;
        ...
      }
  - pattern-not: |
      class $CLASS {
        ...
        private final $TYPE $FIELD;
        ...
      }
  - pattern-not-inside: |
      @$ANNOTATION1
      class $CLASS { 
        ... 
      }
  - pattern-not-inside: |
      @$ANNOTATION2
      private $TYPE $FIELD;
  - metavariable-regex:
      metavariable: $ANNOTATION1
      regex: (lombok\.Builder|lombok\.EqualsAndHashCode|lombok\.Data|lombok\.Value)
  - metavariable-regex:
      metavariable: $ANNOTATION2
      regex: (lombok\.Setter|lombok\.Getter|java\.lang\.Deprecated|lombok\.experimental\.Delegate|javafx\.fxml\.FXML)
  - pattern-not: $THIS.$FIELD
  message: |
    Field $FIELD may be converted to a local variable as it's only written to before any read in each method.
    Consider making it a local variable to reduce class complexity.
  languages:
  - java
  severity: WARNING
  metadata:
    category: design
    subcategory:
    - efficiency
    cwe:
    - 'CWE-1110: Incomplete Design Documentation'
    confidence: MEDIUM
    likelihood: LOW
    impact: LOW
    technology:
    - Java
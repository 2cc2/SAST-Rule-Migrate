# 转换后的 Semgrep 规则
rules:
- id: python.cookie-injection
  languages: [python]
  severity: WARNING
  message: Cookie is constructed from user-supplied input
  metadata:
    cwe: "CWE-020: Improper Input Validation"
    category: security
    confidence: HIGH
    likelihood: MEDIUM
    impact: HIGH
  mode: taint
  pattern-sources:
  - patterns:
    - pattern: $COOKIE = $USER_INPUT
    - metavariable-regex:
        metavariable: $USER_INPUT
        regex: (request|cookie|input|param)
  pattern-sinks:
  - patterns:
    - pattern: response.set_cookie($COOKIE)
  fix: Use proper cookie validation and sanitization
rules:
- id: cookie-injection
  message: Constructing cookies from user input may allow an attacker to perform a Cookie Poisoning attack.
  languages: [java]
  severity: WARNING
  patterns:
    - pattern: $COOKIE.setValue($SOURCE)
    - metavariable-regex:
        metavariable: $SOURCE
        regex: (user.?input|request)
  metadata:
    cwe: "CWE-020"
    owasp: "A01:2021 - Broken Access Control"
    references:
      - https://owasp.org/www-community/attacks/Cookie_Poisoning
rules:
- id: cookie-injection
  languages: [python]
  severity: WARNING
  message: Constructing cookies from user input may allow an attacker to perform a Cookie Poisoning attack.
  metadata:
    owasp:
      - A01:2017 - Injection
    cwe: "CWE-020: Improper Input Validation"
    category: security
    technology:
      - web
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
  mode: taint
  pattern-sources:
    - patterns:
      - pattern-either:
        - pattern: request.cookies.get(...)
        - pattern: request.get_cookie(...)
  pattern-sinks:
    - patterns:
      - pattern-either:
        - pattern: response.set_cookie(...)
        - pattern: response.cookies.set(...)
        - pattern: HttpResponse.set_cookie(...)
  pattern-sanitizers:
    - patterns:
      - pattern-either:
        - pattern: sanitize(...)
        - pattern: escape(...)
        - pattern: validate(...)
sources:
- id: FLASK_USER_INPUT
  match:
    node: CALL
    api:
      type: flask.request
      methods:
      - form.get
      - form[]
      - args.get
      - args[]
      - values.get
      - values[]
      - cookies.get
      - cookies[]
      - stream
      - headers.get
      - headers[]
      - data
      - full_path
      - url
      - json
      - get_json
      - view_args.get
      - view_args[]
- id: ROUTE_PARAM_INPUT
  match:
    node: PARAM
    where:
    - op: inside
      left: context
      right: "@$APP.route(...)\ndef $FUNC(...):\n  ..."

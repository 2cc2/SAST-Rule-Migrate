sources:
- id: FLASK_REQUEST_INPUT
  match:
    node: CALL
    api:
      type: flask.request
      methods:
      - args
      - args.get
      - cookies
      - cookies.get
      - data
      - form
      - form.get
      - full_path
      - get_json
      - headers
      - headers.get
      - json
      - stream
      - url
      - values
      - values.get
      - view_args
      - view_args.get
- id: ROUTE_PARAM_INPUT
  match:
    node: PARAM
    pattern-inside: "@$APP.route(...)\ndef $FUNC(..., $ROUTEVAR, ...):\n  ..."

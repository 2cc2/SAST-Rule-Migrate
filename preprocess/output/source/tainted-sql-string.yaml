sources:
- id: FLASK_USER_INPUT
  match:
    node: CALL
    api:
      type: flask.request
      method: $ANYTHING
- id: ROUTE_PARAM_INPUT
  match:
    node: PARAM
    where:
    - op: pattern-inside
      left: annotation
      right: '@$APP.route(...)'
    - op: pattern-inside
      left: function
      right: 'def $FUNC(..., $ROUTEVAR, ...):'

xcpgir_version: '1.0'
rule:
  id: response-contains-unsanitized-input
  kind: taint
  severity: WARNING
  message: Flask response reflects unsanitized user input. This could lead to a cross-site
    scripting vulnerability.
  scope:
    languages:
    - python
    frameworks:
    - flask
sources:
- id: FLASK_REQUEST_ARGS
  match:
    node: CALL
    api:
      type: flask.request
      method: args.get
sinks:
- id: FLASK_RESPONSE
  match:
    node: CALL
    api:
      type: flask
      method: make_response
    arg_index: 0
  where:
  - op: regex
    left: arg[0].value
    right: .*\$?\{?\$X\}?.*
propagations:
- id: VALUE_ASSIGNMENT
  edge: arg->param | assignment
  kind: taint
flows:
- source: FLASK_REQUEST_ARGS
  sink: FLASK_RESPONSE
  through:
  - VALUE_ASSIGNMENT*
  constraints:
    path:
      must_not:
      - pattern: CALL(flask.escape)
report:
  message: User input reaches Flask response without sanitization (XSS risk)
  locations:
  - source
  - sink
  - path
  evidence:
    capture:
    - argument: 0
tests:
  positive:
  - x = flask.request.args.get('name'); flask.make_response(f'Hello {x}')
  negative:
  - x = flask.escape(flask.request.args.get('name')); flask.make_response(f'Hello
    {x}')

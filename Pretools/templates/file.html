{% extends "base.html" %}

{% block title %}文件: {{ filename }} - CodeQL 文件浏览器{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0">
            <i class="fas fa-file"></i> {{ filename }}
        </h5>
        <div>
            <a href="/download/{{ breadcrumbs[-1][1].split('/')[2:]|join('/') }}" 
               class="btn btn-sm btn-outline-primary me-2">
                <i class="fas fa-download"></i> 下载
            </a>
            <a href="/browse/{{ parent_path }}" class="btn btn-sm btn-outline-secondary">
                <i class="fas fa-arrow-left"></i> 返回
            </a>
        </div>
    </div>
    <div class="card-body">
        <div class="mb-3">
            <small class="text-muted">
                <i class="fas fa-map-marker-alt"></i> 路径: {{ filepath }}
            </small>
        </div>
        
        <div class="file-content p-3">
            <pre><code>{{ content }}</code></pre>
        </div>
        <div class="mb-3 mt-4">
            <small class="text-muted">
               import内容
            </small>
        </div>
          <div class="file-content p-3">
            <pre><code>{{ imports }}</code></pre>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}搜索: {{ query }} - CodeQL 文件浏览器{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h5 class="card-title mb-0">
            <i class="fas fa-search"></i> 搜索: "{{ query }}"
        </h5>
    </div>
    <div class="card-body">
        <form method="get" action="/search" class="mb-4">
            <div class="input-group">
                <input type="text" name="q" value="{{ query }}" 
                       class="form-control" placeholder="输入文件名进行搜索...">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-search"></i> 搜索
                </button>
            </div>
        </form>

        {% if results %}
        <div class="list-group">
            {% for result in results %}
            <a href="/browse/{{ result.path }}" 
               class="list-group-item list-group-item-action">
                <i class="fas fa-{{ 'file' if result.type == 'file' else 'folder' }} 
                   {{ 'file-icon' if result.type == 'file' else 'folder-icon' }}"></i>
                {{ result.name }}
                <small class="text-muted">({{ result.path }})</small>
            </a>
            {% endfor %}
        </div>
        {% elif query %}
        <div class="alert alert-info">
            <i class="fas fa-info-circle"></i> 没有找到匹配 "{{ query }}" 的文件或文件夹。
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}

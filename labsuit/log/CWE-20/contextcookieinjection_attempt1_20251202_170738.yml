rules:
- id: py/cookie-injection
  message: Cookie is constructed from a user-supplied input
  languages: [python]
  severity: WARNING
  metadata:
    cwe: "CWE-020"
    security-severity: 5.0
    category: security
    precision: high
    references:
    - kind: path-problem
  patterns:
  - pattern-inside: |
      $RESPONSE.set_cookie(
        ...
      )
  - pattern-either:
    - pattern: $RESPONSE.set_cookie($NAME, $VALUE)
    - pattern: $RESPONSE.set_cookie($HEADER)
  - metavariable-pattern:
      metavariable: $VALUE
      pattern-inside: |
        def $FUNC(..., $USER_INPUT, ...):
          ...
      patterns:
      - pattern-not: ...
      - focus-metavariable: $USER_INPUT
  - metavariable-pattern:
      metavariable: $NAME
      pattern-inside: |
        def $FUNC(..., $USER_INPUT, ...):
          ...
      patterns:
      - pattern-not: ...
      - focus-metavariable: $USER_INPUT
  - metavariable-pattern:
      metavariable: $HEADER
      pattern-inside: |
        def $FUNC(..., $USER_INPUT, ...):
          ...
      patterns:
      - pattern-not: ...
      - focus-metavariable: $USER_INPUT
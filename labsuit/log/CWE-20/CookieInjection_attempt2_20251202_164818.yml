rules:
- id: py/cookie-injection
  languages: [python]
  severity: WARNING
  message: "Cookie is constructed from a $@."
  metadata:
    description: "Constructing cookies from user input may allow an attacker to perform a Cookie Poisoning attack."
    security-severity: "5.0"
    precision: high
    tags:
      - security
      - external/cwe/cwe-020
    category: security
    cwe: "CWE-20: Improper Input Validation"
  mode: taint
  pattern-sources:
    - pattern-either:
      - pattern: $SOURCE.getNode()
  pattern-sinks:
    - pattern-either:
      - pattern: $SINK.getNode()
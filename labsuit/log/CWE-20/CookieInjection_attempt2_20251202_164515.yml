rules:
  - id: py/cookie-injection
    message: Constructing cookies from user input may allow an attacker to perform a Cookie Poisoning attack.
    languages:
      - python
    severity: WARNING
    metadata:
      cwe: "CWE-020"
      security-severity: 5.0
      precision: high
      category: security
    patterns:
      - pattern-either:
          - pattern: |
              $COOKIE = $INPUT
              ...
              set_cookie($COOKIE)
          - pattern: |
              set_cookie($INPUT)
      - metavariable-regex:
          metavariable: $INPUT
          regex: "(request\\.(args|values|form|cookies|headers)|environ|input)"
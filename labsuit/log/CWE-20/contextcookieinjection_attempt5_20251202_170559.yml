rules:
- id: py/cookie-injection
  languages: [python]
  severity: WARNING
  message: Cookie is constructed from a user-supplied input
  metadata:
    security-severity: 5.0
    precision: high
    references:
      - https://cwe.mitre.org/data/definitions/20.html
    category: security
    cwe: "CWE-20: Improper Input Validation"
    tags:
      - security
      - external/cwe/cwe-020
  mode: taint
  pattern-sources:
    - pattern: |
        $USER_INPUT
      - metavariable-pattern:
          metavariable: $USER_INPUT
          pattern-inside: |
            def $FUNC(..., $REQUEST, ...):
              ...
  pattern-sinks:
    - pattern: |
        $COOKIE = Cookie($NAME, $VALUE)
      - pattern: |
        $RESPONSE.set_cookie($NAME, $VALUE)
  pattern-sanitizers:
    - pattern: |
        sanitize($INPUT)
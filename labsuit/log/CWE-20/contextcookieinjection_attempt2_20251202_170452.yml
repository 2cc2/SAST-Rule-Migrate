rules:
- id: py/cookie-injection
  languages: [python]
  severity: WARNING
  message: "Cookie is constructed from a user-supplied input. This may allow an attacker to perform a Cookie Poisoning attack."
  metadata:
    cwe: "CWE-20: Improper Input Validation"
    security-severity: "5.0"
    category: security
    owasp: "A01:2017 - Injection"
    references:
      - https://cwe.mitre.org/data/definitions/20.html
  mode: taint
  pattern-sources:
    - pattern-either:
      - pattern: request.args[$ARG]
      - pattern: request.cookies[$COOKIE]
      - pattern: request.form[$FORM]
      - pattern: request.headers[$HEADER]
      - pattern: request.json[$JSON]
  pattern-sinks:
    - pattern: |
        $RESPONSE.set_cookie($NAME, $VALUE, ...)
      - metavariable-pattern:
          metavariable: $VALUE
          pattern: $SOURCE
  pattern-sanitizers:
    - pattern: |
        $SANITIZED = escape($INPUT)
      - pattern: |
        $INPUT = escape($INPUT)
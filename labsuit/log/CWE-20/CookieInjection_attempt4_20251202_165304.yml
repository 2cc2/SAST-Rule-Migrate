# 转换后的 Semgrep 规则
rules:
- id: cookie-injection
  languages: [python]
  severity: WARNING
  message: "Cookie is constructed from a user-supplied input"
  metadata:
    cwe: "CWE-020: Improper Input Validation"
    security-severity: 5.0
    precision: high
    references:
      - https://cwe.mitre.org/data/definitions/20.html
    tags:
      - security
      - external/cwe/cwe-020
  mode: taint
  pattern-sources:
    - patterns:
        - pattern: any_source()
  pattern-sinks:
    - patterns:
        - pattern: set_cookie(...)
        - pattern: Cookie.__init__(...)
        - pattern: SimpleCookie.__init__(...)
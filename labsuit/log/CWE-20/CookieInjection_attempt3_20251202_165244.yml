# 转换后的 Semgrep 规则
rules:
- id: cookie-injection
  languages: [python]
  severity: WARNING
  message: "Cookie is constructed from a user-supplied input"
  metadata:
    security-severity: "5.0"
    precision: high
    kind: path-problem
    problem.severity: warning
    cwe: "CWE-020: Improper Input Validation"
    severity: WARNING
    references:
      - https://cwe.mitre.org/data/definitions/20.html
    tags:
      - security
      - external/cwe/cwe-020
  mode: taint
  pattern-sources:
    - patterns:
        - pattern: source.getNode()
  pattern-sinks:
    - patterns:
        - pattern: sink.getNode()
  pattern-sanitizers:
    - patterns:
        - focus-metavariable: $SANITIZED
        - pattern-not: $SANITIZED
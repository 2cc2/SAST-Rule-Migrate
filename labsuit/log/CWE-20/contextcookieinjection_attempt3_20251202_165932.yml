# 转换后的 Semgrep 规则
rules:
- id: py/cookie-injection
  languages: [python]
  severity: WARNING
  message: Constructing cookies from user input may allow an attacker to perform a Cookie Poisoning attack.
  metadata:
    security-severity: 5.0
    cwe: "CWE-020: Improper Input Validation"
    category: security
    owasp:
      - "A03:2021 - Injection"
    technology:
      - web
    likelihood: MEDIUM
    impact: HIGH
    confidence: HIGH
  mode: taint
  pattern-sources:
    - pattern: request.$PARAM
    - pattern: request.$HEADER
    - pattern: request.$VALUE
    - pattern: request.$DATA
    - pattern: request.$QUERY
    - metavariable-regex:
        metavariable: $HEADER
        regex: (?i)cookie
  pattern-sinks:
    - pattern: Response.set_cookie(...,$VAL,...)
    - pattern: Response.add_cookie(...,$VAL,...)
    - pattern: HttpResponse.set_cookie(...,$VAL,...)
    - pattern: HttpResponse.add_cookie(...,$VAL,...)
    - pattern: SimpleCookie().output()
    - pattern: SimpleCookie().__str__()
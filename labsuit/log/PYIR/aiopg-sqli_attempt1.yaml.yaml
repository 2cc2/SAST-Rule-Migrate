```yaml
xcpgir_version: "1.0"
rule:
  id: aiopg-sqli
  kind: taint
  severity: WARNING
  message: "Detected string concatenation with a non-literal variable in an aiopg Python SQL statement. This could lead to SQL injection if the variable is user-controlled and not properly sanitized. In order to prevent SQL injection, use parameterized queries instead."
  metadata:
    language: python
    category: security
    cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
    technology: aiopg
    owasp:
      - "A01:2017 - Injection"
      - "A03:2021 - Injection"

sources:
  - id: USER_INPUT
    match:
      node: LITERAL
      where:
        - op: regex
          left: value
          right: ".*user.*control.*"

sinks:
  - id: SQL_EXEC
    match:
      node: CALL
      api: 
        type: aiopg
        method: execute
      arg_index: 0
      where:
        - op: regex
          left: methodFullName
          right: ".*execute.*"

sanitizers:
  - id: PARAMETERIZED_QUERY
    match:
      node: CALL
      api:
        type: aiopg
        method: execute
      where:
        - op: regex
          left: arg[0].value
          right: "SELECT %s.*"
    effect: neutralize

propagations:
  - id: STRING_CONCAT
    edge: arg->param
    kind: taint
```
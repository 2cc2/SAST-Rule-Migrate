```yaml
xcpgir_version: "1.0"
rule:
  id: "tainted-html-string"
  kind: taint
  severity: WARNING
  message: |
    Detected user input flowing into a manually constructed HTML string. You may be accidentally bypassing
    secure methods of rendering HTML by manually constructing HTML and this could create a cross-site scripting vulnerability,
    which could let attackers steal sensitive user data. To be sure this is safe, check that the HTML is rendered
    safely. Otherwise, use templates which will safely render HTML instead.
  metadata:
    language: python
    category: security
    cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
    owasp:
      - "A07:2017 - Cross-Site Scripting (XSS)"
      - "A03:2021 - Injection"
    technology:
      - "aws-lambda"

sources:
  - id: USER_INPUT
    match:
      node: METHOD_PARAMETER_IN
      where:
        - op: eq
          left: identifier
          right: "event"
        - op: regex
          left: context.code
          right: "def $HANDLER\\(event, context\\):"

sinks:
  - id: HTML_CONSTRUCTION
    match:
      node: CALL
      where:
        - op: regex
          left: code
          right: |
            ("$HTMLSTR" % ...) |
            ("$HTMLSTR".format(...)) |
            ("$HTMLSTR" + ...) |
            (f"$HTMLSTR{...}...")
        - op: regex
          left: code
          right: "(<[a-zA-Z]+)"
        - op: neq
          left: context.code
          right: "print(...)"

sanitizers: []

propagations: []
```
```yaml
xcpgir_version: "1.0"
rule:
  id: "dynamic-urllib-use-detected"
  kind: taint
  severity: WARNING
  message: "Detected a dynamic value being used with urllib. urllib supports 'file://' schemes, so a dynamic value controlled by a malicious actor may allow them to read arbitrary files. Audit uses of urllib calls to ensure user data cannot control the URLs, or consider using the 'requests' library instead."
  metadata:
    language: python
    category: security

sources:
  - id: USER_CONTROLLED_URL
    match:
      node: LITERAL
      where:
        - op: regex
          left: value
          right: ".*"

sinks:
  - id: UNSAFE_URL_OPEN
    match:
      node: CALL
      api:
        type: urllib
        methods: [urlopen, urlretrieve]
  - id: UNSAFE_OPENER_USE
    match:
      node: CALL
      api:
        type: urllib
        methods: [open, retrieve]
      where:
        - op: eq
          left: receiver.type
          right: OPENER_TYPE

sanitizers:
  - id: URL_VALIDATION
    match:
      node: CALL
      api:
        type: urllib
        method: ".*"
      where:
        - op: neq
          left: arg[0].value
          right: "file://*"

propagations:
  - id: URL_TO_OPENER
    edge: arg->param
    kind: taint
```
```yaml
xcpgir_version: "1.0"
rule:
  id: "tainted-sqli"
  kind: taint
  severity: WARNING
  message: "Detected SQL statement that is tainted by `$EVENT` object. This could lead to SQL injection if variables in the SQL statement are not properly sanitized. Use parameterized SQL queries or properly sanitize user input instead."
  metadata:
    language: java
    category: security
    technology:
      - sql
      - java
      - aws-lambda
    cwe:
      - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
    owasp:
      - A01:2017 - Injection
      - A03:2021 - Injection
    references:
      - https://owasp.org/Top10/A03_2021-Injection
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM

sources:
  - id: EVENT_OBJECT
    match:
      node: METHOD_PARAMETER_IN
      where:
        - op: or
          conditions:
            - op: eq
              left: typeFullName
              right: "$TYPE"
            - op: eq
              left: typeFullName
              right: "InputStream"

sinks:
  - id: SQL_EXECUTION
    match:
      node: CALL
      api:
        type: "java.sql.Statement"
        method: 
          - "execute"
          - "executeQuery"
          - "executeUpdate"
          - "batchUpdate"
      where:
        - op: regex
          left: code
          right: "(?i)(^SELECT.* | ^INSERT.* | ^UPDATE.*)"

propagations:
  - id: PARAM_TO_SQL
    edge: arg->param
    kind: taint
```
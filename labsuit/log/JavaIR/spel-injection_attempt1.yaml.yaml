```yaml
xcpgir_version: "1.0"
rule:
  id: spel-injection
  kind: taint
  severity: WARNING
  message: "A Spring expression is built with a dynamic value. The source of the value(s) should be verified to avoid that unfiltered values fall into this risky code evaluation."
  tags:
    - spring
    - java
  metadata:
    language: java
    category: security

sources:
  - id: USER_INPUT
    match:
      node: CALL
      api:
        package: org.springframework.expression
        type: ExpressionParser
        method: parseExpression
      arg_index: 0

sinks:
  - id: CODE_EVALUATION
    match:
      node: CALL
      api:
        package: org.springframework.expression
        type: ExpressionParser
        method: parseExpression
      arg_index: 0

sanitizers:
  - id: LITERAL_EXPRESSION
    match:
      node: LITERAL
      where:
        - op: eq
          left: value
          right: "..."
    effect: neutralize
    scope:
      sinks: [CODE_EVALUATION]

propagations:
  - id: METHOD_TO_ARG
    edge: arg->param
    kind: taint
```
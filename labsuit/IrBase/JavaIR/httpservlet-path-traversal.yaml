```yaml
xcpgir_version: "1.0"
rule:
  id: "httpservlet-path-traversal"
  kind: taint
  severity: ERROR
  message: "Detected a potential path traversal. A malicious actor could control the location of this file, to include going backwards in the directory with '../'. To address this, ensure that user-controlled variables in file paths are sanitized. You may also consider using a utility method such as org.apache.commons.io.FilenameUtils.getName(...) to only retrieve the file name from the path."
  metadata:
    language: java
    category: security
    cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
    owasp:
      - "A05:2017 - Broken Access Control"
      - "A01:2021 - Broken Access Control"
    references:
      - "https://www.owasp.org/index.php/Path_Traversal"
sources:
  - id: HTTP_REQUEST
    match:
      node: METHOD_PARAMETER_IN
      api:
        type: javax.servlet.http.HttpServletRequest
  - id: COOKIE_VALUE
    match:
      node: CALL
      api:
        type: javax.servlet.http.Cookie
        method: getValue
  - id: ARRAY_VALUE
    match:
      node: LOCAL
      where:
        - op: eq
          left: "type"
          right: "array"
sinks:
  - id: FILE_CONSTRUCTOR
    match:
      node: CALL
      api:
        type: java.io.File
  - id: FILE_OUTPUT_STREAM
    match:
      node: CALL
      api:
        type: java.io.FileOutputStream
  - id: FILE_INPUT_STREAM
    match:
      node: CALL
      api:
        type: java.io.FileInputStream
sanitizers:
  - id: FILENAME_UTILS
    match:
      node: CALL
      api:
        type: org.apache.commons.io.FilenameUtils
        method: getName
    effect: neutralize
propagations:
  - id: REQUEST_TO_COOKIE
    edge: arg->param
    kind: taint
  - id: ARRAY_TO_ELEMENT
    edge: array
    kind: taint
```
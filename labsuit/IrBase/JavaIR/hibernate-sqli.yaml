```yaml
xcpgir_version: "1.0"
rule:
  id: hibernate-sqli
  kind: taint
  severity: WARNING
  message: "Detected a formatted string in a SQL statement. This could lead to SQL injection if variables in the SQL statement are not properly sanitized. Use a prepared statements (java.sql.PreparedStatement) instead. You can obtain a PreparedStatement using 'connection.prepareStatement'."
  tags:
    - java
    - hibernate
  metadata:
    language: java
    category: security
    cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
    owasp:
      - "A01:2017 - Injection"
      - "A03:2021 - Injection"

sources:
  - id: SQL_FORMATTED_STRING
    match:
      node: CALL
      api:
        type: java.lang.String
        method: format
  - id: SQL_STRING_CONCAT
    match:
      node: ASSIGNMENT
      where:
        - op: regex
          left: code
          right: "String.*=.*\\+.*"

sinks:
  - id: SQL_RESTRICTION
    match:
      node: CALL
      api:
        type: org.hibernate.criterion.Restrictions
        method: sqlRestriction
      arg_index: 0
  - id: SESSION_METHOD
    match:
      node: CALL
      api:
        type: org.hibernate.Session
        method:
          regex: "^(createQuery|createSQLQuery)$"
      arg_index: 0

sanitizers:
  - id: STRING_CONCAT_LITERAL
    match:
      node: ASSIGNMENT
      where:
        - op: regex
          left: code
          right: 'String.*=.*".*" *\+ *".*"'

propagations:
  - id: STRING_TO_SQL
    edge: arg->param
    kind: taint
```
```yaml
xcpgir_version: "1.0"
rule:
  id: "jpa-sqli"
  kind: taint
  severity: WARNING
  message: "Detected a formatted string in a SQL statement. This could lead to SQL injection if variables in the SQL statement are not properly sanitized. Use a prepared statements (java.sql.PreparedStatement) instead. You can obtain a PreparedStatement using 'connection.prepareStatement'."
  metadata:
    language: "java"
    category: "security"
    cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
    owasp:
      - "A01:2017 - Injection"
      - "A03:2021 - Injection"

sources:
  - id: SQL_CONCAT
    match:
      node: CALL
      api:
        type: "java.lang.String"
        method: "format"
    match:
      node: BINARY_OP
      op: "+"
      where:
        - op: regex
          left: left.typeFullName
          right: "java.lang.String"
        - op: regex
          left: right.typeFullName
          right: "java.lang.String"
  - id: METHOD_PARAM_SQL
    match:
      node: METHOD_PARAMETER_IN
      where:
        - op: regex
          left: typeFullName
          right: "java.lang.String"
        - op: regex
          left: name
          right: "(?i).*sql.*"

sinks:
  - id: SQL_EXECUTION
    match:
      node: CALL
      api:
        type: "javax.persistence.EntityManager"
        method: "createQuery|createNativeQuery"
      arg_index: 0

sanitizers:
  - id: LITERAL_CONCAT
    match:
      node: LITERAL
      where:
        - op: regex
          left: value
          right: '^"[^"]*"\s*\+\s*"[^"]*"$'
    effect: neutralize

propagations:
  - id: ARG_TO_PARAM
    edge: arg->param
    kind: taint
```
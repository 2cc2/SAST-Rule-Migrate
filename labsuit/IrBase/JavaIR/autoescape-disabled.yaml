```yaml
xcpgir_version: "1.0"
rule:
  id: "autoescape-disabled"
  kind: pattern
  severity: WARNING
  message: "Detected an element with disabled HTML escaping. If external data can reach this, this is a cross-site scripting (XSS) vulnerability. Ensure no external data can reach here, or remove 'escape=false' from this element."
  metadata:
    language: regex
    category: security
    owasp: "A07:2017 - Cross-Site Scripting (XSS)"
    cwe: "CWE-150: Improper Neutralization of Escape, Meta, or Control Sequences"
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW

sources:
  - id: HTML_ESCAPE_DISABLED
    match:
      node: LITERAL
      where:
        - op: regex
          left: value
          right: ".*escape.*?=.*?false.*"

sinks:
  - id: XSS_SINK
    match:
      node: LITERAL
      where:
        - op: regex
          left: value
          right: ".*escape.*?=.*?false.*"

sanitizers:
  - id: REMOVE_ESCAPE_FALSE
    match:
      node: LITERAL
      where:
        - op: regex
          left: value
          right: ".*escape.*?=.*?false.*"
    effect: neutralize

propagations: []
```
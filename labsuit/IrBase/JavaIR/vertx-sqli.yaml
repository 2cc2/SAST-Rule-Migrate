```yaml
xcpgir_version: "1.0"
rule:
  id: vertx-sqli
  kind: taint
  severity: WARNING
  message: "Detected a formatted string in a SQL statement. This could lead to SQL injection if variables in the SQL statement are not properly sanitized. Use a prepared statements (java.sql.PreparedStatement) instead. You can obtain a PreparedStatement using 'connection.prepareStatement'."
  metadata:
    language: java
    category: security
    cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
    owasp: ["A01:2017 - Injection", "A03:2021 - Injection"]
    technology: ["vertx"]
sources:
  - id: FORMATTED_SQL
    match:
      node: CALL
      api:
        type: java.lang.String
        method: format
  - id: CONCAT_SQL
    match:
      node: ASSIGNMENT
      where:
        - op: regex
          left: value
          right: String \$SQL = \$X \+ \$Y
sinks:
  - id: SQL_EXEC
    match:
      node: CALL
      api:
        type: io.vertx.sqlclient.SqlClient
        method: query|preparedQuery|prepare
      arg_index: 0
  - id: SQL_EXEC_CONN
    match:
      node: CALL
      api:
        type: io.vertx.sqlclient.SqlConnection
        method: query|preparedQuery|prepare
      arg_index: 0
sanitizers:
  - id: LITERAL_SQL
    match:
      node: LITERAL
      where:
        - op: regex
          left: value
          right: ^\"...\" \+ \"...\"$
    effect: neutralize
propagations:
  - id: SQL_TO_METHOD
    edge: arg->param
    kind: taint
```
```yaml
xcpgir_version: "1.0"
rule:
  id: tainted-sql-string
  kind: taint
  severity: ERROR
  message: User data flows into this manually-constructed SQL string. User data can be safely inserted into SQL strings using prepared statements or an object-relational mapper (ORM). Manually-constructed SQL strings is a possible indicator of SQL injection, which could let an attacker steal or manipulate data from the database. Instead, use prepared statements (`connection.PreparedStatement`) or a safe library.
  metadata:
    language: java
    category: security
    tags:
      - spring
    cwe:
      - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
    owasp:
      - A01:2017 - Injection
      - A03:2021 - Injection

sources:
  - id: USER_INPUT
    match:
      node: METHOD_PARAMETER_IN
      where:
        - op: regex
          left: typeFullName
          right: ^(?!(Integer|Long|Float|Double|Char|Boolean|int|long|float|double|char|boolean))
        - op: regex
          left: annotationFullName
          right: (RequestBody|PathVariable|RequestParam|RequestHeader|CookieValue)

sinks:
  - id: SQL_CONCAT
    match:
      node: CALL
      where:
        - op: or
          clauses:
            - left: methodFullName
              op: regex
              right: "\\.concat"
            - left: methodFullName
              op: regex
              right: "\\.append"
            - left: methodFullName
              op: regex
              right: "String\\.format"
        - op: regex
          left: receiver.typeFullName
          right: java.lang.String
        - op: regex
          left: argument(0).code
          right: (?i)(select|delete|insert|create|update|alter|drop)\b
      not:
        - op: regex
          left: methodFullName
          right: (System\\.out\\.println|LOG\\.(info|warn|warning|debug|debugging|error)|Exception)

sanitizers: []

propagations:
  - id: ARG_TO_PARAM
    edge: arg->param
    kind: taint
```
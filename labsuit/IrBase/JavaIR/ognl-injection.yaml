```yaml
xcpgir_version: "1.0"
rule:
  id: "ognl-injection"
  kind: "taint"
  severity: "WARNING"
  message: "A expression is built with a dynamic value. The source of the value(s) should be verified to avoid that unfiltered values fall into this risky code evaluation."
  metadata:
    language: "java"
    category: "security"
    cwe: "CWE-94: Improper Control of Generation of Code ('Code Injection')"
    owasp: "A03:2021 - Injection"
    technology: "ognl"

sources:
  - id: "USER_INPUT"
    match:
      node: "PARAM"
      where:
        - op: "ne"
          left: "value"
          right: ""

sinks:
  - id: "OGNL_INJECTION"
    match:
      node: "CALL"
      api:
        package: "ognl"
        type: "OgnlReflectionProvider|ReflectionProvider|TextParseUtil|TextParser|OgnlTextParser|OgnlUtil|VelocityStrutsUtil|StrutsUtil|OgnlTool|ValueStack"
        method: "getGetMethod|getSetMethod|getField|setProperties|setProperty|getValue|setValue|translateVariables|translateVariablesCollection|shallBeIncluded|commaDelimitedStringToSet|evaluate|callMethod|compile|isTrue|findString|findValue|getText|makeSelectList|setParameter"
      arg_index: 0

sanitizers:
  - id: "STRING_LITERAL"
    match:
      node: "LITERAL"
      where:
        - op: "regex"
          left: "value"
          right: '^".*"$'
    effect: "neutralize"
    scope:
      sinks: ["OGNL_INJECTION"]

propagations:
  - id: "ARG_TO_PARAM"
    edge: "arg->param"
    kind: "taint"
```
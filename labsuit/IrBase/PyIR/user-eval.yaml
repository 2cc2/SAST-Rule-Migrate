```yaml
xcpgir_version: "1.0"
rule:
  id: eval-injection
  kind: taint
  severity: ERROR
  message: "Detected user data flowing into eval. This is code injection and should be avoided."
  metadata:
    language: python
    category: security
    cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
    owasp: "A03:2021 - Injection"
    technology: flask
    confidence: MEDIUM
    impact: MEDIUM
    likelihood: MEDIUM

sources:
  - id: ROUTE_PARAMETER
    match:
      node: PARAM
      where:
        - op: regex
          left: name
          right: "\$ROUTEVAR"
  - id: FLASK_REQUEST
    match:
      node: CALL
      api:
        package: flask
        type: request
        method: "$W"
        signature: ["(...)", "[...]", "get(...)"]

sinks:
  - id: EVAL_CALL
    match:
      node: CALL
      api:
        package: builtins
        type: ""
        method: eval
        signature: ["(...)"]

propagations:
  - id: ROUTE_TO_EVAL
    edge: arg->param
    kind: taint
  - id: REQUEST_TO_EVAL
    edge: arg->param
    kind: taint
  - id: INTERMEDIATE_ASSIGNMENT
    edge: alias
    kind: taint

sanitizers: []
```
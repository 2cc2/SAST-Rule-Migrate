```yaml
xcpgir_version: "1.0"
rule:
  id: os-system-injection
  kind: taint
  severity: ERROR
  message: "User data detected in os.system. This could be vulnerable to a command injection and should be avoided. If this must be done, use the 'subprocess' module instead and pass the arguments as a list."
  metadata:
    language: python
    category: security
    cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
    owasp:
      - "A01:2017 - Injection"
      - "A03:2021 - Injection"
    technology:
      - flask
    tags:
      - command-injection
      - python
      - flask

sources:
  - id: ROUTE_PARAM
    match:
      node: PARAM
      where:
        - op: regex
          left: name
          right: "\$ROUTEVAR"
  - id: FLASK_REQUEST
    match:
      node: CALL
      api:
        package: flask
        type: request
        method: "$W"
        signature: ["(...)"]

sinks:
  - id: OS_SYSTEM
    match:
      node: CALL
      api:
        package: os
        type: system
        method: system
        signature: ["(...)"]
      arg_index: 0

propagations:
  - id: PARAM_TO_SYSTEM
    edge: arg->param
    kind: taint
  - id: REQUEST_TO_SYSTEM
    edge: arg->param
    kind: taint
  - id: INTERM_TO_SYSTEM
    edge: arg->param
    kind: taint
```
```yaml
xcpgir_version: "1.0"
rule:
  id: sqlalchemy-sqli
  kind: taint
  severity: WARNING
  message: "Detected SQL statement that is tainted by `event` object. This could lead to SQL injection if the variable is user-controlled and not properly sanitized. In order to prevent SQL injection, use parameterized queries or prepared statements instead."
  tags:
    - python
    - sqlalchemy
    - aws-lambda
  metadata:
    language: python
    category: security

sources:
  - id: EVENT_OBJECT
    match:
      node: IDENTIFIER
      where:
        - op: eq
          left: name
          right: event
      pattern-inside: |
        def $HANDLER(event, context):
          ...

sinks:
  - id: SQL_EXECUTE
    match:
      node: CALL
      api:
        type: sqlalchemy.engine.Cursor
        method: execute
      arg_index: 0
      pattern-inside: |
        import sqlalchemy
        ...

propagations:
  - id: EVENT_TO_QUERY
    edge: arg->param
    kind: taint
```
```yaml
xcpgir_version: "1.0"
rule:
  id: "sqlalchemy-execute-raw-query"
  kind: taint
  severity: ERROR
  message: >-
    Avoiding SQL string concatenation: untrusted input concatenated with raw
    SQL query can result in SQL Injection. In order to execute raw query
    safely, prepared statement should be used.
    SQLAlchemy provides TextualSQL to easily used prepared statement with
    named parameters. For complex SQL composition, use SQL Expression
    Language or Schema Definition Language. In most cases, SQLAlchemy ORM
    will be a better option.
  metadata:
    language: python
    category: security
    cwe:
      - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
    owasp:
      - "A01:2017 - Injection"
      - "A03:2021 - Injection"

sources:
  - id: SQL_STRING_CONCAT
    match:
      node: CALL
      where:
        - op: regex
          left: methodFullName
          right: "\\.execute$"
      arg_index: 0

sinks:
  - id: SQL_INJECTION
    match:
      node: CALL
      api:
        package: sqlalchemy
        method: execute
      arg_index: 0

sanitizers:
  - id: SAFE_SQL_CONSTRUCTION
    match:
      node: CALL
      api:
        package: sqlalchemy
        method: text
    effect: neutralize
    scope:
      sinks: [SQL_INJECTION]
```
```yaml
xcpgir_version: "1.0"
rule:
  id: "tainted-code-exec"
  kind: taint
  severity: WARNING
  message: "Detected the use of `exec/eval`.This can be dangerous if used to evaluate dynamic content. If this content can be input from outside the program, this may be a code injection vulnerability. Ensure evaluated content is not definable by external sources."
  metadata:
    language: python
    category: security

sources:
  - id: EVENT_INPUT
    match:
      node: METHOD_PARAMETER_IN
      where:
        - op: eq
          left: name
          right: "event"
        - op: inside
          left: methodFullName
          right: "$HANDLER"

sinks:
  - id: CODE_EXECUTION
    match:
      node: CALL
      api:
        method: "eval"
      arg_index: 0
  - id: CODE_EXECUTION
    match:
      node: CALL
      api:
        method: "exec"
      arg_index: 0
```
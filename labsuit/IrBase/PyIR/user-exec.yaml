```yaml
xcpgir_version: "1.0"
rule:
  id: exec-injection
  kind: taint
  severity: ERROR
  message: Detected user data flowing into exec. This is code injection and should be avoided.
  metadata:
    language: python
    category: security
    cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
    owasp: "A03:2021 - Injection"
    technology: flask
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM

sources:
  - id: ROUTE_VAR
    match:
      node: METHOD_PARAMETER_IN
      where:
        - op: inside
          left: code
          right: "@$APP.route($ROUTE, ...)\n  def $FUNC(..., $ROUTEVAR, ...)"
  - id: FLASK_REQUEST
    match:
      node: CALL
      api:
        package: flask.request
        type: request
        method: [get, __getitem__, __call__]

sinks:
  - id: EXEC_CALL
    match:
      node: CALL
      api:
        package: builtins
        type: 
        method: exec
      arg_index: 0

propagations:
  - id: PARAM_TO_EXEC
    edge: arg->param
    kind: taint
  - id: INTERM_TO_EXEC
    edge: arg->param
    kind: taint
```
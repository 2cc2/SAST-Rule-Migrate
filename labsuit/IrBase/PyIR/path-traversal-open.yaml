```yaml
xcpgir_version: "1.0"
rule:
  id: "path-traversal-open"
  kind: taint
  severity: ERROR
  message: "Found request data in a call to 'open'. Ensure the request data is validated or sanitized, otherwise it could result in path traversal attacks."
  metadata:
    language: "python"
    category: "security"
    cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"]
    owasp:
      - "A05:2017 - Broken Access Control"
      - "A01:2021 - Broken Access Control"
    technology: ["flask"]

sources:
  - id: "ROUTE_VAR"
    match:
      node: "METHOD_PARAMETER_IN"
      where:
        - op: "regex"
          left: "name"
          right: "^\\$ROUTEVAR$"

  - id: "FLASK_REQUEST"
    match:
      node: "CALL"
      api:
        package: "flask"
        type: "request"
        method: "$W"
        signature: ["(...)"]

  - id: "INTERMEDIARY_VAR"
    match:
      node: "LOCAL"
      where:
        - op: "regex"
          left: "assignment.source.value"
          right: "(flask\\.request|\$ROUTEVAR)"

sinks:
  - id: "FILE_OPEN"
    match:
      node: "CALL"
      api:
        package: "__builtin__"
        type: ""
        method: "open"
        signature: ["(...)"]

propagations:
  - id: "VAR_TO_OPEN"
    edge: "arg->param"
    kind: "taint"
  - id: "PROP_FIELD"
    edge: "field-load"
    kind: "taint"
  - id: "PROP_ARRAY"
    edge: "array"
    kind: "taint"
  - id: "PROP_ASSIGN"
    edge: "alias"
    kind: "taint"

sanitizers: []
```
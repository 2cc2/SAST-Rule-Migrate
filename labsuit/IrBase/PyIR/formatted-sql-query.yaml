```yaml
xcpgir_version: "1.0"
rule:
  id: formatted-sql-query
  kind: taint
  severity: WARNING
  message: "Detected possible formatted SQL query. Use parameterized queries instead."
  metadata:
    language: python
    category: security
    owasp:
      - "A01:2017 - Injection"
      - "A03:2021 - Injection"
    cwe:
      - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
    references:
      - "https://stackoverflow.com/questions/775296/mysql-parameterized-queries"
    technology:
      - "python"
    subcategory:
      - "audit"
    likelihood: "LOW"
    impact: "HIGH"
    confidence: "LOW"

sources:
  - id: SQL_FORMAT_PERCENT
    match:
      node: CALL
      where:
        - op: regex
          left: code
          right: '\\.\\.\\.\\s*%\\.\\.\\.'
  - id: SQL_FORMAT_FUNC
    match:
      node: CALL
      where:
        - op: regex
          left: methodFullName
          right: '.*\\.format'
  - id: SQL_FORMAT_FSTRING
    match:
      node: LITERAL
      where:
        - op: contains
          left: code
          right: 'f\"'

sinks:
  - id: SQL_EXEC
    match:
      node: CALL
      api:
        method: execute
      arg_index: 0

sanitizers: []

propagations:
  - id: STRING_FORMAT_TO_SQL
    edge: arg->param
    kind: taint
    where:
      - op: in
        left: srcNode.kind
        right: ["SQL_FORMAT_PERCENT", "SQL_FORMAT_FUNC", "SQL_FORMAT_FSTRING"]
      - op: eq
        left: dstNode.id
        right: "SQL_EXEC"
```
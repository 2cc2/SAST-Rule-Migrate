```yaml
xcpgir_version: "1.0"
rule:
  id: nan-injection
  kind: taint
  severity: ERROR
  message: Found user input going directly into typecast for bool(), float(), or complex(). This allows an attacker to inject Python's not-a-number (NaN) into the typecast. This results in undefind behavior, particularly when doing comparisons. Either cast to a different type, or add a guard checking for all capitalizations of the string 'nan'.
  metadata:
    language: python
    category: security
    references:
      - https://discuss.python.org/t/nan-breaks-min-max-and-sorting-functions-a-solution/2868
      - https://blog.bitdiscovery.com/2021/12/python-nan-injection/
    cwe: 'CWE-704: Incorrect Type Conversion or Cast'
    technology: flask
    impact: MEDIUM
    likelihood: MEDIUM
    confidence: MEDIUM

sources:
  - id: FLASK_REQUEST
    match:
      node: CALL
      api:
        package: flask
        type: request
        method: get
  - id: ROUTE_VAR
    match:
      node: METHOD_PARAMETER_IN
      where:
        - op: regex
          left: name
          right: \$ROUTEVAR

sinks:
  - id: TYPECAST
    match:
      node: CALL
      where:
        - op: in
          left: code
          right: ["float(...)", "bool(...)", "complex(...)"]

sanitizers:
  - id: ANY_CALL
    match:
      node: CALL
      where:
        - op: exists
          left: code
    effect: neutralize

propagations:
  - id: ARG_TO_ARG
    edge: arg->param
    kind: taint
```
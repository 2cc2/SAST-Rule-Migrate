```yaml
xcpgir_version: "1.0"
rule:
  id: pymssql-sqli
  kind: taint
  severity: WARNING
  message: "Detected SQL statement that is tainted by `event` object. This could lead to SQL injection if the variable is user-controlled and not properly sanitized. In order to prevent SQL injection, use parameterized queries or prepared statements instead."
  metadata:
    language: python
    category: security
    tags:
      - aws-lambda
      - pymssql

sources:
  - id: EVENT_PARAM
    match:
      node: METHOD_PARAMETER_IN
      where:
        - op: eq
          left: name
          right: event

sinks:
  - id: SQL_EXEC
    match:
      node: CALL
      api:
        type: pymssql.Cursor
        method: execute
      arg_index: 0

sanitizers: []

propagations:
  - id: PARAM_TO_EXEC
    edge: arg->param
    kind: taint
```
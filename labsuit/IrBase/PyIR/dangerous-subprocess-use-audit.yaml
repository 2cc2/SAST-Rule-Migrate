```yaml
xcpgir_version: "1.0"
rule:
  id: "dangerous-subprocess-use-audit"
  kind: taint
  severity: ERROR
  message: "Detected subprocess function '$FUNC' without a static string. If this data can be controlled by a malicious actor, it may be an instance of command injection. Audit the use of this call to ensure it is not controllable by an external resource. You may consider using 'shlex.escape()'."
  metadata:
    language: "python"
    category: "security"
    owasp:
      - "A01:2017 - Injection"
      - "A03:2021 - Injection"
    cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
    references:
      - "https://stackoverflow.com/questions/3172470/actual-meaning-of-shell-true-in-subprocess"
      - "https://docs.python.org/3/library/subprocess.html"
      - "https://docs.python.org/3/library/shlex.html"
      - "https://semgrep.dev/docs/cheat-sheets/python-command-injection/"

sources:
  - id: "SUB_PROCESS_CALL"
    match:
      node: "CALL"
      api:
        package: "subprocess"
        type: ""
        method: "$FUNC"
      where:
        - op: "regex"
          left: "api.method"
          right: ".*"

sinks:
  - id: "COMMAND_INJECTION"
    match:
      node: "CALL"
      api:
        package: "subprocess"
        type: ""
        method: "$FUNC"
      where:
        - op: "regex"
          left: "arg[0].value"
          right: "^(sh|bash|ksh|csh|tcsh|zsh|python)"

sanitizers:
  - id: "SAFE_SUBPROCESS_USE"
    match:
      node: "CALL"
      api:
        package: "subprocess"
        type: ""
        method: "$FUNC"
      where:
        - op: "eq"
          left: "arg[0].value"
          right: "..."
    effect: "neutralize"

propagations:
  - id: "ARG_TO_EXEC"
    edge: "arg->param"
    kind: "taint"
```